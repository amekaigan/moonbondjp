<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Moonbond · Full Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* The paid reading: two birthdays in, eight chapters out. Indigo night and washi paper, same family as the free page. */
:root{
  --night:#12264f; --night-2:#1b3668; --night-3:#2b4c87; --paper:#f6f0e1; --paper-2:#e9e0ca; --ink:#1d1b27; --ink-2:#55506a;
  --shu:#d4472a; --kin:#d6b05a; --mist:#bcc8e2; --hair:rgba(255,255,255,.18);
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.6}
p,ul,ol,h1,h2,h3,fieldset,legend{margin:0;padding:0}
ul,ol{list-style:none}
fieldset{border:0;min-width:0}
.wrap{width:100%;max-width:680px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--display);line-height:1.25;font-weight:800;text-wrap:balance}
:focus-visible{outline:3px solid var(--kin);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:8px}
.brand-moon{width:18px;height:18px;border-radius:50%;box-shadow:inset -6px 0 0 0 var(--kin)}
.brand-name{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.04em}
.brand-jp{font-family:var(--display);color:var(--kin);font-size:14px}
.lang{display:flex;gap:2px;border:1px solid var(--hair);border-radius:999px;padding:3px}
.lang button{appearance:none;border:0;background:transparent;color:var(--mist);font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}

.intro{display:flex;flex-direction:column;gap:14px;padding-top:10px;padding-bottom:26px}
.intro-head{display:grid;grid-template-columns:1fr 84px;gap:14px;align-items:center}
.intro-head img{width:84px;height:84px;display:block}
.intro h1{font-size:clamp(26px,7.4vw,38px)}
.intro-sub{color:var(--mist);font-size:15px}
form{display:flex;flex-direction:column;gap:14px}
legend{font-weight:700;font-size:15px;margin-bottom:6px}
.date-row{display:grid;grid-template-columns:1.5fr .9fr 1.1fr;gap:8px}
.date-row label{display:flex;flex-direction:column;gap:4px;min-width:0}
.date-row label span{font-size:12px;color:var(--mist)}
select{width:100%;min-width:0;background:var(--night-2);color:var(--paper);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:12px 10px;font-size:16px;font-family:inherit}
.btn{appearance:none;background:var(--shu);color:#fff6ea;border:1px solid var(--shu);border-radius:10px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;text-align:center;font-family:inherit}
.err{color:#ffc9b8;font-size:14px;min-height:1px}

#reading{display:flex;flex-direction:column;gap:16px;padding-bottom:40px}
#reading[hidden]{display:none}
.cover{background:var(--night-2);border:1px solid var(--hair);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.cover-cats{display:flex;gap:10px;align-items:flex-end;justify-content:flex-end;position:absolute;right:16px;top:16px}
.cover-cats img{height:64px;width:auto;display:block}
.cover-for{font-size:13px;color:var(--mist);padding-right:120px}
.cover-names{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.3;padding-right:120px}
.cover-bond{color:var(--kin);font-family:var(--display);font-weight:700;font-size:16px}
.cover-title{font-family:var(--display);font-weight:800;font-size:25px;line-height:1.38;white-space:pre-line}
.cover-sub{font-size:16px;line-height:1.65}
#wheel{width:100%;max-width:320px;height:auto;display:block;margin:4px auto 0}
#wheel text{font-family:var(--display);fill:var(--mist);font-size:12px}
#wheel .a text{fill:var(--ink)}
#wheel .b text{fill:#fff6ea}
#wheel .mid1{fill:var(--paper);font-size:34px;font-weight:800}
#wheel .mid2{fill:var(--kin);font-size:13px;font-family:var(--body);font-weight:700}
.legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--mist)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

.ch{background:var(--paper);color:var(--ink);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.ch-head{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.ch-num{width:44px;height:44px;border-radius:50%;background:var(--night);color:var(--kin);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.ch-label{font-size:12.5px;font-weight:700;color:var(--shu)}
.ch h2{font-size:21px;line-height:1.35}
.ch p{font-size:16px;line-height:1.85}
html[lang="ja"] .ch p{line-height:1.95}
html[lang="ja"] h1,html[lang="ja"] h2,html[lang="ja"] .closing .line{text-wrap:wrap}
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.side{background:var(--paper-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.mini{font-size:12.5px;font-weight:700;color:var(--shu)}
.side-name{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.3}
.side p{font-size:15px;line-height:1.7}
.meter{display:grid;gap:10px}
.meter-row{display:grid;grid-template-columns:7.2em 1fr 3.2em;align-items:center;gap:12px;font-size:14.5px;font-weight:700}
.pbar{display:block;height:12px;border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:6px}
.pct{font-family:var(--display);font-weight:800;font-size:18px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.pct small{font-size:12px;font-weight:700;margin-left:1px}
@media (prefers-reduced-motion:no-preference){.pbar i{animation:pgrow 1s cubic-bezier(.2,.7,.2,1) both}@keyframes pgrow{from{width:0}}}
.pbar{background:rgba(29,27,39,.12)}
.pbar i{background:var(--shu)}
.pct{color:var(--ink)}
.room-bar{display:grid;grid-template-columns:1fr 3.2em;align-items:center;gap:12px}
.who-card{background:var(--paper-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.who-art{display:block;width:calc(100% + 28px);height:auto;aspect-ratio:5/4;object-fit:cover;margin:-14px -14px 2px}
.ch h3{font-family:var(--display);font-size:18px;margin-top:6px}
.pros{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pro{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pro.good{background:#e5f1ea}.pro.care{background:#f8e6df}
.pro-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.pro-ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff6ea}
.pro.good .pro-ic{background:#2f7d5b}.pro.care .pro-ic{background:var(--shu)}
.pro ul{margin:0;padding-left:20px;list-style:disc;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.6}
.tcmp{display:grid;gap:10px}
.tc-row{display:grid;grid-template-columns:5.5em 1fr;gap:10px;align-items:center}
.tc-name{font-weight:700;font-size:14px}
.tc-row.gap .tc-name{color:var(--shu)}
.tc-bars{display:flex;flex-direction:column;gap:4px}
.tc-bar{display:block;height:11px;border-radius:6px;background:rgba(29,27,39,.12);overflow:hidden}
.tc-bar i{display:block;height:100%;border-radius:6px}
.own{display:inline-block;font-size:11.5px;font-weight:800;background:var(--kin);color:var(--ink);border-radius:999px;padding:1px 8px;margin-right:6px}
.who-top{display:flex;align-items:center;gap:12px}
.who-disc{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:25px;background:var(--kin);color:var(--ink)}
.who-disc.b{background:var(--shu);color:#fff6ea}
.who-tag{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.who-name{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.25}
.who-arch{font-size:14px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--paper);color:var(--ink)}
.who-card p{font-size:15px;line-height:1.75}
.dots li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:16px;line-height:1.7}
.dots{display:flex;flex-direction:column;gap:8px}
.dots svg{width:20px;height:20px;margin-top:4px}
.try{background:var(--night);color:var(--paper);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.try .mini{color:var(--kin)}
.try p{font-size:16px;line-height:1.65;font-weight:700}
.gift{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;background:#fbf3d9;border-radius:12px;padding:14px 16px}
.gift svg{width:24px;height:24px;margin-top:2px}
.gift .mini{color:#8a6410}
.gift p{font-family:var(--display);font-weight:700;font-size:16.5px;line-height:1.75}
.rooms{display:flex;flex-direction:column;gap:10px}
.room{background:var(--paper-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.room-name{font-family:var(--display);font-weight:800;font-size:17px}
.room p{font-size:15px;line-height:1.7}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--paper-2);border-radius:12px;padding:14px}
.step-n{width:34px;height:34px;border-radius:50%;background:var(--shu);color:#fff6ea;display:grid;place-items:center;font-weight:700}
.step strong{display:block;font-family:var(--display);font-size:17.5px;line-height:1.4}
.step p{font-size:15px;line-height:1.75;margin-top:4px}
.step-lead{display:block;font-size:14px;color:var(--ink-2);margin-bottom:2px}
.closing{background:var(--night-2);border:1px solid var(--hair);border-radius:18px;padding:24px 20px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.closing img{width:64px;height:64px}
.closing .for{font-size:13px;font-weight:700;color:var(--kin)}
.closing .line{font-family:var(--display);font-weight:500;font-size:17.5px;line-height:1.9;text-align:left}
.closing .fine{font-size:12.5px;color:var(--mist);max-width:36em}
@media print{
  body{background:#fff;color:#000}
  .top,.intro{display:none}
  .ch,.cover,.closing{break-inside:avoid;border:1px solid #ccc}
}
</style>

<body>
<header class="wrap top">
  <div class="brand"><span class="brand-moon" aria-hidden="true"></span><span class="brand-name">Moonbond</span><span class="brand-jp" lang="ja">月の縁</span></div>
  <div class="lang" role="group" aria-label="Language"><button type="button" id="langEn" aria-pressed="true">EN</button><button type="button" id="langJa" aria-pressed="false" lang="ja">日本語</button></div>
</header>
<main class="wrap">
  <section class="intro">
    <div class="intro-head">
      <div><h1 id="tH1"></h1><p class="intro-sub" id="tSub"></p></div>
      <img src="art/moon.webp" alt="" width="330" height="328">

        </div>
      </fieldset>
      <fieldset><legend id="tThem"></legend>
        <div class="date-row">
          <label for="pMonth"><span class="lm"></span><select id="pMonth"></select></label>
          <label for="pDay"><span class="ld"></span><select id="pDay"></select></label>
          <label for="pYear"><span class="ly"></span><select id="pYear"></select></label>

  </section>
  <div id="reading" hidden></div>

<script>
var lang = 'en';
var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function L(en, ja){ return lang === 'ja' ? ja : en; }
/* kanji, romaji, English name, archetype, tagline, keywords, reading, in love, kimono color, obi color, pattern, traits */
var M = [
['昴','Bō-shuku','Pleiades','The Radiant Scholar','Grace, learning and a quiet glow that draws people in.',['Refined','Curious','Honored'],'Bō is counted among the most fortunate mansions. You carry yourself with natural dignity, love to learn, and tend to be lifted by mentors and elders.','You fall for minds first and need a partner who respects your ideals.',['Fuji-iro','藤色','#BBBCDE'],['Kogane','黄金','#E6B422'],'shippo',[3,3,5,4]],
['畢','Hisshuku','Net','The Steady Climber','Slow, sure and impossible to knock off course.',['Enduring','Loyal','Grounded'],'You build your life the way a mountain path is cut, one firm step at a time. Others tire and you keep going, so your best years tend to arrive later and last longer.','Devoted and constant, you show love through reliability more than words.',['Tokiwa-iro','常磐色','#007B43'],['Kuri-iro','栗色','#762F07'],'kikko',[4,3,3,5]],
['觜','Shi-shuku','Beak','The Silver Tongue','Words are your craft, and you choose them with care.',['Articulate','Studious','Discreet'],'You think before you speak, and when you do speak people listen. Knowledge and conversation win you trust, while your real feelings stay close to your chest.','You court with conversation and need someone who can keep up with it.',['Rikyū-nezumi','利休鼠','#888E7E'],['Kikyō-iro','桔梗色','#5654A2'],'yagasuri',[3,2,5,4]],
['参','Shin-shuku','Three Stars','The Trailblazer','Bold ideas, a loud laugh and no patience for the old way.',['Daring','Inventive','Outspoken'],'Curiosity pulls you toward whatever is new, and you say exactly what you think about it. You wake a room up and open doors other people had not noticed.','You need freedom and a partner who enjoys a lively debate.',['Shu-iro','朱色','#EB6101'],['Kon','紺','#223A70'],'uroko',[5,3,4,1]],
['井','Sei-shuku','Well','The Clear Thinker','Cool logic and deep reserves.',['Analytical','Composed','Fair'],'Like well water, your mind is clear and runs deep. You gather facts, argue precisely and stay calm when others do not, so people rely on your judgement.','You warm up slowly, then stay loyal for a very long time.',['Asagi-iro','浅葱色','#00A3AF'],['Shironeri','白練','#F3F3F2'],'seigaiha',[3,2,5,4]],
['鬼','Ki-shuku','Spirit','The Free Spirit','Playful, generous and hard to pin down.',['Open-hearted','Curious','Lucky'],'Tradition calls this the most auspicious mansion of all. You wander toward whatever fascinates you, give freely, and somehow land on your feet.','You love with childlike sincerity and wilt under control.',['Yamabuki-iro','山吹色','#F8B500'],['Wakatake-iro','若竹色','#68BE8D'],'asanoha',[3,5,3,3]],
['柳','Ryū-shuku','Willow','The Devoted Flame','Whatever you love, you love completely.',['Passionate','Magnetic','Focused'],'You pour yourself into the people and pursuits that capture you, and that intensity attracts followers. Like a willow you bend with the wind while your roots stay put.','All-in and protective, you need a partner who can match your depth.',['Yanagi-iro','柳色','#A8C97F'],['Enji','臙脂','#B94047'],'kanoko',[5,4,3,2]],
['星','Sei-shuku','Star','The Self-Made Star','Quiet ambition that outworks everyone.',['Hardworking','Independent','Ambitious'],'You set a far-off goal and walk toward it without fuss. Success comes from your own effort, often later than for others, and it is all the more solid for that.','Proud and private, you open up to someone who respects your goals.',['Ruri-iro','瑠璃色','#1E50A2'],['Ukon-iro','鬱金色','#FABF14'],'kikko',[5,2,4,3]],
['張','Chō-shuku','Drawn Bow','The Leading Light','Made for the stage, and generous with the spotlight.',['Charismatic','Proud','Expressive'],'You know how to present yourself, and people gather around you. Under the confident surface is a careful planner who hates to disappoint.','You want to be admired and will spoil the one who does.',['Hi-iro','緋色','#D3381C'],['Kogane','黄金','#E6B422'],'ichimatsu',[5,3,3,2]],
['翼','Yoku-shuku','Wings','The Far Traveler','High standards and wings wide enough to reach them.',['Idealistic','Precise','Worldly'],'You aim for perfection and will go a long way to find it, often literally. Distant places, foreign ideas and long projects suit you.','Faithful and exacting, you take time to choose and then commit.',['Sora-iro','空色','#A0D8EF'],['Gunjō-iro','群青色','#4C6CB3'],'yagasuri',[4,3,4,3]],

var FULL = {"DIST": {"d0": {"en": "the moment ordinary life comes back in. Until then, the pull itself was carrying you. Now the small questions arrive: who calls first, how much time apart is normal, what a quiet evening means. Pairs who sit close on the wheel often read this stage as something going wrong. It isn't. It is the slow part you skipped, arriving late. Pairs who can say it out loud (\"we went fast, and now we're catching up\") tend to come through closer. Pairs who treat it as a warning sign tend to pull back at exactly the wrong moment.", "ja": "ふだんの生活が戻ってきた頃です。それまでは、引き合う力そのものが二人を動かしていました。そこへ、小さなことが顔を出します。どちらが先に連絡するか。どのくらい離れているのが普通か。何もしない夜をどう過ごすか。近い位置の二人は、この時期を「うまくいかなくなった」と受け取りがちです。でも、そうではありません。飛ばしてきた「ゆっくり進む段階」が、遅れてやって来ただけです。「急いで近づいたから、今はその分を取り戻している」。そう言葉にできた二人は、前より近くなります。"}, "d1": {"en": "drift that nobody notices. Because nothing is wrong, nothing gets said. Weeks go by on logistics: who is picking up what, at what time, where. A bond at this distance does not break in one bad night. It thins, quietly, while each of you assumes the other is fine. The fix is small and a little unromantic: a fixed time that belongs only to the two of you, kept even when there is nothing to talk about. This bond does not need intensity. It needs a rhythm.", "ja": "「すれ違い」です。誰も気づかないうちに進みます。何も問題がないから、何も話さない。会話は、迎えの時間や買い物の連絡ばかりになっていきます。この位置の二人は、一度の喧嘩では壊れません。お互いに「相手は大丈夫」と思い込んだまま、静かに薄くなっていきます。対策は小さくて、少し地味です。二人だけの決まった時間を作り、話すことがない日もそれを守ること。この相性に必要なのは、激しさではなく、リズムです。"}, "d2": {"en": "moment you can both still name: a hard week when one of you showed up, a trip, a talk that ran late into the night. Before it, you were two people who knew each other. After it, you were something else. Bonds this far apart on the wheel are easy to underrate, because they never arrive with fireworks. Their strength is the opposite: once built, they are hard to shake. If things feel flat right now, don't read it as fading. In this bond, flat is often what steady feels like from the inside.", "ja": "出来事です。二人とも、今でもはっきり思い出せるはず。どちらかが大変だった時に、もう片方がそばにいた週。一緒に行った旅行。夜遅くまで続いた話。その前の二人は「知り合い」で、その後の二人は別のものになりました。遠い位置の相性は、花火のようには始まらないので、軽く見られがちです。でも強みは、その反対にあります。一度できあがると、簡単には揺らぎません。今、少し物足りなく感じていても、気持ちが冷めたしるしではありません。この相性では、「安定」は内側から見ると「平ら」に感じるものです。"}, "mei": {"en": "the other reacts twice as hard as anyone else would. It is not really about them. It is the shock of seeing your own habit from the outside. Pairs who share a mansion tend to go one of two ways. Some become each other's harshest critic. Others become the one person who truly understands why the other is the way they are. What separates them is a single move: when you feel that flash of irritation, ask yourself first, \"where do I do this?\" Said out loud, that question turns a fight into a joke only the two of you get.", "ja": "もう片方は、ほかの誰よりも強く反応します。本当は、相手に怒っているのではありません。自分の癖を外から見せられた、その驚きです。同じ宿の二人がたどる道は、大きく二つ。互いにいちばん厳しい批判者になるか、「この人がなぜこうなのか」を誰よりも分かる相手になるか。分かれ目は一つだけです。いらっとした瞬間に、まず自分に聞くこと。「これ、自分もやっていないかな」。それを声に出せた時、喧嘩は二人だけの笑い話に変わります。"}, "karmic": {"en": "not who owes whom. It is whether the giving can stay free. In this bond one of you helps without being asked, and the other accepts without quite knowing why it feels so natural. Shukuyō reads that as an old tie being carried forward. You don't have to believe in past lives to use the idea. It simply says: this relationship did not start from zero, so don't keep score as if it had. The pairs who do well here are the ones where the receiver says thank you, and the giver is allowed to rest.", "ja": "「どちらが借りているか」ではありません。「与えることが、この先も自由でいられるか」です。この相性では、片方が頼まれなくても手を差し伸べ、もう片方は、なぜか自然にそれを受け取ります。宿曜はそれを、昔からの縁の続きと読みます。前世を信じなくても、この考え方は使えます。「この関係は、ゼロから始まったわけではない。だから、ゼロから数えるように貸し借りを数えなくていい」。うまくいく二人は、受け取る側が「ありがとう」を言い、与える側が休むことを許されています。"}}, "CLASH": {"ei": {"en": "things are good and you don't want to be the one who spoils it. So it waits. A week, a month. By the time it comes out, it is bigger than it ever needed to be, and they are hurt less by what you said than by how long you held it. In this bond, honesty is cheap when it is early and expensive when it is late. They can take more than you think.", "ja": "今がうまくいっていて、それを壊す人になりたくないからです。だから待ってしまう。一週間、一か月。やっと口にした時には、必要以上に大きな話になっています。相手が傷つくのは、言われた内容よりも、「そんなに長く黙っていたの」という方です。この相性では、早い正直は安く、遅い正直は高くつきます。相手は、あなたが思うより受け止められる人です。"}, "shin": {"en": "assumed you already knew. You answered a question they hadn't asked and missed the one they had. Pairs this close rarely fight about big things. They fight about being taken for granted. The repair is almost embarrassingly simple: ask the question you think you know the answer to. \"How was it, really?\" Then wait a little longer than feels natural. In this bond, being asked is how the other person knows they are still seen.", "ja": "「もう分かっている」と思い込んだ時です。聞かれていない質問に答え、聞いてほしかったことは聞き逃した。家族のように近い二人は、大きなことではあまり喧嘩しません。ぶつかるのは、「当たり前」にされた時です。直し方は、拍子抜けするほど簡単。答えを知っているつもりの質問を、あえて聞くこと。「本当のところ、どうだった？」。そして、いつもより少し長く待つ。この相性では、聞いてもらえることが、「まだ自分を見てくれている」というしるしになります。"}, "yu": {"en": "nothing at all. No raised voice. They just get a little quieter, a little slower to reply, a little harder to make plans with. You may not notice for a week. That quiet is the clash. What they are saying, without saying it, is \"I'd like it to be my turn.\" Meet it with \"what's wrong with you lately?\" and it hardens. Meet it with \"I think I've been taking more than I give\" and it usually ends in one evening.", "ja": "拍子抜けするほど静かです。声を荒げることはありません。ただ少し口数が減り、返信が遅くなり、予定が合いにくくなる。あなたは一週間ほど気づかないかもしれません。その静けさこそが、この相性の「衝突」です。相手は言葉にしないまま、こう言っています。「次は、こちらの番にしてほしい」。そこで「最近どうしたの？」と返すと、こじれます。「もらってばかりだったかもしれない」と返せば、たいてい一晩で終わります。"}, "sui": {"en": "thirty, or fifty, whichever one finally tipped the pile. That is why your anger can look out of proportion to them. They see one small thing. You are holding the whole stack. Here is the part worth knowing: most of what you gave was never asked for. It came from your own kindness. You offered, they accepted, and you filed the note anyway. The way out is to give less and say more. Once a week, turn a silent favor into a spoken request. It will feel selfish. It is actually what keeps this bond fair.", "ja": "三十枚目か五十枚目。山を崩した、最後の一枚です。だから相手には、あなたの怒りが大げさに見えます。相手に見えているのは、目の前の小さなこと一つ。あなたが抱えているのは、メモの山ぜんぶです。大切なのは、ここから。あなたがしてきたことの多くは、相手が頼んだものではなく、あなたの優しさから出たものです。あなたが差し出し、相手は受け取り、それでもメモは増えました。抜け出す道は、与える量を減らし、言葉を増やすこと。週に一度、黙ってやっていたことを、口に出したお願いに変えてみてください。わがままに感じるはずです。でもそれが、この関係を公平に保ちます。"}, "an": {"en": "decide something on your own because it seemed too small to mention: a changed plan, a weekend given to someone else, a joke at their expense. You have forgotten it by dinner. They are still turning it over three days later. From your side nothing happened. From theirs, you showed them how little it takes for you to move without them. You don't need permission to live your life. You only need to say it before, not after. In this bond, a warning is worth more than an apology.", "ja": "「わざわざ言うほどでもない」と思って、一人で決めた時です。予定の変更、ほかの人と過ごす週末、相手をネタにした冗談。あなたは夕食の頃には忘れています。相手は三日たっても、まだ考えています。あなたにとっては、何も起きていない。相手にとっては、「この人は、自分抜きでも簡単に動ける」と見せられた出来事です。自分の人生に、許可をもらう必要はありません。ただ、後からではなく、先に伝えること。この相性では、先のひと言は、後の謝罪よりずっと価値があります。"}, "kai": {"en": "you are tired and one more small thing lands. Then everything you swallowed comes out at once, attached to the wrong subject. They are honestly confused: why this, why now? They never knew about the first ten. This is a pattern you can change from your side. Name the jolt when it happens, in the smallest words you have: \"that one stung.\" No speech, no blame. They are not careless on purpose. With you they simply feel safe enough to stop choosing their words.", "ja": "あなたが疲れていて、小さなことがもう一つ重なった時です。飲み込んできたものが、関係のない話題にくっついて、一度に出てきます。相手は本気で戸惑います。「なぜこれで？ なぜ今？」。最初の十回を、相手は知らないからです。この流れは、あなたの側から変えられます。心が揺れたその時に、いちばん短い言葉で伝えてください。「今の、ちょっと刺さった」。説明も、責める言葉もいりません。相手は、わざと無神経なのではありません。あなたの前では安心しきって、言葉を選ぶのを忘れているだけです。"}, "ki": {"en": "has asked out loud: \"what is this for?\" One of you is building toward something. The other is here for the life you have right now. Neither is wrong, and that is why the argument never finishes. You keep debating the price of the trip when the real subject is what each of you wants this relationship to be. Have that conversation once, on a calm day, with no decision attached. You may not agree. But the next time you clash over a plan, you will both know which argument you are actually having.", "ja": "まだ口にしていない、一つの問いです。「この関係は、何のためにある？」。片方は、何かに向かって積み上げたい。もう片方は、今この時間を楽しみたい。どちらも間違っていません。だから、言い合いに終わりが来ないのです。旅行の値段で揉めているようで、本当の話題は「二人の関係に何を求めているか」。穏やかな日に一度だけ、何も決めなくていい前提で、その話をしてみてください。意見は合わないかもしれません。でも次に予定のことでぶつかった時、「今、本当は何について話しているのか」が二人とも分かります。"}, "sei": {"en": "they learn something about you or simply feel pushed away. \"You never listen\" closes the door. \"Right now I need you beside me, not ahead of me\" opens it. They push because they believe in you. It is their way of caring, and most days it works. But they cannot tell a day for pushing from a day for holding unless you say which one it is. Give them the signal at the start: \"I don't need fixing tonight.\" They will be relieved. Guessing was hard for them too.", "ja": "相手が「あなたのことを一つ知る」か、ただ「拒まれた」と感じるかが決まります。「いつも話を聞いてくれない」は扉を閉めます。「今は前を走らないで、隣にいてほしい」は扉を開けます。相手が背中を押すのは、あなたを信じているから。それが相手の愛情表現で、たいていの日はうまく働きます。ただ、「押してほしい日」と「受け止めてほしい日」の違いは、言われなければ分かりません。話の最初に合図を出してください。「今日は、解決はいらない」。相手はほっとするはずです。当てるのは、相手にとっても難しかったのです。"}, "go": {"en": "every kindness gets counted backwards. Things that were gifts turn into evidence. The giver starts listing. The receiver starts defending. Suddenly you are both doing accounts on something that was never a loan. If this has already happened, it can be undone, but only by the receiver, which is you. Don't argue the numbers. Say the thing that was missing: \"I noticed. I should have said so.\" What they wanted was never repayment. It was to know the giving landed.", "ja": "これまでの優しさが、さかのぼって数え直されます。贈り物だったものが、証拠に変わる。与えた側は並べ立て、受け取った側は言い訳を始める。もともと貸し借りではなかったものを、二人で精算し始めてしまいます。もう起きてしまっていても、元に戻せます。ただし、戻せるのは受け取る側、つまりあなたです。数字で言い返さないこと。足りなかったひと言を伝えてください。「気づいていた。もっと早く言えばよかった」。相手が欲しかったのは、お返しではありません。「ちゃんと届いていた」と知ることです。"}, "tai": {"en": "everything was fine. You never said it was heavy. You said \"I've got it,\" and they believed you. So when you finally break, they do not hear \"I'm tired.\" They hear \"you let me down, and I never gave you the chance not to.\" Neither of you wants that misunderstanding. The pull to support them is real, and it is a good thing in you. But support that is never spoken turns into a debt they did not know they had. Let them see the weight while it is still small.", "ja": "すべてが順調に見えていたからです。あなたは「重い」と言いませんでした。「大丈夫、やっておく」と言い、相手はそれを信じました。だから、あなたがついに限界を迎えた時、相手に聞こえるのは「疲れた」ではありません。「あなたは支えてくれなかった。そして、支える機会ももらえなかった」です。それは、どちらも望んでいないすれ違いです。支えたい気持ちは本物で、あなたのいいところです。ただ、口にしない支えは、相手が知らないうちに「借り」になります。重さがまだ小さいうちに、見せてあげてください。"}, "mei": {"en": "where it can be stopped. Step one: one of you says something sharp. Step two: the other answers in exactly the same tone, because you share the same reflex. Step three: you are both defending a position neither of you cares about. Nobody else can match you like this, which shows how evenly matched you are. At step two, do the one thing your shared reflex never does: slow down. \"We're doing it again.\" Whoever says it first has not lost. In a pair like yours, that person is the one holding the mirror.", "ja": "止められる場所です。1つ目、どちらかがきつい言い方をする。2つ目、もう片方がまったく同じ調子で言い返す。同じ反射を持っているからです。3つ目、気づけば二人とも、本当はどうでもいい主張を守って譲らない。ここまで互角に向き合える相手は、ほかにいません。それだけ、力の合った二人です。2つ目の段階で、二人の反射が絶対にしないことをしてください。速度を落とすこと。「また、いつものやつだ」。先に言った方が負けたわけではありません。同じ宿の二人では、その人が「鏡を持っている側」です。"}}, "CLASH_DO": {"ei": {"en": "Say the small thing within a day, in one plain sentence.", "ja": "小さなことは、一日以内に、ひと言で伝える。"}, "shin": {"en": "Ask one question you think you already know the answer to.", "ja": "答えを知っているつもりの質問を、一つ聞いてみる。"}, "yu": {"en": "This week, plan one thing entirely around what they like.", "ja": "今週、相手の好みだけで決めた予定を一つ作る。"}, "sui": {"en": "Once a week, replace a silent favor with a spoken request.", "ja": "週に一度、黙ってする気づかいを、口に出すお願いに変える。"}, "an": {"en": "Tell them before, not after, even when it seems too small to mention.", "ja": "小さなことでも、後からではなく先に伝える。"}, "kai": {"en": "Name the sting when it happens, in five words or fewer.", "ja": "心が揺れたら、その場で、短いひと言で伝える。"}, "ki": {"en": "On a calm day, ask each other what you want this relationship to be.", "ja": "穏やかな日に、「この関係に何を求めているか」を聞き合う。"}, "sei": {"en": "Say it at the start: \"Tonight I need comfort, not advice.\"", "ja": "話す前に「今日は聞いてほしいだけ」と伝える。"}, "go": {"en": "Thank them for one specific thing they did, and name it.", "ja": "してもらったことを一つ、具体的に挙げてお礼を言う。"}, "tai": {"en": "Say \"this one is heavy for me\" while it is still small.", "ja": "負担が小さいうちに「これは少し大変」と伝える。"}, "mei": {"en": "When it starts, say \"we're doing it again\" and take ten minutes.", "ja": "始まったら「また、いつものやつだ」と言って、10分おく。"}}, "NEED": {"ei": {"en": "usually the part of your life that existed before them: your oldest friends, your family's habits, the way you have always done things. You never shut them out. You simply never opened it, because to you it is just background. To them it is the last room in the house they haven't been shown. Invite them in on purpose. Ask their opinion on something that has always been \"yours.\" It costs you very little, and it tells them what they most want to hear: there is no part of this where they are only visiting.", "ja": "たいてい、相手と出会う前からあった、あなたの世界です。昔からの友人、家族の習慣、ずっと続けてきたやり方。あなたは締め出したつもりはありません。あなたにとっては当たり前の背景なので、わざわざ見せていなかっただけです。相手にとってそこは、まだ案内されていない最後の部屋です。意識して、招き入れてください。これまで「自分のこと」だった何かについて、相手の意見を聞いてみる。あなたの手間はわずかです。そして相手は、いちばん聞きたかったことを受け取ります。「この関係のどこにも、あなたがお客さんでいる場所はない」。"}, "shin": {"en": "that the good things are theirs, not on loan from you. They have noticed that life runs better with you in it, and a quiet part of them has started to wonder whether they could manage alone, and what you would think of them if they couldn't. So tell them plainly what you see: they did the work, and you were only nearby. Then tell them you are staying anyway. You only need to say it once. They will keep it for years.", "ja": "「うまくいっているのは、あなた自身の力だ」というひと言です。相手は、あなたがいると物事がうまく回ることに気づいています。そして心のどこかで、「一人ではできないのかもしれない」「そう思われたらどうしよう」と考え始めています。だから、あなたに見えていることを、そのまま伝えてください。「やったのはあなたで、こちらは近くにいただけ」。そのうえで、「それでも、そばにいる」と。言うのは一度で十分です。相手はその言葉を、何年も持ち続けます。"}, "yu": {"en": "for you to go first, once, without being prompted. To suggest the place. To remember the date. To ask a second question after \"how are you?\" They are not keeping score, and they would be embarrassed to learn you had noticed. But every time you take the lead before they do, something in them relaxes. It tells them the ease runs in both directions, and that they are not the only one holding this up. Do it this week, and don't announce it.", "ja": "あなたが一度、言われる前に先に動くことです。行き先を提案する。日付を覚えておく。「元気？」の後に、もう一つ質問する。相手は数えているわけではありませんし、あなたに気づかれていたと知ったら、きっと照れます。それでも、あなたが先に動くたびに、相手の中で何かがほどけます。「楽なのは、お互いさまなんだ」「支えているのは自分だけじゃない」。そう伝わるからです。今週、やってみてください。宣言はせずに。"}, "sui": {"en": "let them look after you, and don't soften it. Tell them you are tired before you are exhausted. Ask for an evening off. Hand them a decision and leave it handed. Right now you are so good at carrying things that they have never had the chance to carry you, and people who are never allowed to give start to feel like guests in their own relationship. Your tiredness is not a burden to them. It is the first real opening you have offered.", "ja": "相手に世話を焼かせること。それも、遠慮なしに。限界の前に「疲れた」と言う。一晩、何もしない時間をもらう。決めごとを一つ任せて、任せたままにする。今のあなたは支えるのが上手すぎて、相手にはあなたを支える機会がありませんでした。与えることを許されない人は、自分の関係の中で「お客さん」のように感じ始めます。あなたの疲れは、相手にとって重荷ではありません。あなたが初めて開けてくれた、入口です。"}, "an": {"en": "change direction. Before you cancel. Before you go quiet for a day. Before you make the joke. One line is enough: \"I'm going to be busy this week, and it's not about you.\" To you this will sound unnecessary, almost silly. To them it is the difference between weather they can dress for and weather that just hits. They are not asking you to be less yourself. They are asking for a forecast.", "ja": "予定を取りやめる前。一日、連絡が途切れる前。からかう冗談を言う前。ひと言で足ります。「今週は忙しくなる。あなたのせいじゃないよ」。あなたには、言うまでもない、少し大げさなことに聞こえるでしょう。相手にとっては、「備えられる天気」と「いきなり降ってくる天気」ほどの違いがあります。相手は、あなたに変わってほしいわけではありません。欲しいのは、予報です。"}, "kai": {"en": "something they did reached you, in the good direction too. They know they can upset you. They rarely find out when they have moved you, made your day or changed your mind. You keep those to yourself, the same way you keep the stings. So they are steering half blind, sure of their effect on you only when it goes wrong. Tell them when it goes right. \"That thing you said on Tuesday stayed with me.\" It will make them more careful with you than any complaint could.", "ja": "「今のは、心に届いた」と。悪い方だけでなく、良い方も。相手は、自分があなたを傷つけることがあると知っています。でも、あなたの心を動かした時、一日を明るくした時、考えを変えた時のことは、ほとんど知りません。あなたが、痛みと同じように、それも胸にしまっているからです。相手は、うまくいかなかった時にしか自分の影響を知らないまま、手探りで進んでいます。うまくいった時に、伝えてください。「火曜日に言ってくれたこと、ずっと残ってる」。どんな不満よりも、相手はあなたを大切に扱うようになります。"}, "ki": {"en": "they have fallen short. Because you raise their game, they have started to feel that your regard depends on it. On the days they miss the mark, are tired, or simply have nothing to show, they brace for your disappointment. Be glad to see them on exactly those days. Sit through an evening where nothing gets done and call it a good one. To you it is nothing. To them it is proof that you like the person, not only the progress.", "ja": "うまくいかなかった日に。あなたといると成長できる。だからこそ相手は、「成長していない自分は、がっかりされる」と感じ始めています。失敗した日、疲れている日、何も見せるものがない日。相手は、あなたの反応に身構えています。まさにそういう日に、会えたことを喜んでください。何も進まなかった夜を一緒に過ごして、「いい夜だったね」と言う。あなたにとっては何でもないこと。相手にとっては、「見てくれているのは成果ではなく、自分自身なんだ」という証拠になります。"}, "sei": {"en": "moves, whatever else does. It can be small. The call on Sunday night. The way you always come back after an argument. The seat you keep for them. They love that you are hard to predict, but nobody can rest on surprise alone. Pick one thing and make it boringly reliable. You will lose none of your mystery. You will give them a floor to stand on while they enjoy the rest of you.", "ja": "変わらないもの。ほかの何が変わっても、です。小さなことで構いません。日曜の夜の電話。喧嘩の後、必ず戻ってくること。いつも相手のために空けておく席。相手は、あなたの読めなさが好きです。ただ、人は驚きだけでは休めません。一つ選んで、それだけは退屈なほど確実にしてください。あなたの魅力は少しも減りません。相手は、足場を得たうえで、あなたの残りの部分を楽しめるようになります。"}, "go": {"en": "alone. You accept their help with the visible things and keep the real weight to yourself: the money worry, the family matter, the plan you are not sure about. They can tell there is a door they have not been shown. For someone who gives as naturally as they do, being kept out of the one place where help would matter most is its own kind of hurt. You don't have to hand it over. Just tell them it exists, and let them stand next to you while you carry it.", "ja": "入れてもらうことです。あなたは、目に見えることでは相手の助けを受け取っています。でも本当に重いもの、お金の心配、家族のこと、自信のない計画は、自分だけで持っています。相手は、まだ見せてもらっていない扉があることに気づいています。与えることが自然な人にとって、「いちばん力になれる場所」に入れてもらえないのは、それだけでつらいことです。渡す必要はありません。「ある」と伝えて、あなたがそれを運ぶ間、隣にいてもらうだけでいいのです。"}, "tai": {"en": "probably something you have never put into words, even for yourself. Maybe supporting them makes you feel needed. Maybe it is simply who you are around them. Whatever it is, say it, because silence leaves them guessing, and the guess is usually darker than the truth: that you are being patient, or dutiful, or quietly keeping a list. \"I like who I am when I look after you\" is enough. It turns what they receive from a debt into a gift, and lets them take it without flinching.", "ja": "おそらく、あなた自身もまだ言葉にしたことがないものです。支えることで、必要とされていると感じるのかもしれない。相手の前では、それが自然な自分なのかもしれない。何であれ、言葉にしてください。黙っていると相手は想像するしかなく、その想像はたいてい、本当のことより暗いからです。「我慢しているのでは」「義務でやっているのでは」「心の中で数えているのでは」。「あなたを支えている時の自分が、好きなんだ」。それだけで十分です。相手が受け取っているものは「借り」から「贈り物」に変わり、相手は安心して受け取れるようになります。"}, "mei": {"en": "to give the thing you are waiting to receive. Both of you are holding out for the same gesture: the first apology, the first compliment, the first \"I missed you.\" You know exactly what they need, because it is what you need. That makes you the only person who can get it right on the first try. Go first, and say why: \"I'm doing this because it's what I'd want from you.\" In a pair like yours, generosity comes back fast. They cannot help answering in kind.", "ja": "自分が待っているものを、先に差し出すことです。二人とも、同じ一歩を待っています。最初の「ごめん」、最初のほめ言葉、最初の「会いたかった」。相手が何を求めているか、あなたは正確に知っています。あなたが求めているものと同じだからです。つまり、一度で正解できるのは、あなただけです。先に動いて、理由も伝えてください。「自分がしてほしいことだから、先にするね」。同じ宿の二人では、優しさは早く返ってきます。相手は、同じように返さずにはいられません。"}}, "LIFE_O": {"栄親": {"en": "the long, shared project. Romance comes easily here, so people assume romance is the heart of it. But this bond shows its real strength when you build something together: a home, a business, a family, a plan that takes years.", "ja": "「二人で長く育てるもの」です。恋愛は自然にうまくいくので、恋がこの相性の中心だと思われがちです。でも本当の強さが出るのは、何かを一緒に作る時。家、仕事、家族、何年もかかる計画です。"}, "友衰": {"en": "the friendship inside the relationship. You may be lovers or partners, but what carries you through the hard years is that you truly enjoy talking to each other.", "ja": "恋人や夫婦である前に、「いちばんの友だち」でいられること。つらい時期を越えさせてくれるのは、二人が心から会話を楽しめる、という一点です。"}, "安壊": {"en": "the beginning, and anything that feels like one. This bond is at its most powerful in the first pull, and again whenever life opens a new chapter: a move, a new job, a child.", "ja": "「始まり」と、始まりに似た時期です。この相性は、惹かれ合う最初の時期にいちばん強く、その後も、引っ越し・転職・出産など、人生の新しい章が始まるたびに力を取り戻します。"}, "危成": {"en": "working on something together. Put the two of you on the same problem and you are better than either of you alone, because one sees what the other misses.", "ja": "「一緒に何かに取り組む時」です。同じ課題に向かうと、二人は一人ずつの時より強くなります。片方が見落としたものを、もう片方が見つけるからです。"}, "業胎": {"en": "the hard times. When things are easy, this can feel like any other close relationship. When one of you is in trouble, the other simply turns up, and that is when you both understand what this is.", "ja": "「つらい時」です。順調な時は、ほかの親しい関係と変わらなく見えるかもしれません。どちらかが困った時、もう片方が当たり前のようにそばに来る。その時に、二人ともこの縁の意味を知ります。"}, "命": {"en": "being understood. Not romance, not teamwork: the plain relief of being with someone who needs no explanation.", "ja": "「分かってもらえること」です。恋のときめきでも、協力でもなく、説明がいらない相手といる、あの安心感です。"}}, "LIFE_love": {"栄親": {"n": 4, "en": "Warm and natural. A little effort to delight each other keeps it fresh for years.", "ja": "温かく、自然体でいられる恋。ときどき相手を喜ばせる工夫をすると、いつまでも新鮮です。"}, "友衰": {"n": 3, "en": "Gentle, and more restful the longer you are together. Plan a special day now and then and the spark lasts too.", "ja": "穏やかで、一緒にいるほど心が安らぐ恋。ときどき特別な日を用意すると、ときめきも長く続きます。"}, "安壊": {"n": 5, "en": "Intense. Few bonds feel this alive. Put the feeling into words and the thrill grows into something you can rest on.", "ja": "とても強く惹かれ合います。ここまで心が動く相性は多くありません。気持ちを言葉で伝え合うほど、ときめきは安心へと育っていきます。"}, "危成": {"n": 3, "en": "Fascination more than ease. You stay interested because you never fully figure each other out.", "ja": "安らぎよりも、興味が続く関係。相手のことが最後まで分かりきらないので、飽きません。"}, "業胎": {"n": 4, "en": "Deep, and a little fated. A sense that it was always meant to be surrounds you both.", "ja": "深く、どこか運命的な恋。最初から決まっていたような安心感が、二人を包みます。"}, "命": {"n": 3, "en": "Instant recognition, and a love that feels safe. Start something new together and you will still find sides of each other you had not seen.", "ja": "出会ってすぐに通じ合える、安心感のある恋。新しいことを一緒に始めると、知らなかった一面にも出会えます。"}}, "LIFE_marriage": {"栄親": {"n": 5, "en": "The classic strength of this bond. Shared goals hold, and tradition says luck gathers around the household.", "ja": "この相性がいちばん力を出す場面。同じ目標を持ち続けられ、家庭に運が集まりやすいとされます。"}, "友衰": {"n": 3, "en": "A relationship full of kindness. Let the one who gives more rest now and then, and the quiet happiness lasts.", "ja": "優しさに満ちた関係。多く与える側をときどき休ませてあげると、穏やかな幸せが長く続きます。"}, "安壊": {"n": 3, "en": "The room that grows with words. When the calm one keeps reassuring and the shaken one keeps speaking up, the pull between you settles into deep trust.", "ja": "気持ちを言葉にし合うほど、深い信頼に育つ場面。落ち着いている側が安心を伝え、揺さぶられる側が素直に話すことで、強い絆になります。"}, "危成": {"n": 3, "en": "Grows stronger the clearer your roles and shared goal. Two people with different strengths make a dependable team.", "ja": "役割と共通の目標がはっきりするほど、強くなる関係。違う強みを持つ二人は、頼もしいチームになります。"}, "業胎": {"n": 5, "en": "Very durable. The tie holds through years that would end other pairs.", "ja": "とても長続きします。ほかの二人なら離れてしまうような時期も、この縁は切れません。"}, "命": {"n": 3, "en": "The more you divide the roles, the better you move together. Shared values make a solid base for a home.", "ja": "役割を分けるほど、息の合った良い関係に。同じ価値観が、家庭の土台になります。"}}, "LIFE_daily": {"栄親": {"n": 4, "en": "Smooth and easy. A regular moment to talk through small things makes it more comfortable still.", "ja": "穏やかに回る暮らし。小さなことを話す時間を決めておくと、さらに心地よくなります。"}, "友衰": {"n": 5, "en": "Your best room. Meals, errands, long conversations about nothing: this is where the bond lives.", "ja": "この相性がいちばん輝く場面。食事、買い物、とりとめのない長話。そこに二人の良さがあります。"}, "安壊": {"n": 3, "en": "Good weeks are very good. One steady routine brings more of the calm ones.", "ja": "良い週はとても良い。決まった習慣を一つ作ると、穏やかな時間が増えていきます。"}, "危成": {"n": 3, "en": "Where your differences show most. Agree on a few house rules and those differences turn into a natural split of roles.", "ja": "二人の違いがいちばん表に出る場面。いくつかルールを決めておくと、違いは「役割分担」に変わり、暮らしが楽しくなります。"}, "業胎": {"n": 3, "en": "A calm, steady daily life. Say thank you for ordinary things and each day gets warmer.", "ja": "穏やかに続く暮らし。ふだんのことにも「ありがとう」を伝えると、毎日がもっと温かくなります。"}, "命": {"n": 4, "en": "Easy. Same pace, same habits, same sense of what matters.", "ja": "楽です。ペースも習慣も、大事にしたいことも似ています。"}}, "LIFE_work": {"栄親": {"n": 5, "en": "Excellent. Things you start together tend to grow.", "ja": "とても良い組み合わせ。二人で始めたことは育ちやすいとされます。"}, "友衰": {"n": 3, "en": "A comfortable team. A frank word now and then makes the results even better.", "ja": "居心地の良いチーム。ときには率直なひと言を交わすと、さらに良い結果が出ます。"}, "安壊": {"n": 3, "en": "A lot of power in short bursts. Decide in advance who has the final say and you get even more out of it.", "ja": "短い期間に大きな力が出ます。最後に誰が決めるかを先に決めておくと、さらに力を発揮します。"}, "危成": {"n": 5, "en": "Your strongest room. You cover each other's blind spots.", "ja": "いちばん強い場面。お互いの見落としを補い合えます。"}, "業胎": {"n": 4, "en": "One supports, one leads. Strong when you both accept which is which.", "ja": "片方が支え、片方が前に出る形。その役割を二人が受け入れていると、強い組み合わせです。"}, "命": {"n": 3, "en": "Same strengths, so you move fast. Add a third opinion for big decisions and you are well covered.", "ja": "強みが同じで、話が早い二人。大きな決断の時に、もう一人の意見を入れると万全です。"}}, "LAST1T": {"栄親": {"en": "say the uncomfortable thing early.", "ja": "言いにくいことを、早めに言うこと。"}, "友衰": {"en": "take turns.", "ja": "順番を決めること。"}, "安壊": {"en": "say small things on the day they happen.", "ja": "小さなことを、その日のうちに言うこと。"}, "危成": {"en": "ask \"why\" before you argue \"what\".", "ja": "「何を」の前に「なぜ」を聞くこと。"}, "業胎": {"en": "say thank you for ordinary things.", "ja": "当たり前のことに「ありがとう」を言うこと。"}, "命": {"en": "go first.", "ja": "先に動くこと。"}}, "LAST1": {"栄親": {"en": "Your bond is so pleasant that honesty feels like a risk. It is the opposite. This is one of the few bonds that can take a hard sentence without damage, as long as it comes early.", "ja": "居心地が良すぎて、正直に言うことが危険に思えます。実際は逆です。早いうちであれば、きついひと言も受け止められる、数少ない相性です。"}, "友衰": {"en": "Decide whose turn it is to choose, to plan, to be looked after. Out loud, the way children do. It keeps the giving even without anyone keeping score.", "ja": "行き先を決める番、計画する番、甘える番。子どものように、口に出して決めてください。数えなくても、与える量がそろいます。"}, "安壊": {"en": "Nothing in this bond stays small once it is stored. One sentence the same evening saves a week of distance.", "ja": "この相性では、ため込んだものは小さいままではいられません。その夜のひと言が、一週間の距離を防ぎます。"}, "危成": {"en": "You disagree on methods because you start from different values. Hearing the reason first turns most fights into a short exchange of information.", "ja": "やり方で食い違うのは、出発点の価値観が違うからです。先に理由を聞くと、ほとんどの言い合いは、短い情報交換で終わります。"}, "業胎": {"en": "The giving in this bond is so natural that it turns invisible. Naming it keeps it a gift.", "ja": "この相性では、与えることが自然すぎて、見えなくなります。言葉にすることで、それは贈り物のままでいられます。"}, "命": {"en": "You are both waiting for the same gesture. Whoever offers it first ends the standoff, and it comes straight back.", "ja": "二人とも、同じ一歩を待っています。先に差し出した方が、にらみ合いを終わらせます。そして、すぐに返ってきます。"}}, "LAST2T": {"栄親": {"en": "Keep building something.", "ja": "二人で何かを作り続ける。"}, "友衰": {"en": "Protect the talking.", "ja": "話す時間を守る。"}, "安壊": {"en": "Let the calm one reassure, often.", "ja": "落ち着いている側が、何度でも安心させる。"}, "危成": {"en": "Share a goal.", "ja": "同じ目標を持つ。"}, "業胎": {"en": "Let the giver rest.", "ja": "与える側を休ませる。"}, "命": {"en": "Take different roles.", "ja": "役割を分ける。"}}, "LAST2": {"栄親": {"en": "This bond feeds on shared projects. When one ends, start the next, even a small one.", "ja": "この相性は、共同作業を栄養にします。一つ終わったら、小さくても次を始めてください。"}, "友衰": {"en": "Conversation is the heart of this bond. Guard an hour a week with no screens and no errands.", "ja": "会話がこの相性の中心です。週に一時間、スマホも用事もない時間を確保してください。"}, "安壊": {"en": "If you are the settled one, say what you feel more often than seems necessary. To them it is never too much.", "ja": "あなたが落ち着いている側なら、「言いすぎかな」と思うくらい気持ちを伝えてください。相手にとって、多すぎることはありません。"}, "危成": {"en": "Give the two of you something to aim at together. Side by side, your differences become an advantage.", "ja": "二人で目指すものを一つ決めてください。同じ方向を向くと、違いは強みに変わります。"}, "業胎": {"en": "Whoever gives more needs permission to stop sometimes. Offer it before they have to ask.", "ja": "多く与えている側には、「休んでいい」という許しが必要です。頼まれる前に、こちらから伝えてください。"}, "命": {"en": "Two people with the same strength in the same seat will compete. Split the territory on purpose.", "ja": "同じ強みを持つ二人が同じ席に座ると、競い合ってしまいます。担当を、意識して分けてください。"}}, "LAST3T": {"栄親": {"en": "Keep courting each other.", "ja": "恋人同士の時間を続ける。"}, "友衰": {"en": "Add a little risk.", "ja": "少しだけ冒険する。"}, "安壊": {"en": "Keep lives of your own.", "ja": "それぞれの世界を持つ。"}, "危成": {"en": "Keep some time that asks nothing of anyone.", "ja": "何も求めない時間を作る。"}, "業胎": {"en": "Don't keep accounts.", "ja": "貸し借りを数えない。"}, "命": {"en": "Bring in other voices.", "ja": "ほかの人の声を入れる。"}}, "LAST3": {"栄親": {"en": "Comfort came early for you. Dates, compliments and small surprises are not only for new couples.", "ja": "早くから落ち着いた二人です。デートやほめ言葉、小さなサプライズは、付き合い始めだけのものではありません。"}, "友衰": {"en": "Do something new together a few times a year. Ease is what you already have. Novelty is what you have to bring in from outside.", "ja": "年に数回、二人で初めてのことをしてください。居心地の良さは元からあるもの。新鮮さは、外から持ち込むものです。"}, "安壊": {"en": "The pull here is strong enough to swallow everything else. Friends, work and interests outside the pair make the bond lighter to carry.", "ja": "引き合う力が強く、ほかのすべてを飲み込みがちです。二人の外にある友人・仕事・趣味が、この関係を軽くします。"}, "危成": {"en": "Not every evening has to improve someone. Protect the hours where nobody is being sharpened.", "ja": "毎晩、成長する必要はありません。誰も磨かれなくていい時間を、守ってください。"}, "業胎": {"en": "The moment either of you starts listing who did what, step back. This bond was never a ledger.", "ja": "どちらかが「誰が何をしたか」を並べ始めたら、一歩引いてください。この縁は、もともと帳簿ではありません。"}, "命": {"en": "You share the same blind spots. Friends who see things differently are good for this pair.", "ja": "見落とす場所も同じです。違う見方をする友人は、この二人にとって貴重です。"}}, "CLOSE": {"栄親": {"en": "When you are together, things tend to move the right way. That is not chance. It is what happens when two people lift each other. What you build side by side becomes the place you both come home to, and the moments of thinking \"I'm glad it's you\" only add up with time.", "ja": "二人でいると、物事が自然と良い方へ動き出します。それは偶然ではなく、互いを引き上げ合える相性だからです。一緒に育てたものが、やがて二人の居場所になっていきます。時間を重ねるほど、「この人で良かった」と思える瞬間が増えていく関係です。"}, "友衰": {"en": "Someone you never run out of things to say to is a happiness many people look for and few find. You don't need big occasions. The ordinary hours you spend together are the treasure. This is a bond that grows more comfortable, and more dear, with every year.", "ja": "何年たっても、話したいことが尽きない相手。それは、探しても簡単には見つからない幸せです。特別な出来事がなくても、二人でいる何気ない時間そのものが宝物になります。年を重ねるほど、隣にいることが心地よくなっていく関係です。"}, "安壊": {"en": "You do not meet many people in a lifetime who move you this much. Each of you brings new color into the other's life and leaves the other richer than before. Every time you put a feeling into words, that strong pull turns a little more into deep trust. Yours is a story neither of you will forget, and you get to write it together.", "ja": "ここまで心を動かされる相手には、一生のうちに何度も出会えません。二人は互いの人生に新しい色を持ち込み、出会う前より豊かな自分へと変えていきます。気持ちを言葉にするたびに、強く惹かれ合う力は、深い信頼へと育っていきます。忘れられない物語を、二人で紡いでいける関係です。"}, "危成": {"en": "Your differences are not a wall to get over. They are a gift that widens each other's world. The more you learn about each other, the more there is to love, and the longer you are together, the more you each meet a self you had not known. This is a bond that deepens with every year you give it.", "ja": "二人の違いは、乗り越えるべき壁ではなく、互いの世界を広げてくれる贈り物です。知れば知るほど新しい魅力に気づき、一緒にいるほど、出会う前には知らなかった自分に出会えます。時間を重ねるほど、二人だけの深い絆へと育っていく関係です。"}, "業胎": {"en": "It felt familiar from the first moment. Shukuyō sees your tie as something special, bound over a very long time. To have someone who simply turns up when things are hard is one of the great comforts in life. Every thank-you makes this bond warmer and deeper.", "ja": "出会った瞬間から、どこか懐かしい。宿曜では、二人の縁は長い時間をかけて結ばれてきた特別なものとされます。困った時に、当たり前のようにそばにいてくれる人がいる。それは何よりも心強い幸せです。「ありがとう」を重ねるほど、この縁はいっそう温かく、深くなっていきます。"}, "命": {"en": "Someone who understands you without a word is rare and precious. In each other you find your own best qualities, and through each other you learn to like yourselves more. Because you are alike, you can share the same joy at the same depth. The longer you are together, the more you become each other's truest ally.", "ja": "言葉にしなくても分かり合える相手は、かけがえのない存在です。二人は互いの中に自分の良さを見つけ、互いを通して自分をもっと好きになっていけます。似ているからこそ、同じ喜びを同じ深さで分かち合えます。一緒にいるほど、「いちばんの理解者」になっていく関係です。"}}, "DIST_UP": {"d0": {"en": "You came together fast because the pull between you is that strong. Add slow time to that momentum, and what you have becomes the real thing.", "ja": "一気に近づけたのは、それだけ強く引き合う二人だからです。その勢いに、ゆっくり育てる時間が加わった時、二人の絆は本物になっていきます。"}, "d1": {"en": "A bond that lasts without strain is the best kind to walk a long life with. The more rhythm you share, the more your ordinary days fill with quiet happiness.", "ja": "無理をしなくても続いていく。それは、長い人生を一緒に歩くうえで、いちばん頼もしい相性です。リズムを重ねるほど、二人の毎日は穏やかな幸せで満たされていきます。"}, "d2": {"en": "A bond that took time to grow shines more as time passes. Your best years are still ahead of you.", "ja": "時間をかけて育った絆は、時間がたつほど輝きます。二人のいちばん良い時期は、これからです。"}, "mei": {"en": "To accept them is to accept yourself. Simply by being together, you help each other become someone you both like more.", "ja": "相手を受け入れることは、自分を受け入れること。二人は一緒にいるだけで、互いを「もっと好きな自分」へ変えていけます。"}, "karmic": {"en": "To have met someone you want to cherish for no reason at all is itself the good fortune you two were given.", "ja": "理由がなくても大切にしたいと思える相手に出会えたこと。それ自体が、二人に贈られた幸運です。"}}, "CLASH_UP": {"ei": {"en": "Once you can say the small thing early, very little can shake you. An easy bond becomes a trust that holds.", "ja": "早めのひと言が言えるようになった二人は、もう揺らぎません。恵まれた相性が、確かな信頼に変わっていきます。"}, "shin": {"en": "Every time you ask, you find something new. Because you are this close, you get to keep discovering each other for years.", "ja": "聞くたびに、相手の新しい一面が見つかります。家族のように近い二人だからこそ、何年たっても「知らなかった」を楽しめます。"}, "yu": {"en": "Each step you take toward them makes the ease mutual. Two people who simply get along become each other's strongest support.", "ja": "あなたが一歩踏み出すたびに、二人の心地よさは「お互いさま」になります。気の合う二人が、いちばんの味方同士になっていきます。"}, "sui": {"en": "Your generosity is the treasure of this relationship. Add words to it, and it finally lands, and starts coming back with the same warmth.", "ja": "あなたの優しさは、この関係の宝物です。言葉が加わった時、その優しさはちゃんと相手に届き、同じ温かさで返ってくるようになります。"}, "an": {"en": "With one line of warning, they can love you without bracing. Your calm becomes the thing that keeps your shared place safe.", "ja": "先のひと言があるだけで、相手は安心してあなたを好きでいられます。あなたの落ち着きは、二人の居場所を守る力になります。"}, "kai": {"en": "The more easily you can name a feeling, the more that strong pull turns into deep understanding. Someone who moves you this much is someone who makes your life larger.", "ja": "気持ちを短く伝えられるようになるほど、強く惹かれる力は、深く理解し合う力へと変わっていきます。ここまで心を動かしてくれる相手は、あなたの人生を豊かにしてくれる人です。"}, "ki": {"en": "Two people who value the same thing for different reasons can see what neither would see alone. From the day you have that talk, your differences work for you.", "ja": "違う理由で同じものを大切にできる二人は、一人では見られない景色を見られます。その話ができた日から、違いは二人の強みになります。"}, "sei": {"en": "With one signal, the force that pushes you forward can also be the kindness that holds you. Having someone beside you who truly believes in you is no small happiness.", "ja": "合図ひとつで、相手の「背中を押す力」は、あなたを包む優しさにもなります。あなたを本気で信じてくれる人が、隣にいる。それは大きな幸せです。"}, "go": {"en": "Each spoken thank-you turns their kindness into joy. One who loves to give and one who can receive with grace make a very happy pairing.", "ja": "「ありがとう」が言葉になるたびに、相手の優しさは喜びに変わります。与えたい人と、素直に受け取れる人。二人は、とても幸せな組み合わせです。"}, "tai": {"en": "Once the weight is shared, the joy of supporting becomes something you both have. Your depth of care is a lifelong support to them.", "ja": "重さを分け合えるようになった時、支える喜びは二人のものになります。あなたの深い愛情は、相手にとって一生の支えです。"}, "mei": {"en": "Two people with the same reflex can also make up at the same speed. Every time you end up laughing, you come out stronger.", "ja": "同じ反射を持つ二人は、同じ速さで仲直りもできます。笑い合えた回数だけ、二人は強くなっていきます。"}}, "NEED_UP": {"ei": {"en": "Welcomed into your world, they will only want to do more for you. That is how the home you share keeps getting bigger.", "ja": "あなたの世界に迎え入れられた相手は、もっとあなたの力になりたいと思うはずです。二人の「帰る場所」は、そうして少しずつ広がっていきます。"}, "shin": {"en": "With those words, they can stand beside you with confidence. You become two people who bring each other luck.", "ja": "その言葉を受け取った相手は、自信を持ってあなたの隣に立てるようになります。互いに幸運を運び合う二人になっていきます。"}, "yu": {"en": "A small step from you is a large gift to them. That is how the ease between you deepens year after year.", "ja": "小さな一歩が、相手にとっては大きな贈り物になります。そうやって、二人の心地よさは年々深まっていきます。"}, "sui": {"en": "When support runs both ways, neither of you has to strain, and you can be together for a long time. The person you can lean on is already right there.", "ja": "支え合えるようになった二人は、どちらも無理をせずに、長く一緒にいられます。あなたが甘えられる相手は、ちゃんと隣にいます。"}, "an": {"en": "Given a forecast, they can relax, and love you more freely than they do now.", "ja": "予報をもらえた相手は、安心して、今よりもっとのびのびとあなたを愛せるようになります。"}, "kai": {"en": "Two people who tell each other the good things can turn the pull between them straight into happiness.", "ja": "良いことを伝え合える二人は、惹かれ合う力をそのまま幸せに変えていけます。"}, "ki": {"en": "People grow most where it is safe to fall short. You can be the rare person who gives them both growth and rest.", "ja": "安心して失敗できる場所があると、人はもっと伸びます。あなたは相手にとって、成長と安らぎの両方をくれる、かけがえのない人になれます。"}, "sei": {"en": "With one thing that never changes, your freedom becomes a charm they can enjoy without worry.", "ja": "変わらないものが一つあるだけで、あなたの自由さは、相手にとって安心して楽しめる魅力になります。"}, "go": {"en": "From the day you open that door, you stop being helper and helped. You become two people carrying the same load.", "ja": "扉を開けた日から、二人は「助ける人と助けられる人」ではなく、同じ荷物を持つ仲間になります。"}, "tai": {"en": "Your honest answer is the best gift you can give them. Supporting them becomes a joy you share.", "ja": "あなたの正直な気持ちは、相手への何よりの贈り物です。支えることが、二人の喜びになっていきます。"}, "mei": {"en": "The kindness you offer first comes back in the same shape. You are the two people best placed to make each other happy.", "ja": "先に差し出した優しさは、同じ形で返ってきます。二人は、互いをいちばん幸せにできる相手です。"}}};

function fillDate(prefix, y, m, d){
  var ms = $(prefix + 'Month'), ds = $(prefix + 'Day'), ys = $(prefix + 'Year'), i, o;
  for (i = 1; i <= 12; i++){ o = document.createElement('option'); o.value = i; ms.appendChild(o); }
  for (i = 1; i <= 31; i++){ o = document.createElement('option'); o.value = i; o.textContent = i; ds.appendChild(o); }
  for (i = todayJST().y; i >= 1920; i--){ o = document.createElement('option'); o.value = i; o.textContent = i; ys.appendChild(o); }
  ms.value = m; ds.value = d; ys.value = y;
}
function readDate(prefix){
  var y = +$(prefix + 'Year').value, m = +$(prefix + 'Month').value, d = +$(prefix + 'Day').value;
  var t = new Date(Date.UTC(y, m - 1, d));
  if (t.getUTCMonth() !== m - 1) return {err:L(MONTH_NAMES[m-1] + ' ' + y + ' has no day ' + d + '. Pick another day.', y + '年' + m + '月に' + d + '日はありません。別の日を選んでください。')};
  var now = todayJST();
  if (dayNum(y, m, d) > dayNum(now.y, now.m, now.d) + 1) return {err:L('That date is in the future. Pick a birthday up to today.', 'その日付は未来です。今日までの誕生日を選んでください。')};
  var s = shukuOf(y, m, d);
  if (!s) return {err:L('That date is outside the calendar we cover. Pick a year from 1920 onward.', '対応していない日付です。1920年以降を選んでください。')};
  return {y:y, m:m, d:d, idx:s.idx};
}

    '<div class="step"><span class="step-n">3</span><div><strong>' + esc(F('LAST3T', k)) + '</strong><p>' + esc(F('LAST3', k)) + '</p></div></div></div>');
  h += '<section class="closing"><img src="art/moon.webp" alt="" width="330" height="328"><p class="for">' + L('For the two of you', '二人へ') + '</p><p class="line">' + esc(F('CLOSE', k)) + '</p>' +
    '<p class="fine">' + L('A reading for reflection and fun. It describes tendencies drawn from the Shukuyō tradition and promises no outcome.', '楽しみと振り返りのための読み物です。宿曜の伝統にもとづく傾向をお伝えするもので、結果を約束するものではありません。') + '</p></section>';
  $('reading').innerHTML = h; $('reading').hidden = false;
}
function applyLang(){
  document.documentElement.lang = lang;
  $('langEn').setAttribute('aria-pressed', String(lang === 'en')); $('langJa').setAttribute('aria-pressed', String(lang === 'ja'));
  document.title = L('Shukuyō Full Reading', '宿曜 くわしい相性鑑定');
  $('tH1').textContent = L('The full reading', 'くわしい相性鑑定');
  $('tSub').textContent = L('All eight chapters, written for one exact pairing.', '全8章。二人の組み合わせに合わせた鑑定です。');
  $('tYou').textContent = L('Your birthday', 'あなたの誕生日'); $('tThem').textContent = L('Their birthday', '相手の誕生日');
  $('tGo').textContent = L('Show the reading', '鑑定を表示する');
  var set = function(c, t){ var e = document.querySelectorAll('.' + c); for (var i = 0; i < e.length; i++) e[i].textContent = t; };
  set('lm', L('Month', '月')); set('ld', L('Day', '日')); set('ly', L('Year', '年'));
  ['bMonth','pMonth'].forEach(function(id){ var os = $(id).options; for (var i = 0; i < os.length; i++) os[i].textContent = L(MONTH_NAMES[i], (i + 1) + '月'); });
  render();
}
function init(){
  try { var s = localStorage.getItem('tsukiyado-lang'); if (s === 'ja' || s === 'en') lang = s; } catch (e) {}
  fillDate('b', 1995, 11, 14); fillDate('p', 1996, 3, 3);
  $('langEn').addEventListener('click', function(){ lang = 'en'; try { localStorage.setItem('tsukiyado-lang', 'en'); } catch (e) {} applyLang(); });
  $('langJa').addEventListener('click', function(){ lang = 'ja'; try { localStorage.setItem('tsukiyado-lang', 'ja'); } catch (e) {} applyLang(); });
  $('birthForm').addEventListener('submit', function(e){
    e.preventDefault();
    var A = readDate('b'), B = readDate('p');
    if (A.err || B.err){ $('err').textContent = A.err || B.err; return; }
    $('err').textContent = ''; mine = A; partner = B; render();
    $('reading').scrollIntoView({behavior: (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'auto' : 'smooth', block:'start'});
  });
  applyLang();
  /* Prefill from the order tool: ?a=YYYY-MM-DD&b=YYYY-MM-DD&lang=en|ja&t=file-title */
  try {
    var q = new URLSearchParams(location.search), pa = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(q.get('a') || ''), pb = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(q.get('b') || '');
    if (q.get('lang') === 'ja' || q.get('lang') === 'en') { lang = q.get('lang'); applyLang(); }
    if (pa && pb) {
      ['b','p'].forEach(function(pf, i){ var x = i ? pb : pa; $(pf + 'Year').value = +x[1]; $(pf + 'Month').value = +x[2]; $(pf + 'Day').value = +x[3]; });
      var A = readDate('b'), B = readDate('p');
      if (!(A.err || B.err)) { mine = A; partner = B; render(); }
      else $('err').textContent = A.err || B.err;
    }
    if (q.get('t')) document.title = q.get('t');
    /* Paid link (k=…): the reading is for this pair only, so hide the date form */
    if (q.get('k') && pa && pb) $('birthForm').style.display = 'none';
  } catch (e) {}
}
init();
</script>
</body>
</html>
