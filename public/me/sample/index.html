HR.","人に寄り添う仕事：カウンセリング、コーチング、接客、営業、人事。"],["Fields that use intuition: marketing, design, performance, negotiation.","直感が活きる分野：マーケティング、デザイン、演技・表現、交渉。"],["Roles as a trusted go-between or confidant.","信頼される仲介役や相談役。"]],"style":["You work best in small, trusting teams where emotions are acknowledged. Cold, political workplaces cost you a great deal of energy.","感情が尊重される、信頼できる少人数のチームで力が出ます。冷たく、駆け引きの多い職場では、多くのエネルギーを失います。"],"money":["You earn well when you use your read on people, whether in clients, customers or negotiations. Be careful about spending to soothe moods or to please others, and about guarantees you give for friends.","お客様、取引先、交渉相手など、人を読む力を活かす場面で稼げます。気分を癒したり人を喜ばせたりするための出費、友人への保証には、気をつけてください。"],"caution":["Check whether a feeling is yours before you act on it.","行動する前に、その気持ちが自分のものかどうか、確かめてください。"]},"drain":["Crowded emotional situations, being used, and having to perform constantly.","感情が渦巻く人混み、利用されること、演じ続けなければならないこと。"],"recharge":["Time completely alone, music, water, a trusted friend who asks nothing of you.","完全に一人になる時間、音楽、水、何も求めない信頼できる友人。"],"week":["This week, spend one hour fully alone with no one's mood to read, and notice what you actually feel.","今週、誰の気分も読まなくていい時間を一時間作って、自分が本当は何を感じているか、確かめてください。"],"close":["You understand everyone else so well. Let the same understanding turn toward yourself, and let a few people understand you back.","あなたは、ほかの誰のこともよく分かります。その理解を、自分自身にも向けて、あなたを理解してくれる人を、少しだけ増やしてください。"]},"tail":{"core":[["Once you start, you do not stop. You have a fighter's focus and a craftsman's patience, and you stay on one path until you master it. You rise to a challenge, and being tested brings out your best, which is why others find you formidable.","一度始めたら、やめません。闘う人の集中力と、職人の忍耐を持ち、極めるまで一つの道を歩き続けます。挑戦されるほど力が出て、試されるほど最高の自分が現れるので、ほかの人からは手ごわい人に見えます。"],["Your competitive streak is both fuel and risk. It drives you to improve and can also make life feel like a series of contests. In love as in work you are serious and single-minded, and you pursue one person or one goal with everything you have.","負けず嫌いは、燃料であり、リスクでもあります。向上させてくれる一方で、人生が勝負の連続のように感じられることもあります。恋でも仕事でも、真剣で一途で、一人の相手、一つの目標を、持てるすべてで追いかけます。"]],"strengths":[["Perseverance","やり抜く力","You keep at a hard problem long after others have moved on.","ほかの人が別のことに移っても、難しい問題に取り組み続けます。"],["Rising to challenge","挑まれると強い","Pressure sharpens you rather than breaking you.","プレッシャーは、あなたを折るのではなく、研ぎ澄ませます。"],["Dedication","ひたむきさ","When you commit to a person or a path, it is for real.","人や道に身を捧げると決めたら、本気です。"]],"blind":[["Everything becomes a contest","何でも勝負にする","Rest and friendly company can feel like falling behind.","休息や気楽な付き合いが、遅れを取ることのように感じられます。"],["Single-mindedness","視野が狭くなる","While you focus on one goal, other parts of life and other people wait.","一つの目標に集中する間、ほかの生活やほかの人が置き去りになります。"],["Refusing to quit","引き際が分からない","Persistence can turn into holding on to something that has stopped working.","粘り強さが、もう機能しなくなったものを握りしめることに変わります。"]],"love":{"attract":["You are drawn to people who are focused, capable and not easily impressed. Someone who challenges you, who has real skill or discipline of their own, holds your attention for years.","集中力があり、有能で、簡単には感心しない人に惹かれます。あなたに挑み、自分自身の技術や規律を持つ人は、何年たっても、あなたの関心を引きつけ続けます。"],"pattern":["You are serious and single-minded in love. The pattern to watch is pursuing the person like a goal, then relaxing once they are won, or treating the relationship as one more thing to be best at.","恋でも真剣で一途です。注意したいのは、相手を目標のように追いかけて、手に入れたら気が抜けてしまうこと、あるいは関係を「一番になるべきもの」の一つにしてしまうことです。"],"try":["This month, plan one date or evening with no goal, no improvement and no scorekeeping.","今月、目的も、上達も、点数づけもない、デートか夜の時間を一回、計画してください。"]},"work":{"fit":[["Mastery careers: craftsmanship, engineering, medicine, athletics, research.","極める仕事：職人技、技術開発、医療、スポーツ、研究。"],["Competitive fields: sales, law, trading, entrepreneurship.","競争のある分野：営業、法律、トレーディング、起業。"],["Long-term projects needing endurance: building, restoration, specialist work.","持久力が要る長期の仕事：建築、修復、専門技能。"]],"style":["You work best with a clear goal, honest measurement and room to improve. Vague jobs with no standard to beat leave you restless.","はっきりした目標、正直な評価、上達できる余地があると力が出ます。超えるべき基準のない、曖昧な仕事では、落ち着きません。"],"money":["Your income grows with your skill and persistence, usually with steady progress. You can over-invest in a single bet because quitting feels like losing. Set a limit in advance for what you will put in.","収入は技術と粘り強さとともに、着実に伸びます。やめることが負けに感じられて、一つの賭けに入れ込みすぎることがあります。入れてよい額を、あらかじめ決めておいてください。"],"caution":["Decide your stopping point before you begin, so persistence does not become stubbornness.","始める前に撤退の線を決めておけば、粘り強さが頑固さに変わるのを防げます。"]},"drain":["Aimless work, being beaten by a lesser effort, and enforced rest with nothing to aim at.","目的のない仕事、劣る努力に負けること、狙うものがないままの強制的な休み。"],"recharge":["Training your body, a hard problem you enjoy, then deep sleep.","体を鍛えること、楽しめる難問、そして深い眠り。"],"week":["This week, take one real rest day without measuring it as useful or not.","今週、役に立つかどうかを測らない、本当の休日を一日、作ってください。"],"close":["Your determination is rare and admirable. Let it rest sometimes, and let the people who love you see you at ease, not winning.","あなたの決意は、得がたく、立派です。時にはそれを休ませて、あなたを愛する人に、勝っていない、くつろいだ姿を見せてあげてください。"]},"winnowing-basket":{"core":[["You say what you mean and take on what others avoid. You are frank, fearless and happiest standing on your own feet. Hardship toughens you rather than defeating you, and you often do best far from where you began.","思ったとおりに話し、人が避けることを引き受けます。率直で、恐れを知らず、自分の足で立っている時が一番幸せです。苦労はあなたを打ち負かさず、鍛えます。生まれた場所から離れた土地で、力を発揮することが多い人です。"],["You have a big heart under the bluntness. Generosity, loyalty and a readiness to help come naturally, and you have no patience for games or hidden agendas. Your weakness is that directness can sound harsher than you intend, and independence can make it hard to accept help.","率直さの下に、大きな心があります。気前のよさ、誠実さ、助ける覚悟が自然に備わっていて、駆け引きや裏の意図には興味がありません。弱点は、率直さが思った以上にきつく聞こえることと、独立心が強すぎて、助けを受け取るのが苦手なことです。"]],"strengths":[["Honesty","正直さ","People always know where they stand with you, which is a relief in a world of hints.","人は、あなたがどう思っているか常に分かるので、遠回しが多い世の中で、ほっとできます。"],["Resilience","たくましさ","Setbacks toughen you, and you bounce back from hardship with new strength.","挫折があなたを鍛え、困難から新しい強さを得て立ち上がります。"],["Big-hearted generosity","気前のよさ","You help without keeping a ledger, and people remember it for life.","貸し借りの帳簿をつけずに助けるので、人は一生覚えています。"]],"blind":[["Bluntness","言い方がきつい","You speak the truth fast, and some people hear only the sting.","真実を早く言うので、痛みだけが残ってしまう人もいます。"],["Refusing help","助けを断る","Needing someone feels like weakness, so you go without.","誰かが必要だということが弱さに思えて、一人で済ませます。"],["Restlessness with routine","繰り返しが続かない","Steady, quiet stretches can feel stifling, and you move on too soon.","静かで安定した時期が窮屈に感じられ、早く動いてしまいます。"]],"love":{"attract":["You are drawn to honest, independent people who do not play games. Someone who is direct, a little adventurous and warm-hearted, who is happy to stand beside you rather than lean on you, appeals to you most.","正直で自立していて、駆け引きをしない人に惹かれます。率直で、少し冒険好きで、心が温かく、あなたに寄りかからず、隣に立ってくれる人に、いちばん心が動きます。"],"pattern":["You are direct and big-hearted, with no taste for games. The pattern to watch is saying hard things too bluntly, then feeling misunderstood when a partner is hurt. You also tend to handle things alone rather than ask.","率直で心が広く、駆け引きは好みません。注意したいのは、きついことを直球で言い、相手が傷ついて、自分が誤解されたと感じることです。また、頼らず、自分で処理してしまいがちです。"],"try":["This month, before you say a hard truth, add one sentence that shows you are on their side.","今月、厳しいことを言う前に、あなたが相手の味方であることが伝わる一言を、添えてください。"]},"work":{"fit":[["Frontier and independent work: entrepreneurship, overseas posts, farming, sales.","開拓と独立の仕事：起業、海外勤務、農業、営業。"],["Frontline roles that need courage: emergency, construction, logistics, outdoors.","勇気が要る現場の仕事：緊急対応、建設、物流、アウトドア。"],["Roles built on straight talk: coaching, negotiation, leading small teams.","率直な言葉が武器になる仕事：コーチング、交渉、少人数のリーダー。"]],"style":["You work best with freedom, challenge and honest colleagues. Office politics, hints and drawn-out processes leave you stuck.","自由、挑戦、正直な仲間がいると力が出ます。社内政治、遠回しな言い方、長引く手続きは、あなたを足止めします。"],"money":["You earn through effort and initiative, often away from your birthplace or in your own venture. Money comes in waves. Keep a cushion for slow periods, and avoid lending beyond what you can lose.","努力と主体性で稼ぎ、生まれた場所を離れたり、自分の事業を持ったりして伸びることが多い人です。収入には波があります。収入の少ない時期の備えを持ち、失っても大丈夫な額を超える貸し借りは、避けてください。"],"caution":["Accepting help is also a strength. Let someone give back to you.","助けを受け取ることも、強さです。誰かに、お返しをさせてあげてください。"]},"drain":["Hints instead of honesty, being held to a routine and fake politeness.","正直さのかわりの遠回しな言い方、繰り返しに縛られること、うわべだけの礼儀。"],"recharge":["Open air, travel, physical effort, a long meal with plain-spoken friends.","外の空気、旅、体を使うこと、気取らない友人との長い食事。"],"week":["This week, accept one offer of help you would normally refuse.","今週、普段なら断る助けの申し出を、一つ、受け取ってください。"],"close":["Your honesty is a gift, and so is your toughness. Let yourself also be someone people can take care of.","あなたの正直さは贈り物で、たくましさもそうです。あなた自身も、人が大切にしたくなる存在であることを、許してあげてください。"]},"dipper":{"core":[["You are calm on the outside and fiercely determined within. You carry a strong sense of purpose and a competitive streak you rarely show. People sense the inner strength without seeing it displayed, and they follow your lead.","外側は穏やかで、内側は激しい意志を持っています。強い使命感と、めったに見せない闘争心を抱えています。内なる強さは、見せなくても人に伝わり、人はあなたについてきます。"],["You are idealistic and have a spiritual side that looks for meaning in what you do. You want a partner and a path you can deeply respect, and you tend to wait until you find them. The risk is that your standards of respect are so high that few people ever reach them.","理想が高く、していることに意味を探す、精神的な面もあります。心から尊敬できる相手と道を求めていて、それが見つかるまで待つ傾向があります。リスクは、尊敬の基準が高すぎて、そこへ届く人がほとんどいないことです。"]],"strengths":[["Quiet authority","静かな統率力","You lead without raising your voice, and people trust the steadiness.","声を張らずに導き、その安定感を人が信頼します。"],["Sense of purpose","使命感","You know what you are here to do, and that gives your efforts direction.","自分が何のためにいるかを知っていて、努力に方向があります。"],["Inner reserves","内なる底力","When pressure rises, your strength appears.","プレッシャーが高まるほど、あなたの強さが現れます。"]],"blind":[["Hidden ambition","見せない野心","Others may not know what you want, so they cannot help you get it.","何を望んでいるかが伝わらず、周りが手助けできません。"],["Hard to reach","近づきにくい","Calm can read as distance, and you can seem unreachable.","穏やかさが距離に見えて、近づきがたい人だと思われることがあります。"],["Impossible standards","尊敬の基準が高すぎる","Few partners or leaders pass your test, so you stay alone with your ideals.","あなたの基準を満たす相手や上司は少なく、理想を抱えたまま一人になりがちです。"]],"love":{"attract":["You are drawn to people you can respect completely. Integrity, purpose and depth, along with strength they do not need to display, attract you, much like what you bring yourself.","心から尊敬できる人に惹かれます。誠実さ、目的意識、深さ、そして見せびらかさない強さに、心が動きます。あなた自身が持っているものと、よく似ています。"],"pattern":["You are idealistic, and you look for someone you can deeply respect. The pattern to watch is holding back affection until respect is fully earned, so a partner feels they are always being evaluated.","理想が高く、深く尊敬できる人を探しています。注意したいのは、尊敬が完全に得られるまで愛情を出さず、相手が常に評価されているように感じることです。"],"try":["This month, tell your partner one thing you already respect about them, without waiting for more proof.","今月、すでに尊敬しているところを、パートナーに一つ、これ以上の証拠を待たずに伝えてください。"]},"work":{"fit":[["Purpose-driven and leadership roles: management, public service, the military, coaching.","使命感を持って導く仕事：経営、公務、防衛、コーチング。"],["Competitive and disciplined fields: sports, martial arts, research, finance.","競争と規律の分野：スポーツ、武道、研究、金融。"],["Spiritual and teaching work: religion, philosophy, mentoring.","精神性と教えの仕事：宗教、哲学、指導。"]],"style":["You work best with a meaningful mission and a leader or team you respect. Work that feels pointless or leaders you cannot respect sap your drive.","意味のある使命と、尊敬できる上司や仲間がいると力が出ます。意味を感じない仕事や、尊敬できない上司は、意欲を奪います。"],"money":["You earn through authority and trust, often steadily rising. You are not flashy with money and tend to invest in purpose and development. Keep clear records so ambition does not outpace planning.","権威と信頼を通じて、着実に収入が上がります。お金の使い方は派手ではなく、目的と成長への投資が中心です。野心が計画を追い越さないよう、記録はきちんと残してください。"],"caution":["Let others know what you are aiming at. People help those whose goals they can see.","何を目指しているか、人に伝えてください。人は、目標が見える人を助けます。"]},"drain":["Aimless work, leaders you cannot respect and small talk about nothing.","目的のない仕事、尊敬できない上司、中身のない雑談。"],"recharge":["Silence, training, time in nature, reading something that makes you think.","静けさ、鍛錬、自然の中で過ごすこと、考えさせられる読書。"],"week":["This week, tell one trusted person what you are really aiming for, in plain words.","今週、信頼できる人に、本当に目指していることを、素直な言葉で伝えてください。"],"close":["Your strength is quiet, and it is real. Let a few people stand close enough to see it, and to be warmed by it.","あなたの強さは静かで、そして本物です。数人には、それが見えて、温かさを感じられる距離まで、近づかせてあげてください。"]},"maiden":{"core":[["You study hard, work methodically and keep your promises. Discipline, patience and a plan for everything are your trademarks. Quiet effort earns you authority, and over time people place you in charge because they have watched you deliver, not because you asked.","よく学び、手順を踏んで働き、約束を守ります。規律、辛抱強さ、何事にも計画があることが、あなたの持ち味です。静かな努力が信頼と立場を生み、時間をかけて、自分から求めなくても、人はあなたに任せるようになります。"],["You manage people and resources well, and you see the whole board. The cost of all this order is that you can be hard on yourself, slow to relax and reserved with new people. Care shows up for you as practical help rather than words, and you may not realize how much that is worth.","人も資源も上手に管理し、全体を見渡せます。その秩序の代償は、自分に厳しく、くつろぐのが遅く、初対面の人には控えめになることです。あなたの愛情は、言葉ではなく実際に役立つ形で表れ、それがどれほど価値のあることかに、気づいていないかもしれません。"]],"strengths":[["Planning","計画力","You see the steps, the risks and the order, and then you do it.","手順、リスク、順序を見通して、そしてやり遂げます。"],["Reliability","約束を守る力","A promise from you is as good as done.","あなたの約束は、できたも同然です。"],["Management","管理する力","You allocate time, people and money so that things run smoothly.","時間、人、お金を割り振って、物事を円滑に回せます。"]],"blind":[["Hard on yourself","自分に厳しい","You rarely feel done, and you treat rest as something to earn.","「終わった」と感じにくく、休息を、稼いで得るものだと思っています。"],["Controlling the plan","計画に縛られる","When plans change, stress rises fast, and you can micromanage.","予定が変わるとストレスが一気に高まり、細かく管理しすぎることがあります。"],["Reserved at the start","最初の壁が高い","New people may read you as cold before they see your care.","新しい人には、優しさが伝わる前に、冷たく見えることがあります。"]],"love":{"attract":["You are drawn to people who are capable, honest and reliable, who follow through on what they say. Someone who respects your effort and helps you relax is deeply appealing.","有能で、正直で、頼れて、言ったことを実行する人に惹かれます。あなたの努力を認めて、肩の力を抜かせてくれる人は、とても魅力的です。"],"pattern":["You are reserved at first and show care through practical support. The pattern to watch is showing love through tasks, such as fixing, planning and handling things, while your partner is waiting to hear the words.","最初は控えめで、実際の支えで愛情を示します。注意したいのは、愛情を、直す、段取りする、片づけるといった作業で示している間、パートナーは、言葉を待っていることです。"],"try":["This month, say one affectionate sentence out loud to your partner, with no task attached.","今月、作業を何も添えずに、愛情のこもった一言を、パートナーに声に出して伝えてください。"]},"work":{"fit":[["Management and operations: administration, project management, finance, logistics.","管理と運営の仕事：事務管理、プロジェクト管理、財務、物流。"],["Planning and strategy: consulting, research, education, planning.","計画と戦略の仕事：コンサルティング、研究、教育、企画。"],["Craft and care professions: nursing, accounting, medicine, law.","技能とケアの専門職：看護、会計、医療、法律。"]],"style":["You work best with clear goals, defined roles and time to do things in order. Chaotic, last-minute workplaces cost you the most.","明確な目標、はっきりした役割、順序立ててやる時間があると力が出ます。混乱して直前になって決まる職場は、もっとも消耗します。"],"money":["You are a careful manager of money, and your finances improve steadily through budgeting and saving. Your caution protects you. Allow yourself planned spending on joy so that discipline does not become deprivation.","お金を丁寧に管理する人で、予算と貯蓄で、家計が着実に良くなります。慎重さがあなたを守ります。規律が我慢にならないよう、楽しみへの出費も、計画の中に入れてあげてください。"],"caution":["Build rest and fun into the plan itself, or they will never happen.","休息と楽しみを、計画の中に組み込んでください。そうしないと、永遠に来ません。"]},"drain":["Last-minute changes, disorder and carrying other people's unfinished work.","直前の変更、乱雑さ、他人の仕事の尻ぬぐい。"],"recharge":["A tidy space, a finished checklist, a quiet evening, a walk with someone who needs nothing from you.","整った空間、終わったチェックリスト、静かな夜、何も求めない人との散歩。"],"week":["This week, put a one-hour block of pure rest into your calendar and treat it like an appointment.","今週、予定表に、何もしない一時間を入れて、約束と同じように扱ってください。"],"close":["You hold so many things together. Let someone hold you for a while, and let the plan have a gap in it for joy.","あなたは、とても多くのものを支えています。少しの間、誰かにあなたを支えさせて、計画にも、楽しみのための余白を作ってあげてください。"]},"void":{"core":[["You have a rich inner world and ideals that reach past the ordinary. You feel deeply, and you think in big, unconventional pictures. Your moods swing between confidence and doubt, and that tension feeds real creativity.","豊かな内面と、日常を超えて伸びる理想を持っています。深く感じ、型にはまらない大きな絵で考えます。気分は、自信と迷いの間を揺れ動き、その緊張が、本物の創造性を育てます。"],["You see possibilities that others miss, and also dangers that others miss. Being misunderstood is a familiar feeling, and you protect your inner life by keeping it private. You are romantic and sensitive, and you thrive when someone gives you patient, genuine understanding.","ほかの人が見逃す可能性と、ほかの人が見逃す危うさの、両方が見えます。誤解されることには慣れていて、内面を守るために、私的なものにしています。ロマンチックで繊細で、辛抱強く本当に理解してくれる人がいると、大きく伸びます。"]],"strengths":[["Imagination","想像力","You see what does not exist yet, and sometimes you make it exist.","まだ存在しないものを見て、時にはそれを実現させます。"],["Depth of feeling","感受性の深さ","You respond to beauty, loss and meaning more intensely than most.","美しさ、喪失、意味に、ほとんどの人より深く反応します。"],["Original thinking","独自の発想","You do not repeat what you were told, and your angle is your own.","教えられたことをなぞらず、あなた自身の視点で考えます。"]],"blind":[["Swinging moods","気分の波","Confidence and doubt alternate, and it is hard to plan around either.","自信と迷いが交互に来て、どちらに合わせても計画を立てにくくなります。"],["Isolation","孤立しやすい","Feeling misunderstood, you pull away before anyone can try.","分かってもらえないと感じて、誰かが試す前に、自分から距離を置きます。"],["Dreaming past doing","夢のまま終わる","A vivid idea can feel complete enough that it never gets built.","鮮やかな発想で満足してしまい、形にならないままになることがあります。"]],"love":{"attract":["You are drawn to people with an inner life and a gentle way of showing it. Someone who listens without hurrying you, shares your sense of wonder and does not need you to be simple is rare and precious.","内面が豊かで、それを穏やかに表せる人に惹かれます。急かさずに聞いてくれて、あなたと同じ驚きの感覚を持ち、あなたに単純さを求めない人は、得がたい存在です。"],"pattern":["You are romantic and private. The pattern to watch is waiting for someone to understand you without being told, and then withdrawing when they do not. A patient partner is a must, and you also have to help them learn how.","ロマンチックで、内面は私的です。注意したいのは、言わなくても分かってくれる人を待って、分かってもらえないと引きこもることです。気の長いパートナーが必要ですが、その人に分かり方を教えるのも、あなたの役目です。"],"try":["This month, explain one feeling to your partner in concrete words, even if it feels clumsy.","今月、一つの気持ちを、たどたどしくても、具体的な言葉でパートナーに説明してみてください。"]},"work":{"fit":[["Creative and imaginative fields: writing, art, music, design, film, game design.","創造と想像の分野：執筆、美術、音楽、デザイン、映像、ゲーム制作。"],["Roles that use sensitivity: counseling, therapy, research, philosophy.","感受性が活きる仕事：カウンセリング、心理、研究、哲学。"],["Independent or unconventional paths with room for your own vision.","自分のビジョンを活かせる、独立した、あるいは型にとらわれない道。"]],"style":["You work best with freedom, quiet and room for your own vision. Rigid supervision and noisy open offices wear you down.","自由、静けさ、自分のビジョンを活かせる余白があると力が出ます。厳しい監督や騒がしいオフィスは、あなたをすり減らします。"],"money":["Income can be uneven, and your relationship with money can be loose. A basic steady income, plus a system that handles bills automatically, protects the room you need to create.","収入には波が出やすく、お金との付き合いは、おおらかです。基本の安定した収入と、支払いを自動で処理する仕組みがあると、創るために必要な余白が守られます。"],"caution":["Give an idea a first small form within a week, or it may stay a feeling forever.","思いついたら一週間以内に、小さくてもいいから形にしてください。そうしないと、一生、気分のままになることがあります。"]},"drain":["Being rushed, being dismissed as too sensitive and rigid environments.","急かされること、「繊細すぎる」と片づけられること、窮屈な環境。"],"recharge":["Solitude, music, art, night walks, writing in a private notebook.","ひとりの時間、音楽、美術、夜の散歩、私的なノートに書くこと。"],"week":["This week, take one idea out of your head and put it on paper or screen in a rough form.","今週、頭の中のアイデアを一つ、荒くてもいいので、紙か画面に出してください。"],"close":["Your inner world is not a flaw to fix. Give it a few ways out, and a few people who are glad to visit.","あなたの内面は、直すべき欠点ではありません。外へ出る出口をいくつか作って、喜んで訪ねてくれる人を、数人、招いてください。"]},"rooftop":{"core":[["Life is more fun near the edge. You love novelty, people and a little risk. Quick to try things, you bring energy to any group, and you often spot a trend before anyone else does. Where others see a leap, you see a game.","人生は、端っこに近いほど面白い。新しいもの、人、少しのリスクが好きです。すぐに試し、どんな集まりにも活気を与え、流行を誰より早く見つけることもよくあります。ほかの人が崖と見る場所を、あなたはゲームと見ます。"],["Your sociability is real and your appetite for change is strong. Routine is the enemy, and boredom can push you into starting something just for the spark. The challenge is building something that outlasts the thrill, and finding calm that does not feel like a trap.","社交性は本物で、変化への欲求も強い人です。繰り返しは大敵で、退屈から、刺激のためだけに何かを始めることもあります。課題は、高揚が冷めたあとも残るものを築くことと、罠のように感じない穏やかさを見つけることです。"]],"strengths":[["Trend sense","流行を見つける目","You pick up what is coming before it is obvious.","来るものを、はっきり見える前にかぎ取ります。"],["Social energy","場を盛り上げる力","Gatherings come alive when you arrive.","あなたが来ると、集まりが活気づきます。"],["Willingness to try","試す勇気","You learn by doing and are not stopped by fear of looking foolish.","やりながら学び、恥をかく怖さに止められません。"]],"blind":[["Routine intolerance","繰り返しに耐えられない","Anything repeated starts to feel like a cage, even good things.","良いものでも、繰り返しが檻のように感じられてきます。"],["Risk without a net","備えのない冒険","You take chances before you have a way to recover from a loss.","失敗から戻る備えを作る前に、賭けに出ることがあります。"],["Scattered follow-through","やりっぱなし","New things pull you before the old ones are settled.","新しいものに引かれて、古いものが片づく前に動いてしまいます。"]],"love":{"attract":["You are drawn to people who are fun, spontaneous and a little daring. Someone who says yes to an unplanned weekend, laughs easily and does not cling will keep you interested.","楽しくて、気まぐれで、少し大胆な人に惹かれます。予定のない週末に「いいね」と言い、よく笑い、しがみつかない人が、あなたの関心を保ちます。"],"pattern":["You are fun and spontaneous, and routine is the enemy. The pattern to watch is leaving when a relationship becomes ordinary, before discovering whether there is depth under the routine.","楽しくて気まぐれで、マンネリが大敵です。注意したいのは、関係が普通になった時点で離れてしまい、繰り返しの下に深さがあるかどうかを、確かめずに終えることです。"],"try":["This month, make one ordinary evening with your partner into something new, such as a new route, a new dish or a new game.","今月、パートナーとの普通の夜を、新しい道、新しい料理、新しいゲームなどで、一つ、変えてみてください。"]},"work":{"fit":[["Trend-facing fields: media, marketing, fashion, tech, entertainment, startups.","流行に近い分野：メディア、マーケティング、ファッション、テクノロジー、エンタメ、スタートアップ。"],["Social and event work: promotion, travel, hospitality, community building.","社交とイベントの仕事：プロモーション、旅行、接客、コミュニティづくり。"],["Adventure and sport roles with movement and variety.","動きと変化のある、冒険やスポーツの仕事。"]],"style":["You work best with variety, fast feedback and freedom to try. Long, repetitive work with no change keeps you from your best.","変化、すばやいフィードバック、試す自由があると力が出ます。長く単調で、変化のない仕事は、あなたの最良の力を妨げます。"],"money":["Income can be uneven, with exciting highs. Because you enjoy risk, money can leave as quickly as it arrives. Separate a safe account that you do not touch, and play with the rest.","収入には波があり、思わぬ高みもあります。リスクを楽しむ人なので、お金も来た速さで出ていくことがあります。手を付けない安全な口座を分けて、残りで遊ぶのが合っています。"],"caution":["Build a safety net first. Then the risks become fun instead of frightening.","先に安全網を作ってください。そうすれば、リスクは怖いものではなく、楽しいものになります。"]},"drain":["Routine with no variety, slow decisions and people who avoid any risk.","変化のない繰り返し、遅い決定、リスクを一切避ける人。"],"recharge":["A new place, a social event, a sport with some thrill, a spontaneous trip.","新しい場所、人の集まり、スリルのあるスポーツ、思いつきの小旅行。"],"week":["This week, set aside a small fixed amount into a separate account, then enjoy one new experience guilt-free.","今週、少額を別の口座に先に分けておいて、そのあと、新しい体験を一つ、気兼ねなく楽しんでください。"],"close":["Your adventurous spirit keeps everyone around you awake. Build a home base to come back to, and the adventures will taste even better.","あなたの冒険心は、周りの人を目覚めさせます。帰れる拠点を作っておけば、冒険は、もっと美味しくなります。"]},"hall":{"core":[["You think on a grand scale and push projects forward with force. Obstacles rarely slow you, and you often build something that lasts. Energy, confidence and enterprise come naturally, and people recognize a person who gets things done.","大きなスケールで考え、力強く物事を進めます。障害ではめったに止まらず、長く残るものを築くことが多い人です。エネルギー、自信、事業を起こす力が自然に備わり、人は、あなたを「やり遂げる人」と見ます。"],["Pride is a strong part of you, and you take charge easily. You protect those under your care and expect to lead. The shadow side is difficulty in yielding, and a tendency to build more than you can personally maintain without wearing yourself or others down.","誇りは、あなたの強い一部で、自然に指揮を取ります。自分の庇護の下にいる人を守り、リードすることを当然と思います。影の面は、譲るのが苦手なことと、自分や周りを消耗させるほど、手に余るものを築いてしまうことです。"]],"strengths":[["Scale of vision","大きく考える力","You plan beyond the next quarter and bring others along.","目先を超えた先を計画し、人を巻き込んでいけます。"],["Drive","推進力","Once you commit, you bulldoze past obstacles.","決めたら、障害を押しのけて進みます。"],["Protectiveness","守る力","People under your wing are safe and know it.","あなたの庇護の下にいる人は、安全で、それを分かっています。"]],"blind":[["Dominating","仕切りすぎる","Taking charge can leave no room for other people's ideas.","指揮を取ることで、ほかの人の考えを入れる余地がなくなることがあります。"],["Overbuilding","背負いすぎる","Projects grow past what you or your team can sustain.","事業が、あなたやチームが支えられる範囲を超えて膨らみます。"],["Pride in the way","プライドが邪魔をする","Admitting a mistake or asking for help feels harder than it should.","ミスを認めることや助けを求めることが、必要以上に難しく感じられます。"]],"love":{"attract":["You are drawn to confident, capable people who can match your energy without being overshadowed. Someone you respect who also respects you, and who is not afraid of your strength, is the one you want.","自信があって有能で、あなたの勢いと並びながら、飲み込まれない人に惹かれます。あなたが尊敬できて、あなたを尊敬してもくれて、あなたの強さを恐れない人が理想です。"],"pattern":["You are protective and proud, and you lead in love as in life. The pattern to watch is making decisions for the two of you, and then wondering why your partner feels unheard.","守りたい気持ちが強く、誇り高く、恋でも人生でもリードします。注意したいのは、二人のことを一人で決めてしまい、パートナーが聞いてもらえていないと感じる理由が分からないことです。"],"try":["This month, ask your partner for their plan first on one decision, and follow it.","今月、一つの決めごとについて、先にパートナーの案を聞いて、それに従ってみてください。"]},"work":{"fit":[["Building and enterprise: founding a company, development, construction, large projects.","築く仕事、事業の仕事：起業、開発、建設、大型プロジェクト。"],["Leadership and management: executive roles, organizing large teams.","リーダーと管理の仕事：経営層、大きなチームの統率。"],["Fields tied to place and structure: real estate, architecture, infrastructure.","場所や構造に関わる分野：不動産、建築、インフラ。"]],"style":["You work best with authority, scale and a clear mandate. Micromanaging bosses and small, petty tasks shrink you.","権限、規模、はっきりした任務があると力が出ます。細かく管理する上司や、ちまちました仕事は、あなたを小さくします。"],"money":["Income is often large and tied to what you build. The risk is reinvesting everything into growth with no reserve. Keep personal savings separate from the venture.","収入は大きくなりやすく、築いたものと結びつきます。リスクは、成長のために全額を再投資して、備えが残らないことです。個人の貯蓄は、事業とは別に持ってください。"],"caution":["Let someone you trust check your biggest plan before you commit.","大きな計画は、決める前に、信頼できる人に点検してもらってください。"]},"drain":["Being second-guessed in public, small-minded bureaucracy and dead ends.","人前での疑い、小さな官僚主義、行き止まり。"],"recharge":["Physical activity, a big view, building something with your hands, a solid night's sleep.","体を動かすこと、大きな景色、手で何かを作ること、しっかりした睡眠。"],"week":["This week, hand one task entirely to someone else, and do not check on it.","今週、仕事を一つ、すべて誰かに任せて、途中で確認しないでください。"],"close":["You build lasting things, and the people you build with will remember how it felt. Make it a good memory.","あなたは、長く残るものを築きます。そして、一緒に築いた人は、その時の気持ちを覚えています。それを、良い思い出にしてください。"]},"wall":{"core":[["You prefer to work behind the scenes, where your judgement and loyalty hold everything up. You are the quiet strength others lean on, often without realizing it. You have a taste for the mysterious and rarely reveal all you know.","裏方で働くことを好み、そこであなたの判断力と誠実さが、全体を支えています。周りの人が、気づかないうちに寄りかかっている、静かな強さです。神秘的なものを好み、知っていることのすべては、めったに明かしません。"],["You are wise about people and situations, and you keep confidences well. The cost is that your own needs can stay invisible, because you spend so much energy supporting others. You love by standing firmly beside someone, and you want that steadiness returned.","人や状況について賢く、秘密を守るのも上手です。その代償は、人を支えることに力を使うぶん、自分の必要が、見えないままになることです。そばにしっかり立つことで愛する人で、同じ安定感を返してもらうことを、望んでいます。"]],"strengths":[["Quiet support","静かに支える力","Things hold together because you are in the structure, even if no one sees it.","誰にも見えなくても、あなたが構造の中にいるから、物事がまとまっています。"],["Sound judgement","確かな判断","You see the situation and the people in it more clearly than most.","状況とそこにいる人を、ほとんどの人より、はっきり見ています。"],["Discretion","口の堅さ","What you are told stays with you, and people feel safe around you.","聞いたことはあなたの中にとどまり、人は安心して話せます。"]],"blind":[["Invisible needs","自分の必要が見えない","You support others so well that no one thinks to ask what you need.","人を支えるのが上手すぎて、あなたが何を必要としているかを、誰も聞かなくなります。"],["Holding back knowledge","知っていることを明かさない","You keep insights to yourself, and others miss out on your wisdom.","洞察を胸にしまい、周りがあなたの知恵を受け取り損ねます。"],["Keeping a distance","一歩引く","Private by nature, you can seem hard to read and hard to know.","もともと私的なので、読みにくく、知りにくい人に見えます。"]],"love":{"attract":["You are drawn to sincere, steady people who value loyalty. Someone who notices your quiet effort and shows appreciation matters more to you than loud romance.","誠実で安定した、忠誠心を大切にする人に惹かれます。あなたの静かな努力に気づき、感謝を示してくれる人は、派手な恋愛よりも、あなたにとって大切です。"],"pattern":["You are devoted and discreet. The pattern to watch is supporting a partner so completely that you never ask for anything, then feeling unseen. You love by standing at someone's side, and you need to be allowed to lean too.","献身的で控えめです。注意したいのは、パートナーを完全に支えすぎて、何も求めず、そのあと見てもらえていないと感じることです。そばに立つことで愛する人ですが、あなたも、寄りかかることを自分に許す必要があります。"],"try":["This month, ask your partner for one specific thing you want, such as help, time or attention.","今月、パートナーに、手助け、時間、関心など、してほしいことを具体的に一つ、頼んでみてください。"]},"work":{"fit":[["Support and coordination: administration, secretarial, operations, planning, advisory.","支えと調整の仕事：事務、秘書、運営、企画、アドバイザー。"],["Roles that need discretion and insight: research, security, law, archives.","口の堅さと洞察が要る仕事：研究、セキュリティ、法律、資料管理。"],["Mystery, craft and traditional fields: divination, restoration, esoteric studies.","神秘、職人技、伝統の分野：占い、修復、神秘学。"]],"style":["You work best in a stable team with a trusted leader, in a role where your steady contribution is valued. Spotlight roles and constant visibility tire you.","信頼できるリーダーのもと、安定した仲間と、あなたの堅実な貢献が評価される役割で、力が出ます。注目される役目や、常に見られることは、疲れます。"],"money":["Money grows through steady, behind-the-scenes contribution, and you are cautious by nature. Ask for fair pay for the work that others rely on, even though you rarely draw attention to it.","お金は、裏方としての着実な貢献で増え、あなたは生まれつき慎重です。表に出ることは少なくても、人が頼りにしているあなたの仕事に、正当な報酬を求めてください。"],"caution":["Make your contribution visible once in a while. People cannot value what they cannot see.","時々は、自分の貢献を見える形にしてください。見えないものを、人は評価できません。"]},"drain":["Being taken for granted, the spotlight and gossip.","当然のように扱われること、注目の的になること、噂話。"],"recharge":["Quiet corners, a mysterious book or film, tea, time with one deeply trusted person.","静かな場所、神秘的な本や映画、お茶、深く信頼できる一人との時間。"],"week":["This week, tell one person exactly what you did that helped, plainly and without apology.","今週、役に立ったことを、誰か一人に、遠慮せず、ありのまま伝えてください。"],"close":["You are the pillar that keeps the house standing. Let someone remember to thank the pillar, and say what it needs.","あなたは、家を立たせている柱です。誰かが柱に感謝することを思い出せるように、柱が何を必要としているかを、伝えてください。"]},"stride":{"core":[["You are upright and gentle, guided by a clear conscience. You value pure intentions and treat people with courtesy, and that sincerity wins respect. Good partnerships, in marriage and at work, bring out your best fortune.","あなたは、品があって優しく、澄んだ良心に導かれています。純粋な動機を大切にして、人に礼儀正しく接し、その誠実さが尊敬を生みます。結婚でも仕事でも、良いパートナーシップが、あなたの最高の運を引き出します。"],["You are refined and principled, and you look for a true life partner rather than a passing connection. Because you hold yourself to a high standard of conduct, you can be hurt by carelessness in others, and you can be slow to forgive a betrayal of trust.","洗練されていて、筋が通っていて、一時的なつながりではなく、人生を共にする伴侶を求めています。自分の行いに高い基準を持つぶん、他人の無神経さに傷つきやすく、信頼を裏切られると、許すのに時間がかかります。"]],"strengths":[["Integrity","誠実さ","Your motives are clean, and people sense it.","動機が澄んでいて、人はそれを感じ取ります。"],["Courtesy","礼儀と気品","You make others feel respected, which opens doors in every setting.","人を尊重する態度で、どんな場でも扉が開きます。"],["Partnership luck","良縁に恵まれる運","Marriage and cooperative work bring out the best in your fortune.","結婚や協力する仕事で、あなたの運が最もよく発揮されます。"]],"blind":[["Slow to forgive","許すのが遅い","A broken promise or a careless remark can stay with you for years.","破られた約束や無神経な一言が、何年も心に残ることがあります。"],["Idealizing partners","相手を理想化する","You may see the best in someone and be hurt when reality shows a fuller picture.","相手の最良の面を見て、現実の全体像が見えた時に傷つくことがあります。"],["Avoiding rough ground","荒っぽい場を避ける","You steer away from blunt or competitive environments that could toughen you.","率直で競争的な環境を避け、そこで鍛えられる機会を逃すことがあります。"]],"love":{"attract":["You are drawn to sincere, well-mannered people with good values who treat you with respect. Someone who is kind to waiters, keeps their word and wants a real partnership appeals to you.","誠実で、礼儀正しく、価値観が良く、あなたを尊重して接してくれる人に惹かれます。店員さんにも優しく、約束を守り、本気のパートナーシップを望む人が魅力的です。"],"pattern":["You are faithful and idealistic, and you want a true life partner. The pattern to watch is carrying a picture of the perfect union and measuring each real moment against it, or waiting for certainty before opening your heart.","誠実で理想が高く、人生を共にする本当の伴侶を求めています。注意したいのは、完璧な結びつきの像を抱いて、現実の一つひとつの場面を比べること、そして、確信が持てるまで、心を開くのを待ってしまうことです。"],"try":["This month, share one imperfect thing about yourself with someone you care about, and notice that it makes you closer.","今月、大切な人に、自分の不完全なところを一つ話してみてください。それで距離が縮まることに気づくはずです。"]},"work":{"fit":[["Roles that rely on trust and courtesy: law, diplomacy, education, hospitality, finance.","信頼と礼儀が要る仕事：法律、外交、教育、接客、金融。"],["Partnership-based work: co-founded ventures, teams, client advisory.","パートナーとの仕事：共同経営、チーム、顧客へのアドバイス。"],["Culture and refinement: arts administration, tea and traditional arts, publishing.","文化と洗練の分野：芸術の運営、茶道や伝統芸能、出版。"]],"style":["You work best with respectful colleagues, a clear ethical standard and a trusted partner. Aggressive, cynical workplaces take your joy away.","敬意のある同僚、はっきりした倫理基準、信頼できるパートナーがいると力が出ます。攻撃的でシニカルな職場は、あなたの喜びを奪います。"],"money":["Your fortune improves through good partnerships and a trusted reputation. Choose collaborators carefully, because a poor partner costs you more than most. Written agreements protect you and the relationship.","運は、良いパートナーシップと信頼される評判で上向きます。協力者は慎重に選んでください。合わない相手は、ほかの人より、あなたに大きな損をもたらします。書面での取り決めが、あなたと関係を守ります。"],"caution":["Vet a partner before you trust them, not after they let you down.","パートナーを信頼するのは、裏切られたあとではなく、見極めたあとにしてください。"]},"drain":["Coarse company, broken promises and cynicism.","品のない場、破られた約束、シニカルな態度。"],"recharge":["Tea, a quiet garden, beautiful music, an honest talk with a close friend.","お茶、静かな庭、美しい音楽、親友との誠実な会話。"],"week":["This week, forgive one small thing you have been holding against someone, and let it go.","今週、誰かに対して握りしめている小さなことを一つ許して、手放してください。"],"close":["Your sincerity is rare, and it draws the right people to you. Trust that, and let imperfect people in.","あなたの誠実さは貴重で、ふさわしい人を引き寄せます。それを信じて、不完全な人も、迎え入れてあげてください。"]},"bond":{"core":[["You have a sharp eye for detail and a talent for bringing people together. You notice what others miss and quietly put things in order, so that a messy situation becomes workable. As an adviser or go-between you are invaluable.","細部への鋭い目と、人を結びつける才能があります。ほかの人が見逃すことに気づき、静かに整えて、混乱した状況を、動かせる状態にします。相談役としても、仲介役としても、欠かせない存在です。"],["Your care shows up in small things: remembering a preference, fixing a loose end, passing along the right name at the right time. The risk is that these quiet efforts go unseen, and that you take on everyone's loose ends until your own list is buried.","あなたの思いやりは、小さなことに表れます。好みを覚えていること、残りの課題を片づけること、ちょうどよい時にちょうどよい人を紹介すること。リスクは、その静かな努力が気づかれないことと、みんなの残りの仕事を引き受けて、自分の分が埋もれることです。"]],"strengths":[["Attention to detail","細部への気づき","You catch the error, the gap or the missing step before it causes trouble.","ミス、抜け、足りない手順に、問題になる前に気づきます。"],["Bringing people together","人をつなぐ力","You know who should meet whom, and you make it happen.","誰と誰が会うべきかを知っていて、実現させます。"],["Helpfulness","世話好き","People come to you because you actually help and follow through.","実際に助けて最後までやり遂げるので、人があなたのところに来ます。"]],"blind":[["Doing it all quietly","黙って全部やる","You do the work and skip the credit, so your effort is invisible.","仕事だけしてクレジットを求めないので、努力が見えません。"],["Perfectionism in small things","細かいところにこだわる","You can spend an hour on a detail that did not need it.","必要のない細部に、一時間使ってしまうことがあります。"],["Taking others' loose ends","他人の尻ぬぐい","Because you can fix it, people let you, and it adds up.","直せるから、人はあなたに任せ、それが積み重なります。"]],"love":{"attract":["You are drawn to considerate people who notice you in return. Someone who remembers small things, says thank you and shows up on time feels like love to you.","思いやりがあって、あなたにも気づいてくれる人に惹かれます。小さなことを覚えていて、ありがとうと言い、時間どおりに来る人が、あなたには愛情に感じられます。"],"pattern":["You are caring and attentive, and you look after the small things that matter. The pattern to watch is giving quietly and expecting your partner to notice, then feeling hurt when they do not.","思いやりがあって気配りができ、大切な小さなことを大事にします。注意したいのは、静かに与えて、相手が気づくことを期待し、気づかれないと傷つくことです。"],"try":["This month, tell your partner one thing you did for them that they might not have noticed.","今月、パートナーが気づいていないかもしれないことを一つ、してあげたと、伝えてください。"]},"work":{"fit":[["Coordination and service: project management, operations, concierge, customer care, HR.","調整とサービスの仕事：進行管理、運営、コンシェルジュ、お客様対応、人事。"],["Detail-oriented work: editing, accounting, quality assurance, research assistance.","細部が大切な仕事：編集、会計、品質管理、調査補佐。"],["Matchmaking and advisory: recruiting, consulting, brokerage, introductions.","縁をつなぐ仕事：採用、コンサルティング、仲介、紹介。"]],"style":["You work best where precision and care are valued and you have a clear area of responsibility. Chaotic teams with no ownership frustrate you.","正確さと気配りが評価されて、責任範囲が明確な環境で力が出ます。誰も責任を持たない混乱したチームには、いらいらします。"],"money":["Money grows through reliability and good service, often by being the person people return to. Keep track of your time, since you give a lot away. Charge for the advising that others take for granted.","お金は、信頼性と質の良いサービス、そして「また頼みたい人」であることで増えます。時間をたくさん分け与えるので、記録しておいてください。当たり前のように求められる助言にも、きちんと対価をもらうことです。"],"caution":["Not every loose end is yours. Name the ones you will take, and leave the rest.","すべての残りの仕事が、あなたのものではありません。引き受けるものを決めて、あとは手放してください。"]},"drain":["Sloppy handoffs, unclear roles and unthanked effort.","雑な引き継ぎ、役割のあいまいさ、感謝のない努力。"],"recharge":["A tidy desk, a finished list, a short walk, a friend who notices your efforts.","片づいた机、終わったリスト、短い散歩、あなたの努力に気づいてくれる友人。"],"week":["This week, decline one extra favor politely, and use the time for something that is only for you.","今週、頼まれごとを一つ、丁寧に断って、その時間を、自分だけのために使ってください。"],"close":["You hold so many small threads together. Let someone notice the weaving, and let yourself be one of the people who gets looked after.","あなたは、たくさんの小さな糸を、まとめています。誰かに、その織り目に気づいてもらって、あなた自身も、大切にしてもらう側になることを、許してください。"]},"granary":{"core":[["You trust your own strength and prefer to carve your own road. Courage and a hunger for success carry you through tests that stop others. You are independent, bold and ambitious, and you would rather earn a place than be handed one.","自分の力を信じて、自分の道を切り開くことを好みます。勇気と成功への渇望が、ほかの人が止まる試練を、乗り越えさせます。自立していて、大胆で、野心があり、与えられるより、自分で勝ち取りたい人です。"],["There is a lone-wolf quality to you. You can be fiercely proud, and affection comes after respect, never before. The strength that   var y = +$(prefix + 'Year').value, m = +$(prefix + 'Month').value, d = +$(prefix + 'Day').value;

  if (t.getUTCMonth() !== m - 1) return {err:L(MONTH_NAMES[m-1] + ' ' + y + ' has no day ' + d + '. Pick another day.', y + '年' + m + '月に' + d + '日はありません。別の日を選んでください。')};

/* 十一の関係ごとの一言（その月・その日の宿が、あなたの宿から見て何にあたるか） */
var TONE = {
  ei:['Luck runs with you. A good time to start things.','運が味方する時。物事を始めるのに向いています。'],
  shin:['Warm and supported. Good for people and agreements.','あたたかく支えられる時。人との話し合いや約束ごとに向いています。'],
  yu:['Easy and light. Meet people, talk, enjoy yourself.','気楽で軽やかな時。会って話して、楽しむのに向いています。'],
  sei:['Effort pays off. Push your project forward.','努力が実りやすい時。取り組んでいる課題を前に進めて。'],
  an:['Calm and settled. Your usual pace works well.','穏やかで落ち着く時。いつものペースがよく合います。'],
  mei:['A mirror time. Look at yourself and reset.','自分を見つめ直す時。気持ちを整えるのに向いています。'],
  tai:['Quiet and protective. Look after what you already have.','守りの時。今あるものを大切にしましょう。'],
  go:['Old threads come back. Finish things before you start anything new.','過去の縁や宿題が戻りやすい時。新しいことより、片づけを先に。'],
  sui:['Energy dips. Rest, and do not give more than you have.','力が落ちやすい時。しっかり休んで、尽くしすぎないで。'],
  kai:['Plans may shake. Put big decisions off.','予定が揺れやすい時。大きな決断は先送りに。'],
  ki:['Unpredictable. Be careful with new bets.','思わぬことが起きやすい時。新しい賭けは慎重に。']
};
var TG = {ei:'good',shin:'good',yu:'good',sei:'good',an:'calm',mei:'calm',tai:'calm',go:'care',sui:'care',kai:'care',ki:'care'};
var TGN = {good:['Favorable','追い風'],calm:['Steady','安定'],care:['Go gently','慎重に']};
function tagOf(key){ var g = TG[key]; return '<span class="tag t-' + g + '">' + L(TGN[g][0], TGN[g][1]) + '</span>'; }
var LMON = ['Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan'];
var DOW = [['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],['日','月','火','水','木','金','土']];

function relName(key){ return lang === 'ja' ? RELJ[key][1] : REL[key][2]; }
function relMark(key){ return REL[key][0]; }

function nextDays(n){
  var t = todayJST(), base = dayNum(t.y, t.m, t.d), out = [];
  for (var i = 0; i < n; i++){
    var dt = new Date((base + i) * 86400000), y = dt.getUTCFullYear(), m = dt.getUTCMonth() + 1, d = dt.getUTCDate(), s = shukuOf(y, m, d);
    if (!s) continue;
    out.push({m:m, d:d, w:dt.getUTCDay(), key:relOf(mine.idx, s.idx).key});
  }
  return out;
}
function dayLabel(x){ return L(x.m + '/' + x.d + ' ' + DOW[0][x.w], x.m + '月' + x.d + '日（' + DOW[1][x.w] + '）'); }

function mp(i){
  var s = charSlug(i), v = CHARS[s];
  var im = v ? '<img src="/art/chars/' + s + '-s.webp?v=' + v + '" alt="" width="68" height="54">' : '<b lang="ja">' + M[i][0] + '</b>';
  return '<div class="mp">' + im + '<small>' + esc(lang === 'ja' ? M[i][0] + '宿' : M[i][2]) + '</small></div>';
}
function pkey(key){
  var list = [];
  for (var b = 0; b < 27; b++){ if (b !== mine.idx && relOf(mine.idx, b).key === key) list.push(b); }
  if (!list.length) return '';
  return '<div class="pkey"><div class="pkey-h"><b>' + esc(L(ROLE[key][0], ROLE[key][1])) + '</b><span>' + esc(L(REL[key][0] + ' ' + REL[key][1] + ' · ' + REL[key][2], RELJ[key][0] + '（' + RELJ[key][1] + '）')) + '</span></div>' +
    '<p>' + esc(L(SIDE[key].a[0], SIDE[key].a[1])) + '</p><div class="mrow">' + list.map(mp).join('') + '</div></div>';
}

function render(){
  if (!mine) return;
  var a = mine.idx, m = M[a], j = MJ[a], slug = charSlug(a), D = ME[slug], h = '';
  var big = CHARS[slug] ? '<img class="cover-art" src="/art/chars/' + slug + '.webp?v=' + CHARS[slug] + '" alt="" width="1200" height="960">' : '';
  h += '<section class="cover">' + big +
    '<p class="cover-for">' + L('A reading for you', 'あなたのための鑑定') + '</p>' +
    '<p class="cover-names">' + L(m[2] + ' Mansion', m[0] + '宿（' + YOMI[a] + '）') + '</p>' +
    '<p class="cover-for">' + dateText(mine) + '</p>' +
    '<p class="cover-bond">' + esc(L(m[3], j[0])) + '</p>' +
    '<p class="cover-sub">' + esc(L(m[4], j[1])) + '</p></section>';
  if (!D){
    h += '<section class="soon"><p>' + L('Your personal reading for this mansion is still being written. Please check back soon.', 'この宿の「自分用の鑑定」は、いま書いているところです。もうしばらくお待ちください。') + '</p></section>';
    $('reading').innerHTML = h; $('reading').hidden = false; return;
  }
  /* 1 */
  var tr = m[11], kw = lang === 'ja' ? j[2] : m[5];
  var li = function(x){ return '<li><b>' + esc(L(x[0], x[1])) + '</b><br>' + esc(L(x[2], x[3])) + '</li>'; };
  h += chapter(1, L('The real you', '本当のあなた'),
    '<ul class="chips" style="display:flex;flex-wrap:wrap;gap:6px">' + kw.map(function(x){ return '<li class="chip" style="background:var(--paper-2)">' + esc(x) + '</li>'; }).join('') + '</ul>' +
    D.core.map(pr).join('') +
    '<div class="meter">' + tr.map(function(v, i){ var lb = L(TRAITS[i][0], TRAITS[i][1]); return '<div class="meter-row"><span>' + lb + '</span>' + pbar([0, 34, 50, 66, 80, 92][v], lb) + '</div>'; }).join('') + '</div>' +
    '<div class="pros"><div class="pro good"><div class="pro-h"><span class="pro-ic" aria-hidden="true">＋</span>' + L('Your strengths', 'あなたの強み') + '</div><ul>' + D.strengths.map(li).join('') + '</ul></div>' +
    '<div class="pro care"><div class="pro-h"><span class="pro-ic" aria-hidden="true">！</span>' + L('Your blind spots', 'つまずきやすいところ') + '</div><ul>' + D.blind.map(li).join('') + '</ul></div></div>');
  /* 2 */
  h += chapter(2, L('How you love', '恋愛のしかた'),
    '<div class="rooms">' + room(L('Who moves you', '惹かれる人'), D.love.attract) + room(L('Your pattern', 'くり返しやすいパターン'), D.love.pattern) + '</div>' +
    '<div class="try"><span class="mini">' + L('Try this month', '今月やってみること') + '</span><p>' + esc(L(D.love.try[0], D.love.try[1])) + '</p></div>');
  /* 3 */
  h += chapter(3, L('Work and money', '仕事とお金'),
    '<ul class="dots">' + D.work.fit.map(function(x){ return '<li>' + CHECK + '<span>' + esc(L(x[0], x[1])) + '</span></li>'; }).join('') + '</ul>' +
    '<div class="rooms">' + room(L('How you work best', '力が出る環境'), D.work.style) + room(L('How money comes to you', 'お金との付き合い方'), D.work.money) + '</div>' +
    '<div class="gift">' + SPARK + '<div><span class="mini">' + L('Keep in mind', '覚えておくこと') + '</span><p>' + esc(L(D.work.caution[0], D.work.caution[1])) + '</p></div></div>');
  /* 4 */
  h += chapter(4, L('The people around you', 'まわりの人との相性'),
    '<p>' + L('Shukuyō sorts the other 26 mansions into kinds of bond with yours. Here is who lifts you, who is easy company, and who needs gentler handling.', '宿曜では、ほかの26の宿が、あなたの宿から見てどんな関係にあたるかが決まっています。運をくれる人、一緒にいて楽な人、ていねいに付き合いたい人を並べました。') + '</p>' +
    '<h3 class="grp">' + L('Lift you up', 'あなたを引き上げてくれる人') + '</h3>' + pkey('ei') + pkey('shin') +
    '<h3 class="grp">' + L('Easy to be with', '一緒にいて楽な人') + '</h3>' + pkey('yu') + pkey('an') +
    '<h3 class="grp">' + L('Help you grow', '成長させてくれる人') + '</h3>' + pkey('sei') +
    '<h3 class="grp">' + L('Old ties', '前世からの縁といわれる人') + '</h3>' + pkey('go') + pkey('tai') +
    '<h3 class="grp">' + L('Handle with care', 'ていねいに付き合いたい人') + '</h3>' + pkey('sui') + pkey('kai') + pkey('ki') +
    '<div class="rooms">' + room(L('What drains you', '消耗するもの'), D.drain) + room(L('What restores you', '回復するもの'), D.recharge) + '</div>');
  /* 5 */
  var t = todayJST(), lu = lunarOf(dayNum(t.y, t.m, t.d)), cur = lu ? lu.m : 0, months = '';
  for (var mi = 1; mi <= 12; mi++){
    var key = relOf(a, FIRST[mi]).key;
    months += '<div class="mo' + (mi === cur ? ' now' : '') + '"><div class="mo-l">' + L('Lunar month ' + mi, '旧暦' + mi + '月') + '<small>' + L('around ' + LMON[mi - 1], 'おおよそ' + (((mi + 0) % 12) + 1) + '月') + (mi === cur ? L(' · now', '・いま') : '') + '</small></div>' +
      '<div class="mo-t">' + tagOf(key) + esc(L(TONE[key][0], TONE[key][1])) + '</div></div>';
  }
  var days = nextDays(30), dh = '', good = [], care = [];
  var GO = ['ei','shin','yu','sei'], CO = ['kai','ki','go','sui'];
  days.forEach(function(x){
    dh += '<span class="dc t-' + TG[x.key] + '"><b>' + x.d + '</b><small>' + DOW[lang === 'ja' ? 1 : 0][x.w] + '</small></span>';
    if (GO.indexOf(x.key) >= 0) good.push(x); if (CO.indexOf(x.key) >= 0) care.push(x);
  });
  good.sort(function(p, q){ return GO.indexOf(p.key) - GO.indexOf(q.key); });
  care.sort(function(p, q){ return CO.indexOf(p.key) - CO.indexOf(q.key); });
  var pickList = function(arr, order, cls, ttl){
    var rows = '';
    order.forEach(function(k){
      var ds = arr.filter(function(x){ return x.key === k; }).slice(0, 4);
      if (ds.length) rows += '<div class="pk"><b>' + esc(L(TONE[k][0], TONE[k][1])) + '</b><span>' + ds.map(dayLabel).join(L(', ', '、')) + '</span></div>';
    });
    return '<div class="pick ' + cls + '"><span class="mini">' + ttl + '</span>' + (rows || '<p style="font-size:14.5px">' + L('None in the next 30 days.', 'この30日間にはありません。') + '</p>') + '</div>';
  };
  h += chapter(5, L('Your year, month by month', '運気の流れ'),
    '<p>' + L('In Shukuyō, each lunar month and each day belongs to one of the 27 mansions. How that mansion relates to yours sets the tone. This is the traditional method, worked out for your mansion.', '宿曜では、旧暦の月も毎日も、27の宿のどれかにあたります。その宿があなたの宿から見て何にあたるかで、その時の流れが決まります。伝統的な読み方を、あなたの宿に合わせて計算しました。') + '</p>' +
    '<h3 class="grp">' + L('The 12 lunar months', '旧暦12か月') + '</h3><div class="mon">' + months + '</div>' +
    '<h3 class="grp">' + L('The next 30 days', 'これからの30日') + '</h3>' +
    '<div class="legend" style="color:var(--ink-2);justify-content:flex-start"><span><i style="background:#2f7d5b"></i>' + L('Favorable', '追い風') + '</span><span><i style="background:#8fa1a8"></i>' + L('Steady', '安定') + '</span><span><i style="background:var(--shu)"></i>' + L('Go gently', '慎重に') + '</span></div>' +
    '<div class="days">' + dh + '</div>' +
    '<div class="picks">' + pickList(good, GO, 'good', L('Best days to move', '動くのによい日')) + pickList(care, CO, 'care', L('Days to go gently', '慎重に過ごしたい日')) + '</div>');
  /* 6 */
  var c1 = m[8], c2 = m[9], pat = PAT[m[10]], patJ = PATJ[m[10]];
  h += chapter(6, L('Small things that bring luck', '運を呼ぶヒント'),
    '<div class="swatches"><span class="sw-i"><i style="background:' + c1[2] + '"></i>' + esc(L(c1[0], c1[1])) + '</span><span class="sw-i"><i style="background:' + c2[2] + '"></i>' + esc(L(c2[0], c2[1])) + '</span></div>' +
    '<p>' + L('Your kimono and obi colors, in Japan\'s traditional color names. Wear them, or carry them in something small. Pattern: ' + pat[0] + ' (' + pat[2] + ').', 'あなたの宿に合わせた、きものと帯の色です。身につけても、小物で持ち歩いても。柄は' + pat[1] + '（' + patJ + '）。') + '</p>' +
    '<div class="try"><span class="mini">' + L('This week', '今週のひとこと') + '</span><p>' + esc(L(D.week[0], D.week[1])) + '</p></div>');
  h += '<section class="closing"><img src="/full/art/moon.webp" alt="" width="330" height="328"><p class="for">' + L('For you', 'あなたへ') + '</p><p class="line">' + esc(L(D.close[0], D.close[1])) + '</p>' +
    '<p class="fine">' + L('A reading for reflection and fun. It describes tendencies drawn from the Shukuyō tradition and promises no outcome. The kimono colors are our own styling idea.', '楽しみと振り返りのための読み物です。宿曜の伝統にもとづく傾向をお伝えするもので、結果を約束するものではありません。きものの色は当サイトの提案です。') + '</p></section>';
  $('reading').innerHTML = h; $('reading').hidden = false;
}
function applyLang(){
  document.documentElement.lang = lang;
  $('langEn').setAttribute('aria-pressed', String(lang === 'en')); $('langJa').setAttribute('aria-pressed', String(lang === 'ja'));
  document.title = L('Moonbond · Your Reading', '宿曜 くわしい鑑定（あなた編）');
  $('tH1').textContent = L('Your personal reading', 'あなた編のくわしい鑑定');
  $('tSub').textContent = L('Six chapters, written for your mansion.', '全6章。あなたの宿に合わせた鑑定です。');
  $('tYou').textContent = L('Your birthday', 'あなたの誕生日');
  $('tGo').textContent = L('Show the reading', '鑑定を表示する');
  var set = function(c, t){ var e = document.querySelectorAll('.' + c); for (var i = 0; i < e.length; i++) e[i].textContent = t; };
  set('lm', L('Month', '月')); set('ld', L('Day', '日')); set('ly', L('Year', '年'));
  var os = $('bMonth').options; for (var i = 0; i < os.length; i++) os[i].textContent = L(MONTH_NAMES[i], (i + 1) + '月');
  render();
}
function init(){
  try { var s = localStorage.getItem('tsukiyado-lang'); if (s === 'ja' || s === 'en') lang = s; } catch (e) {}
  fillDate('b', 1995, 11, 14);
  $('langEn').addEventListener('click', function(){ lang = 'en'; try { localStorage.setItem('tsukiyado-lang', 'en'); } catch (e) {} applyLang(); });
  $('langJa').addEventListener('click', function(){ lang = 'ja'; try { localStorage.setItem('tsukiyado-lang', 'ja'); } catch (e) {} applyLang(); });
  $('birthForm').addEventListener('submit', function(e){
    e.preventDefault();
    var A = readDate('b');
    if (A.err){ $('err').textContent = A.err; return; }
    $('err').textContent = ''; mine = A; render();
    $('reading').scrollIntoView({behavior: (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'auto' : 'smooth', block:'start'});
  });
  applyLang();
  /* 購入後のリンク: ?a=YYYY-MM-DD&lang=en|ja&k=… */
  try {
    var q = new URLSearchParams('a=1995-11-14' + (location.search ? '&' + location.search.slice(1) : '')), pa = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(q.get('a') || '');
    if (q.get('lang') === 'ja' || q.get('lang') === 'en') { lang = q.get('lang'); applyLang(); }
    if (pa) {
      $('bYear').value = +pa[1]; $('bMonth').value = +pa[2]; $('bDay').value = +pa[3];
      var A = readDate('b');
      if (!A.err) { mine = A; render(); } else $('err').textContent = A.err;
      $('birthForm').style.display = 'none';
    }
  } catch (e) {}
}
init();
</script>
</body>
