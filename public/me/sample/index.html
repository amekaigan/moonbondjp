<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Moonbond · Your Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 自分用の鑑定（tools/build_me.py で作る。直接は書き換えない） */
/* The paid reading: two birthdays in, eight chapters out. Indigo night and washi paper, same family as the free page. */
:root{
  --night:#12264f; --night-2:#1b3668; --night-3:#2b4c87; --paper:#f6f0e1; --paper-2:#e9e0ca; --ink:#1d1b27; --ink-2:#55506a;
  --shu:#d4472a; --kin:#d6b05a; --mist:#bcc8e2; --hair:rgba(255,255,255,.18);
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.6}
p,ul,ol,h1,h2,h3,fieldset,legend{margin:0;padding:0}
ul,ol{list-style:none}
fieldset{border:0;min-width:0}
.wrap{width:100%;max-width:680px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--display);line-height:1.25;font-weight:800;text-wrap:balance}
:focus-visible{outline:3px solid var(--kin);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:8px}
.brand-moon{width:18px;height:18px;border-radius:50%;box-shadow:inset -6px 0 0 0 var(--kin)}
.brand-name{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.04em}
.brand-jp{font-family:var(--display);color:var(--kin);font-size:14px}
.lang{display:flex;gap:2px;border:1px solid var(--hair);border-radius:999px;padding:3px}
.lang button{appearance:none;border:0;background:transparent;color:var(--mist);font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}

.intro{display:flex;flex-direction:column;gap:14px;padding-top:10px;padding-bottom:26px}
.intro-head{display:grid;grid-template-columns:1fr 84px;gap:14px;align-items:center}
.intro-head img{width:84px;height:84px;display:block}
.intro h1{font-size:clamp(26px,7.4vw,38px)}
.intro-sub{color:var(--mist);font-size:15px}
form{display:flex;flex-direction:column;gap:14px}
legend{font-weight:700;font-size:15px;margin-bottom:6px}
.date-row{display:grid;grid-template-columns:1.5fr .9fr 1.1fr;gap:8px}
.date-row label{display:flex;flex-direction:column;gap:4px;min-width:0}
.date-row label span{font-size:12px;color:var(--mist)}
select{width:100%;min-width:0;background:var(--night-2);color:var(--paper);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:12px 10px;font-size:16px;font-family:inherit}
.btn{appearance:none;background:var(--shu);color:#fff6ea;border:1px solid var(--shu);border-radius:10px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;text-align:center;font-family:inherit}
.err{color:#ffc9b8;font-size:14px;min-height:1px}

#reading{display:flex;flex-direction:column;gap:16px;padding-bottom:40px}
#reading[hidden]{display:none}
.cover{background:var(--night-2);border:1px solid var(--hair);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.cover-cats{display:flex;gap:10px;align-items:flex-end;justify-content:flex-end;position:absolute;right:16px;top:16px}
.cover-cats img{height:64px;width:auto;display:block}
.cover-for{font-size:13px;color:var(--mist);padding-right:120px}
.cover-names{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.3;padding-right:120px}
.cover-bond{color:var(--kin);font-family:var(--display);font-weight:700;font-size:16px}
.cover-title{font-family:var(--display);font-weight:800;font-size:25px;line-height:1.38;white-space:pre-line}
.cover-sub{font-size:16px;line-height:1.65}
#wheel{width:100%;max-width:320px;height:auto;display:block;margin:4px auto 0}
#wheel text{font-family:var(--display);fill:var(--mist);font-size:12px}
#wheel .a text{fill:var(--ink)}
#wheel .b text{fill:#fff6ea}
#wheel .mid1{fill:var(--paper);font-size:34px;font-weight:800}
#wheel .mid2{fill:var(--kin);font-size:13px;font-family:var(--body);font-weight:700}
.legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--mist)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

.ch{background:var(--paper);color:var(--ink);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.ch-head{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.ch-num{width:44px;height:44px;border-radius:50%;background:var(--night);color:var(--kin);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.ch-label{font-size:12.5px;font-weight:700;color:var(--shu)}
.ch h2{font-size:21px;line-height:1.35}
.ch p{font-size:16px;line-height:1.85}
html[lang="ja"] .ch p{line-height:1.95}
html[lang="ja"] h1,html[lang="ja"] h2,html[lang="ja"] .closing .line{text-wrap:wrap}
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.side{background:var(--paper-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.mini{font-size:12.5px;font-weight:700;color:var(--shu)}
.side-name{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.3}
.side p{font-size:15px;line-height:1.7}
.meter{display:grid;gap:10px}
.meter-row{display:grid;grid-template-columns:7.2em 1fr 3.2em;align-items:center;gap:12px;font-size:14.5px;font-weight:700}
.pbar{display:block;height:12px;border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:6px}
.pct{font-family:var(--display);font-weight:800;font-size:18px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.pct small{font-size:12px;font-weight:700;margin-left:1px}
@media (prefers-reduced-motion:no-preference){.pbar i{animation:pgrow 1s cubic-bezier(.2,.7,.2,1) both}@keyframes pgrow{from{width:0}}}
.pbar{background:rgba(29,27,39,.12)}
.pbar i{background:var(--shu)}
.pct{color:var(--ink)}
.room-bar{display:grid;grid-template-columns:1fr 3.2em;align-items:center;gap:12px}
.who-card{background:var(--paper-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.who-art{display:block;width:calc(100% + 28px);height:auto;aspect-ratio:5/4;object-fit:cover;margin:-14px -14px 2px}
.ch h3{font-family:var(--display);font-size:18px;margin-top:6px}
.pros{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pro{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pro.good{background:#e5f1ea}.pro.care{background:#f8e6df}
.pro-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.pro-ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff6ea}
.pro.good .pro-ic{background:#2f7d5b}.pro.care .pro-ic{background:var(--shu)}
.pro ul{margin:0;padding-left:20px;list-style:disc;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.6}
.tcmp{display:grid;gap:10px}
.tc-row{display:grid;grid-template-columns:5.5em 1fr;gap:10px;align-items:center}
.tc-name{font-weight:700;font-size:14px}
.tc-row.gap .tc-name{color:var(--shu)}
.tc-bars{display:flex;flex-direction:column;gap:4px}
.tc-bar{display:block;height:11px;border-radius:6px;background:rgba(29,27,39,.12);overflow:hidden}
.tc-bar i{display:block;height:100%;border-radius:6px}
.own{display:inline-block;font-size:11.5px;font-weight:800;background:var(--kin);color:var(--ink);border-radius:999px;padding:1px 8px;margin-right:6px}
.who-top{display:flex;align-items:center;gap:12px}
.who-disc{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:25px;background:var(--kin);color:var(--ink)}
.who-disc.b{background:var(--shu);color:#fff6ea}
.who-tag{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.who-name{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.25}
.who-arch{font-size:14px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--paper);color:var(--ink)}
.who-card p{font-size:15px;line-height:1.75}
.dots li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:16px;line-height:1.7}
.dots{display:flex;flex-direction:column;gap:8px}
.dots svg{width:20px;height:20px;margin-top:4px}
.try{background:var(--night);color:var(--paper);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.try .mini{color:var(--kin)}
.try p{font-size:16px;line-height:1.65;font-weight:700}
.gift{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;background:#fbf3d9;border-radius:12px;padding:14px 16px}
.gift svg{width:24px;height:24px;margin-top:2px}
.gift .mini{color:#8a6410}
.gift p{font-family:var(--display);font-weight:700;font-size:16.5px;line-height:1.75}
.rooms{display:flex;flex-direction:column;gap:10px}
.room{background:var(--paper-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.room-name{font-family:var(--display);font-weight:800;font-size:17px}
.room p{font-size:15px;line-height:1.7}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--paper-2);border-radius:12px;padding:14px}
.step-n{width:34px;height:34px;border-radius:50%;background:var(--shu);color:#fff6ea;display:grid;place-items:center;font-weight:700}
.step strong{display:block;font-family:var(--display);font-size:17.5px;line-height:1.4}
.step p{font-size:15px;line-height:1.75;margin-top:4px}
.step-lead{display:block;font-size:14px;color:var(--ink-2);margin-bottom:2px}
.closing{background:var(--night-2);border:1px solid var(--hair);border-radius:18px;padding:24px 20px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.closing img{width:64px;height:64px}
.closing .for{font-size:13px;font-weight:700;color:var(--kin)}
.closing .line{font-family:var(--display);font-weight:500;font-size:17.5px;line-height:1.9;text-align:left}
.closing .fine{font-size:12.5px;color:var(--mist);max-width:36em}
@media print{
  body{background:#fff;color:#000}
  .top,.intro{display:none}
  .ch,.cover,.closing{break-inside:avoid;border:1px solid #ccc}
}

.cover-art{display:block;width:calc(100% + 40px);margin:-22px -20px 4px;height:auto;aspect-ratio:5/4;object-fit:cover;border-radius:18px 18px 0 0}
.cover-for,.cover-names{padding-right:0}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw-i{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.sw-i i{width:26px;height:26px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(29,27,39,.2)}
.pkey{background:var(--paper-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.pkey-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pkey-h b{font-family:var(--display);font-size:17px}
.pkey-h span{font-size:13px;color:var(--ink-2)}
.pkey p{font-size:15px;line-height:1.7}
.mrow{display:flex;flex-wrap:wrap;gap:8px}
.mp{display:flex;flex-direction:column;align-items:center;gap:3px;width:68px;text-align:center}
.mp img{width:68px;height:54px;object-fit:cover;object-position:left top;border-radius:10px;display:block}
.mp b{width:68px;height:54px;border-radius:10px;background:var(--paper);display:grid;place-items:center;font-family:var(--display);font-size:26px}
.mp small{font-size:11.5px;font-weight:700;line-height:1.2}
.grp{font-family:var(--display);font-size:17px;margin-top:6px}
.mon{display:flex;flex-direction:column;gap:6px}
.mo{display:grid;grid-template-columns:6.6em 1fr;gap:10px;align-items:start;border-radius:10px;padding:10px 12px;background:var(--paper-2)}
.mo.now{background:#fbf3d9;box-shadow:0 0 0 2px var(--kin)}
.mo-l{font-size:13px;font-weight:700;line-height:1.35}
.mo-l small{display:block;color:var(--ink-2);font-weight:500}
.mo-t{font-size:14.5px;line-height:1.6;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.pk{display:flex;flex-direction:column;gap:2px;font-size:15px;line-height:1.55}
.pk b{font-family:var(--display);font-size:15px}
.pk span{font-size:14px;color:var(--ink-2)}
.pick .pk+.pk{margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:999px;padding:1px 9px;margin-right:6px;color:#fff6ea}
.t-good{background:#2f7d5b}.t-calm{background:#6C848D}.t-care{background:var(--shu)}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.dc{border-radius:10px;padding:6px 0;text-align:center;color:#fff6ea;display:flex;flex-direction:column;line-height:1.15}
.dc b{font-family:var(--display);font-size:17px}
.dc small{font-size:10.5px;opacity:.9}
.dc.t-calm{background:#8fa1a8}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.pick{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pick.good{background:#e5f1ea}.pick.care{background:#f8e6df}
.pick ul{display:flex;flex-direction:column;gap:6px;font-size:15px}
.pick li{display:flex;gap:8px;align-items:baseline}
.pick li b{font-family:var(--display);min-width:5.6em}
.soon{background:var(--night-2);border:1px solid var(--hair);border-radius:18px;padding:22px 20px;text-align:center;color:var(--mist)}

</style>

<style>.sample-bar{margin:12px 0;padding:14px 16px;border-radius:14px;background:#fbf3d9;color:#1d1b27;display:flex;flex-direction:column;gap:10px;font-size:14.5px;line-height:1.6}.sample-bar a{align-self:flex-start;background:#d6b05a;color:#1d1b27;font-weight:800;text-decoration:none;border-radius:999px;padding:9px 18px}html[lang=ja] .sb-en{display:none}html:not([lang=ja]) .sb-ja{display:none}</style></head>
<body>
<header class="wrap top">
  <div class="brand"><span class="brand-moon" aria-hidden="true"></span><span class="brand-name">Moonbond</span><span class="brand-jp" lang="ja">月の縁</span></div>
  <div class="lang" role="group" aria-label="Language"><button type="button" id="langEn" aria-pressed="true">EN</button><button type="button" id="langJa" aria-pressed="false" lang="ja">日本語</button></div>
</header>
<main class="wrap"><div class="sample-bar"><p><span class="sb-en">This is a sample reading, made for the example birthdays shown. Yours is written for your own mansion.</span><span class="sb-ja">これは見本の鑑定書です。例の誕生日で作っています。購入すると、あなたの宿に合わせた鑑定書になります。</span></p><a href="/#editions"><span class="sb-en">Get my reading</span><span class="sb-ja">自分の鑑定を読む</span></a></div>
  <section class="intro">
    <div class="intro-head">
      <div><h1 id="tH1"></h1><p class="intro-sub" id="tSub"></p></div>
      <img src="/full/art/moon.webp" alt="" width="330" height="328">
    </div>
    <form id="birthForm" novalidate>
      <fieldset><legend id="tYou"></legend>
        <div class="date-row">
          <label for="bMonth"><span class="lm"></span><select id="bMonth"></select></label>
          <label for="bDay"><span class="ld"></span><select id="bDay"></select></label>
          <label for="bYear"><span class="ly"></span><select id="bYear"></select></label>
        </div>
      </fieldset>
      <button class="btn" type="submit" id="tGo"></button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </section>
  <div id="reading" hidden></div>

<script>
var lang = 'en';
var ME = {"star":{"core":[["You are the kind of person who decides where you are going long before anyone notices you have started. While others talk about their dreams, you are already doing the unglamorous part of it: the early mornings, the practice, the quiet hours nobody sees. You do not need an audience, and you do not trust success that arrives too easily.","あなたは、周りが気づくずっと前に、行き先を決めて歩き出している人です。ほかの人が夢を語っている間に、早起きや練習のような地味な部分をもう始めています。見ている人がいなくても平気で、あっさり手に入った成功のほうが、むしろ信用できません。"],["Your path tends to be slower at the start and stronger at the end. Praise may come late, and that can sting, but what you build with your own hands does not collapse when the wind changes. Behind the calm face is real pride, and a part of you keeps score of every promise you have made to yourself.","歩き出しはゆっくりでも、後半に強くなる道のりです。ほめ言葉が遅れて届くと寂しい日もあるでしょう。それでも、自分の手で積み上げたものは、風向きが変わっても崩れません。静かな顔の奥には確かな誇りがあり、自分との約束を一つずつ数えている面もあります。"]],"strengths":[["Staying power","続ける力","You keep going after the excitement has worn off. That alone puts you ahead of most people.","気持ちが盛り上がっていない日も続けられます。それだけで、多くの人より一歩先に出られます。"],["Self-direction","自分で決める力","You do not wait to be told. Once you pick a goal, you can plan the road and walk it alone.","指示を待たず、目標を決めたら道筋まで自分で組み立てて進めます。"],["Trustworthiness","信頼される力","People learn that what you say you will do, you do. Over the years this becomes your biggest asset.","「やる」と言ったことは、やる。そう知られていくことが、年月とともに一番の財産になります。"]],"blind":[["Hard to lean on others","人に頼るのが苦手","You would rather struggle alone than ask. People around you often do not know you need help until you are worn out.","頼むくらいなら一人で抱えたい人です。周りは、あなたが疲れ切るまで助けが必要だと気づけません。"],["Racing the clock","人と比べて焦る","When someone your age moves faster, you quietly feel behind. Your path simply runs on a different clock.","同じ年ごろの人が先に進むと、静かに焦りが出ます。でも、あなたの道は時計の進み方がもともと違います。"],["Showing only the finished face","完成した顔しか見せない","Pride makes you show a polished self. Closeness needs the unfinished one too.","誇りが高いぶん、整った顔ばかり見せます。親しくなるには、未完成の顔も必要です。"]],"love":{"attract":["You are drawn to people who work at something and do not make a show of it. Seriousness, a clear goal and quiet kindness move you far more than charm does.","何かに黙々と取り組んでいる人に惹かれます。派手な魅力よりも、まじめさ、はっきりした目標、さりげない優しさに心が動きます。"],"pattern":["You open up slowly, and when you do it is all the way. The trap is that you show the strong version of yourself for months, so your partner falls for someone who never has a bad day. Then you cannot tell them about the bad day.","心を開くまでは時間がかかりますが、開いたら深く開きます。落とし穴は、何か月も「強い自分」だけを見せてしまうこと。相手は弱音を吐かない人に恋をして、あなたも調子の悪い日を打ち明けにくくなります。"],"try":["Tell your partner one unfinished thing this month: a worry, or a goal you are not sure of. It will not lower their respect for you. It lets them reach you.","今月、未完成なことを一つ、相手に話してみてください。迷っている目標でも、小さな不安でも構いません。尊敬は下がらず、相手があなたに届くようになります。"]},"work":{"fit":[["Craft and expertise: engineering, research, design, the trades. Anywhere mastery counts.","腕前が育つ仕事：技術職、研究、デザイン、職人系。実力がものを言う世界。"],["Work with your own territory: freelancing, running a shop, a role with real discretion.","自分の持ち場がある働き方：独立、自営、裁量の大きい役割。"],["Long-horizon roles: finance, planning, project management, where patience pays.","時間をかけて成果が出る仕事：経理・財務、企画、プロジェクト管理。"]],"style":["You do your best work when the goal is clear and nobody hovers. Being micromanaged drains you faster than hard work does.","目標がはっきりしていて、横から口を出されない環境で、いちばん力が出ます。細かく管理されると、仕事の量よりも早く消耗します。"],"money":["Money comes from effort and arrives in steps, not in jackpots. You are a natural saver and do best with a plan and a number to aim at. Be careful of the all-or-nothing project you fund alone.","お金は努力に応じて、階段のように増えていきます。一発逆転型ではありません。貯めるのが得意で、目標の金額があると伸びます。気をつけたいのは、一人で全額を出す「一か八か」の挑戦です。"],"caution":["Do not turn down good offers just because you feel you have not earned them yet.","「まだ自分にはふさわしくない」と、良い話を断りすぎないでください。"]},"drain":["Being rushed, being compared with others, and meetings that have no purpose.","急かされること、人と比べられること、目的のない付き合い。"],"recharge":["An hour of focused work on your own project, a long walk, a quiet evening with one person you trust.","自分の課題に集中する一時間、長めの散歩、信頼できる一人との静かな夜。"],"week":["This week, pick one thing you have been building alone and show it to one person you trust.","今週、一人で積み上げてきたことを一つ選んで、信頼できる人に見せてみてください。"],"close":["Your light is the kind that gets brighter the longer you carry it. There is no need to hurry it. Just let the right people see it.","あなたの光は、長く灯し続けるほど明るくなる種類のものです。急ぐ必要はありません。ふさわしい人に見える場所へ、そっと出してあげてください。"]},"pleiades":{"core":[["You carry yourself with a natural dignity that people notice before you say a word. Learning is not a chore for you but a pleasure, and you keep a quiet glow of curiosity going all your life. Teachers, elders and people you admire tend to take you under their wing without being asked.","あなたは、何も言わないうちから「品がある」と気づかれる人です。学ぶことは苦労ではなく楽しみで、静かな好奇心を一生灯し続けます。先生や年長者、尊敬する人から、頼まなくても目をかけてもらえる巡り合わせがあります。"],["The other side of that gift is a high standard. You notice when something is rough, careless or beneath what you hoped for, and you rarely say so aloud. Your luck grows when you keep good company and keep studying, and it dims when you shut yourself away to protect your ideals.","その裏返しで、基準は高めです。雑なもの、投げやりなもの、期待より低いものにすぐ気づきますが、口には出しません。良い人たちのそばで学び続けるほど運は育ち、理想を守ろうと閉じこもるほど、光は弱まります。"]],"strengths":[["A learner's mind","学ぶ力","You pick things up deeply, not just quickly, and your knowledge keeps compounding.","早いだけでなく深く身につけ、知識が年月とともに積み上がっていきます。"],["Natural grace","自然な品格","You make people feel at ease and a little more refined for having met you.","一緒にいる人を落ち着かせ、少し背筋を伸ばさせる雰囲気があります。"],["Being backed","引き立てられる運","Mentors and seniors want to help you, and your path opens through them.","師や先輩が力を貸したくなる人で、道がその人たちを通じて開けていきます。"]],"blind":[["Standards that sting","基準の高さが相手を刺す","Your quiet disappointment can be felt even when you say nothing kind or unkind.","何も言わなくても、あなたの静かな落胆は相手に伝わってしまいます。"],["Waiting to be invited","声がかかるのを待つ","You expect good things to be offered, and sometimes miss them by not asking.","良い話は向こうから来るものと思い、自分から頼まず機会を逃すことがあります。"],["Staying in the study","書斎にこもる","You can prepare forever and call it caution. Some things must be tried half-ready.","準備を重ねて「慎重」と呼び続けがち。半分の準備で踏み出すべきこともあります。"]],"love":{"attract":["You fall for minds first. A person who thinks clearly, asks good questions and speaks about their dreams without showing off draws you in. Manners and taste count for more than flash.","まず頭の良さに惹かれます。筋道立てて考え、よい問いを投げ、自慢せずに夢を語る人に心が動きます。派手さより、マナーとセンスが決め手です。"],"pattern":["You hold a picture of the ideal partner and quietly measure people against it. Real people lose. The relationship that lasts is usually with someone who does not match the picture but respects your ideals anyway.","理想の相手の像を持っていて、気づかないうちに相手と比べています。現実の人は負けがちです。長続きするのは、像とは違っても、あなたの理想を尊重してくれる人です。"],"try":["Tell someone you like what they did, plainly, without grading it. Warmth said out loud builds more closeness than approval kept in your head.","誰かに「それ、いいね」と、評価抜きで伝えてみてください。頭の中の合格点より、声に出した温かさのほうが距離を縮めます。"]},"work":{"fit":[["Research, teaching, writing, editing, museums and libraries. Anywhere knowledge is the product.","知識そのものが価値になる仕事：研究、教育、執筆・編集、美術館や図書館など。"],["Advisory and consulting roles where your judgement and manner matter.","判断力と人柄が求められる、アドバイザーやコンサルタント系。"],["Refined fields: culture, fashion, hospitality, traditional crafts.","品の良さが活きる分野：文化、ファッション、おもてなし、伝統工芸。"]],"style":["You work best with a mentor or a respected team, a clear field of study, and time to do things properly. Being pushed to cut corners wears you down.","尊敬できる上司や仲間、はっきりした専門分野、きちんとやる時間があると力が出ます。手を抜くよう急かされると、消耗します。"],"money":["Money tends to come through reputation. When people trust your name and your judgement, offers follow. Spend on quality and learning, which pays you back, and watch small luxuries that only look the part.","お金は信用を通じて入ってきます。名前と判断が信頼されるほど、話が舞い込みます。品質と学びへの出費は戻ってきますが、「それらしく見せるだけ」の贅沢には注意してください。"],"caution":["Do not wait for the perfect offer. Ask for the introduction yourself.","完璧な話を待たないでください。紹介してほしいと、自分から頼むことです。"]},"drain":["Crude company, careless work, and being made to rush something you wanted to do well.","品のない場、雑な仕事、きちんとやりたいことを急かされること。"],"recharge":["A good book, a quiet museum, tea with a person you admire.","良い本、静かな美術館、尊敬できる人とのお茶の時間。"],"week":["This week, ask one person you respect for advice on something you have been turning over alone.","今週、一人で考え込んでいることについて、尊敬する人に一つ相談してみてください。"],"close":["Your glow is real, and it is meant to be seen by others, not kept behind glass. Let the right people closer, and let them be imperfect.","あなたの輝きは本物で、ガラスの向こうに仕舞っておくものではありません。ふさわしい人を近くに招いて、その人の不完全さも受け入れてみてください。"]},"net":{"core":[["You build your life the way a mountain path is cut: one firm step, then the next. You do not need to be the fastest. Others tire, change course or give up, and you are still walking, which is why your best years arrive later than most and last longer.","あなたは山道を切り開くように、一歩ずつ確かに人生を築きます。速さは必要ありません。ほかの人が疲れ、進路を変え、やめていく中で、あなたはまだ歩いています。だから最盛期は遅めに来て、長く続きます。"],["You are loyal to people, to places and to a way of doing things. Once you have decided something is yours, you do not drop it. That steadiness is a gift, but it can turn into stubbornness when circumstances really have changed and you are the last to notice.","人にも、場所にも、やり方にも誠実です。「これは自分のもの」と決めたら手放しません。その安定感は贈り物ですが、状況が本当に変わっても、あなただけが気づかず固まってしまうことがあります。"]],"strengths":[["Endurance","粘り強さ","You can keep going through long, dull stretches that make others quit.","長くて退屈な時期にも、ほかの人がやめてしまう場面でも、続けられます。"],["Loyalty","誠実さ","People who have your word know they have it. That makes you the center of lasting circles.","あなたの約束は動かないと知られていて、長く続く人の輪の中心になれます。"],["Grounded judgement","地に足のついた判断","You prefer proof to hype and are rarely carried off by a trend.","流行の熱より確かな根拠を選ぶので、ブームに流されにくい人です。"]],"blind":[["Holding on too long","手放すのが遅い","A job, a habit or a hurt can stay long after it stopped serving you.","仕事も習慣も、傷つけられたことも、役目を終えたあとまで抱えがちです。"],["Slow to change course","方向転換が遅い","You need strong evidence to switch, and sometimes the evidence arrives after the chance.","切り替えるには確かな根拠が要り、その根拠が揃う頃には好機が過ぎていることもあります。"],["Saying little","言葉が少ない","You show care through action and assume it is understood. It often is not.","行動で示せば伝わると思っていますが、実際には言葉がなくて伝わっていないことが多いのです。"]],"love":{"attract":["You are drawn to people who are dependable and honest about who they are. A calm voice, a steady routine and a person who keeps small promises mean more to you than fireworks.","頼れて、自分に正直な人に惹かれます。落ち着いた声、安定した暮らしぶり、小さな約束を守る人のほうが、花火のような魅力より心に残ります。"],"pattern":["You are slow to start and nearly impossible to shake once you do. The risk is staying in a relationship out of loyalty after it has stopped feeding you, or never saying what you need because you are used to coping.","始めるのは遅いのに、始めたらなかなか揺らぎません。リスクは、誠実さから、もう満たされなくなった関係に留まり続けることや、我慢に慣れて必要なことを言わなくなることです。"],"try":["Say one sentence of appreciation out loud this week to the person closest to you. Your actions are loud, but words still land differently.","今週、いちばん近い人に感謝を一言、声に出して伝えてください。行動は十分に伝わっていても、言葉には言葉の届き方があります。"]},"work":{"fit":[["Steady, skilled work: manufacturing, agriculture, construction, logistics, accounting.","着実さが活きる仕事：ものづくり、農業、建設、物流、経理。"],["Roles where trust builds over years: banking, property, public service, long client relationships.","信頼が年月で積み上がる仕事：金融、不動産、公共分野、長いお客様付き合い。"],["Craft and maintenance, where staying power beats speed.","速さより持久力がものを言う職人仕事や、保守・管理の仕事。"]],"style":["You do your best work in a stable setting with clear duties and a team you can rely on. Constant restructuring and shifting targets drain you.","役割がはっきりしていて、頼れる仲間のいる安定した環境で力が出ます。組織や目標がころころ変わると消耗します。"],"money":["You build wealth slowly and keep it. Savings, steady investments and owning something solid suit you better than fast bets. Your income tends to rise in the second half of life.","お金はゆっくり築いて、しっかり残すタイプです。貯蓄、堅実な投資、手堅い資産が、短期の勝負より向いています。収入は人生の後半に伸びやすい傾向があります。"],"caution":["Do not mistake slow for failing. Compare yourself to your own last year, not to someone who started with a head start.","ゆっくりを失敗と取り違えないでください。比べる相手は、先に走り出した人ではなく、自分の去年です。"]},"drain":["Sudden changes, being hurried, and people who treat promises as optional.","急な変更、急かされること、約束を軽く扱う人。"],"recharge":["Time outdoors, a long walk or garden, a familiar routine with food you love.","屋外で過ごす時間、長い散歩や庭いじり、好きな食事のいつもの習慣。"],"week":["This week, review one thing you have been keeping out of loyalty, and decide honestly whether it still deserves your effort.","今週、「誠実さ」から続けていることを一つ見直して、まだ力を注ぐ価値があるか、正直に考えてみてください。"],"close":["Your path was never meant to be fast. Keep walking, and keep saying out loud the things your steps have been saying for years.","あなたの道は、もともと速く進むためのものではありません。歩き続けながら、これまで足取りで伝えてきたことを、時々は声にして伝えてください。"]},"beak":{"core":[["Words are your craft. You think before you speak, and when you speak people listen, because what you say has been weighed. You read, collect facts and turn them over, and you would rather be accurate than quick. Knowledge and conversation are how you earn trust.","あなたにとって言葉は技術です。話す前によく考え、話せば人が耳を傾けます。言うことが吟味されているからです。本を読み、事実を集めて考え抜き、速さより正確さを選びます。知識と会話で信頼を得る人です。"],["What you rarely give away is how you actually feel. You can talk for an hour and reveal very little. That discretion makes you a safe keeper of secrets, and it can also leave the people who love you wondering what is behind the careful sentences.","めったに明かさないのは、本当の気持ちです。一時間話しても、ほとんど何も見せないことができます。その慎重さは秘密を預けるのに安心な人柄ですが、あなたを大切に思う人には、丁寧な言葉の奥が見えず不安になることもあります。"]],"strengths":[["Persuasive clarity","伝える力","You can explain a hard thing simply, and people follow your reasoning.","難しいことを簡単に説明でき、筋道を人がきちんと追ってくれます。"],["Study habit","勉強する習慣","You keep learning long after school, and it shows in how you handle problems.","学校を出てからも学び続けていて、問題への向き合い方に表れます。"],["Discretion","口の堅さ","People trust you with sensitive things because you do not gossip.","噂話をしないので、デリケートなことを安心して預けてもらえます。"]],"blind":[["Hiding behind words","言葉の陰に隠れる","Careful phrasing can keep real feelings out of reach, even from you.","丁寧な言い回しが、本心を遠ざけます。自分自身にさえ。"],["Overthinking","考えすぎる","You rehearse conversations and replay them afterward, using up energy.","会話を前もって練習し、あとで何度も反芻して、力を使い果たしがちです。"],["Sharp edges","言葉が鋭くなる","When tired or cornered, your precision can turn into a cutting remark.","疲れた時や追い込まれた時、正確さが、人を切る一言になることがあります。"]],"love":{"attract":["You are drawn to people you can talk to. A good conversation is how you fall: wit, curiosity, the sense that someone finishes your thought or surprises it.","話の合う人に惹かれます。恋の入口は会話です。機知、好奇心、考えを先回りされる感じ、あるいは良い意味で裏切られる感じ。"],"pattern":["You court with conversation, then go quiet when it matters. The partner is left guessing because you offer ideas more easily than feelings. Misunderstandings often come from what you left unsaid.","会話で距離を縮めるのに、大事な場面で黙ります。相手は、あなたが考えは話せても気持ちは話さないので、推測するしかありません。すれ違いの原因は、言わなかったことにあることが多いのです。"],"try":["Once this month, finish a sentence with a feeling instead of a thought. Start with \"I feel\" and stop before you explain it.","今月一度、考えではなく気持ちで文を終えてみてください。「私は〇〇と感じる」と言って、説明を足す前に止めます。"]},"work":{"fit":[["Words and ideas: writing, editing, translation, law, teaching, public relations.","言葉と考えの仕事：執筆・編集、翻訳、法律、教育、広報。"],["Analysis and research: consulting, journalism, data, policy.","分析や調査の仕事：コンサルティング、報道、データ、政策。"],["Roles where discretion matters: advising, secretarial, HR, compliance.","口の堅さが要る仕事：相談役、秘書、人事、コンプライアンス。"]],"style":["You do your best work with time to read, think and draft before you have to speak. Being asked to improvise in front of people too often tires you.","話す前に読み、考え、下書きする時間があると力が出ます。人前で即興を求められ続けると疲れます。"],"money":["Money follows your knowledge. Skills, certifications and a trusted name raise your income steadily. Look at contracts and details carefully, since you are good at it, and do not undersell your time because you enjoy the work.","お金は知識についてきます。技能、資格、信頼される名前が収入を着実に押し上げます。契約や細部をよく読むのは得意なので、その力を使って、楽しいからといって自分の時間を安売りしないでください。"],"caution":["Do not let a good argument replace a decision. At some point, choose.","筋の通った議論を、決断の代わりにしないでください。どこかで選ぶことです。"]},"drain":["Small talk with no point, being put on the spot, and noise when you need to think.","中身のない雑談、急に振られること、考えたい時の騒がしさ。"],"recharge":["Reading, writing for yourself, a quiet cafe, a conversation with one clever friend.","読書、自分のための文章、静かなカフェ、頭の良い友人と一対一で話すこと。"],"week":["This week, write down one thing you feel but have not said, and decide whether to say it to the person it concerns.","今週、感じているのに言っていないことを一つ書き出して、その人に伝えるかどうか決めてください。"],"close":["Your words are a real gift. The next step is to let one or two people hear the quieter ones, the ones that are not an argument.","あなたの言葉は本物の才能です。次の一歩は、議論ではない、もっと静かな言葉を、一人か二人に聞かせてあげることです。"]},"three-stars":{"core":[["You are drawn to whatever is new, and you say exactly what you think about it. Rules that exist only because they always have bother you. You wake a room up, you start things others only talk about, and you open doors nobody noticed were there.","新しいものに惹かれ、思ったことをそのまま口にします。「昔からそうだから」だけの決まりには、引っかかります。場を目覚めさせ、人が口先で終わらせることを実際に始め、誰も気づかなかった扉を開けます。"],["Your energy is real but it burns fast. Starting is easy and finishing is where you meet yourself. You do best when someone or something keeps pace with you, because the same bluntness that makes you refreshing can make you hard to live beside on a bad day.","エネルギーは本物ですが、燃え方は速めです。始めるのは簡単で、やり遂げる場面で自分と向き合うことになります。歯に衣着せない率直さは爽快な反面、調子の悪い日には一緒に暮らしにくくもなります。ペースを合わせてくれる人や物事があると、最も力を出せます。"]],"strengths":[["Starting power","始める力","You turn ideas into first steps faster than almost anyone.","思いつきを最初の一歩にするスピードは、誰にも負けません。"],["Plain honesty","率直さ","You say what others avoid, and often that is what a group needed.","みんなが避けることを口にして、それが場に必要だったという場面が多くあります。"],["Originality","独創性","You see a new angle where others copy the old one.","ほかの人が前例をなぞるところで、新しい角度を見つけます。"]],"blind":[["Dropping things half done","途中で投げ出す","A new thing arrives, and the old one is left. People notice.","新しいものが来ると古いものが置き去りに。周りはそれを見ています。"],["Speaking before listening","聞く前に言う","Your first reaction is fast and loud, and it can hurt before you realize.","最初の反応が速くて強く、気づく前に相手を傷つけることがあります。"],["Restlessness","落ち着かなさ","Quiet stretches feel like failure, so you stir things up just to feel movement.","静かな時期を停滞のように感じて、動きを感じたくて自分から波風を立てることがあります。"]],"love":{"attract":["You are drawn to people who are alive, curious and a little unpredictable. Someone who argues with you, makes you laugh and does not need you to be careful is hard to resist.","生き生きしていて、好奇心があり、少し予測できない人に惹かれます。議論を挑み、笑わせてくれて、あなたに慎重さを求めない人は、抗いがたい存在です。"],"pattern":["You need freedom, and you need a partner who can handle a lively debate without taking it personally. The pattern to watch is the thrill of the start giving way to boredom, then picking a fight to feel something.","自由が必要で、議論を個人攻撃と受け取らない相手が必要です。気をつけたいのは、始まりの高揚が退屈に変わり、何かを感じるためにけんかを選んでしまう流れです。"],"try":["When you disagree with your partner this month, ask one question before you give your opinion. Then listen for the whole answer.","今月、パートナーと意見が分かれたら、意見を言う前に質問を一つしてください。そして、答えを最後まで聞きます。"]},"work":{"fit":[["Starting new things: entrepreneurship, new business lines, product launches, startups.","新しく始める仕事：起業、新規事業、商品の立ち上げ、スタートアップ。"],["Fields that reward originality: design, media, technology, creative direction.","独創性が評価される分野：デザイン、メディア、テクノロジー、クリエイティブ。"],["Roles with variety and travel, where no two days match.","変化と移動が多く、同じ日が二つとない仕事。"]],"style":["You work best with freedom, quick feedback and permission to question how things are done. Heavy process and slow approval chains wear you down.","自由度、すばやいフィードバック、やり方を疑ってよい空気があると力が出ます。重い手続きと遅い承認は消耗のもとです。"],"money":["Income can be uneven, with big wins and slow patches. You do best when a steady base covers essentials and the risky ventures use only what you can afford to lose. Partners who finish what you start are worth paying well.","収入には波が出やすく、大きな成功と停滞が交互に来ます。生活費は安定した土台でまかない、冒険は失っても大丈夫な範囲で行うのが合っています。あなたが始めたことを仕上げてくれる仲間には、しっかり報いてください。"],"caution":["Before starting something new, finish or formally close one old thing.","新しいことを始める前に、古いことを一つ、やり遂げるか、きちんと終わらせてください。"]},"drain":["Rigid rules, long meetings and being told to wait.","融通の利かない決まり、長い会議、「待て」と言われること。"],"recharge":["A new place, a fast walk or sport, a loud conversation with friends who push back.","初めての場所、早足の散歩やスポーツ、遠慮なく言い返してくれる友人との賑やかな会話。"],"week":["This week, pick one unfinished project and take it to the next real milestone before you start anything new.","今週、途中のことを一つ選んで、新しいことを始める前に、次の区切りまで進めてください。"],"close":["Your gift is making things begin. Put just a little of that fire into seeing one thing through, and the doors you open will stay open.","あなたの才能は、物事を始めさせること。その火のほんの一部を「やり遂げる」ほうへ回せば、あなたが開けた扉は開いたままになります。"]},"well":{"core":[["Like well water, your mind is clear and runs deep. You gather facts, test them and argue precisely, and you stay calm when others lose their heads. People come to you when they need a straight, fair read of a situation, because you are not swept along by the mood of the room.","井戸の水のように、あなたの頭脳は澄んで深く流れています。事実を集め、確かめ、正確に論じ、周りが慌てても冷静です。部屋の空気に流されないので、状況を公平に判断してほしい時、人はあなたのところへ来ます。"],["The reserve that makes you reliable can also keep people at arm's length. You warm up slowly and share your feelings in small, measured portions. Once someone has earned your trust it lasts a very long time, but it takes patience on their side to get there.","信頼できる人柄を作っている落ち着きは、人を少し遠ざけもします。打ち解けるのに時間がかかり、気持ちは少しずつ量って出します。一度信頼を得た人には長く誠実ですが、そこへ至るまでには相手の辛抱が要ります。"]],"strengths":[["Clear thinking","冷静な頭脳","You separate what is known from what is feared, and that makes your decisions sound.","分かっていることと不安に思っていることを分けられるので、判断が確かです。"],["Fairness","公平さ","You give both sides a real hearing, and people accept your conclusion for that reason.","双方の話をきちんと聞くので、あなたの結論は受け入れられやすいのです。"],["Long loyalty","長く続く誠実さ","Friends of ten or twenty years are normal for you.","10年、20年続く友人関係が、あなたには普通のことです。"]],"blind":[["Cool to the touch","冷たく見える","Your calm can look like not caring when someone needs warmth, not analysis.","分析ではなく温かさが欲しい相手には、冷静さが「関心がない」と映ることがあります。"],["Analysis as a shelter","分析に逃げる","You can think about a feeling for so long that you never feel it.","気持ちを考え続けるあまり、実際に感じることを避けてしまうことがあります。"],["Slow to ask","頼むのが遅い","You wait until you have proof you need help, and by then you are overloaded.","助けが必要だという証拠が揃うまで待ち、気づけば抱え込みすぎています。"]],"love":{"attract":["You are drawn to people who are intelligent and sincere, and who do not rush you. A person who is comfortable with silence, who asks real questions and means what they say earns your attention.","知的で誠実で、急かさない人に惹かれます。沈黙を気にせず、本当の問いを投げ、言ったことを守る人が、あなたの関心を得ます。"],"pattern":["You take a long time to open up, and then you are loyal for years. The trap is mistaking a slow start for no feeling, so potential partners leave before you have said anything. Another is going silent instead of saying what bothers you.","心を開くのには長くかかり、開いたら何年も誠実です。落とし穴は、ゆっくりな始まりが「気持ちがない」と受け取られ、あなたが何も言わないうちに相手が離れること。もう一つは、気になることを言わず黙ってしまうことです。"],"try":["Tell someone early, in one sentence, that you are interested. You do not have to explain why or what happens next.","気になる人には、早めに一言で伝えてください。理由も、その先のことも、説明しなくて構いません。"]},"work":{"fit":[["Analytical work: engineering, science, auditing, law, medicine, data.","分析力が活きる仕事：技術職、科学、監査、法律、医療、データ。"],["Roles that need a steady, impartial mind: arbitration, compliance, planning, risk.","動じない公平な頭脳が要る仕事：仲裁、コンプライアンス、企画、リスク管理。"],["Water, health, or infrastructure fields, where careful systems matter.","水、健康、インフラなど、慎重な仕組みづくりが大切な分野。"]],"style":["You work best with clear information, independence and a calm setting. Chaotic, emotional workplaces make you pull back.","整った情報、自分で進められる範囲、落ち着いた環境で力が出ます。混乱していて感情的な職場では、引いてしまいます。"],"money":["You are careful with money and tend to research before you buy or invest. Steady growth and well-understood choices suit you. The risk is leaving money idle out of over-caution, so set a simple plan and let it run.","お金には慎重で、買う前・投資する前によく調べます。着実な増やし方と、仕組みを理解できる選択が合っています。慎重すぎて動かさないままになるのが弱点なので、単純な計画を決めて回すことです。"],"caution":["Do not wait for certainty. Most good decisions are made at about seventy percent.","確実になるまで待たないでください。良い決断の多くは、7割ほど分かった時点でされています。"]},"drain":["Emotional scenes, vague instructions and being pressed to decide on the spot.","感情的な修羅場、あいまいな指示、その場で決めるよう迫られること。"],"recharge":["Quiet time by water, a clear desk, a long solo walk, a good puzzle.","水辺で静かに過ごす時間、片づいた机、一人の長い散歩、良いパズル。"],"week":["This week, tell one person something you appreciate about them, in plain words, without analysis.","今週、誰か一人に、感謝や好意を、分析を付けずに、素直な言葉で伝えてください。"],"close":["Your depth is real, and the people who reach it are lucky. Let a few more of them come closer, sooner than feels safe.","あなたの深さは本物で、そこまで届いた人は幸運です。安全だと感じるより少し早く、あと数人、近くへ招いてみてください。"]},"spirit":{"core":[["Tradition calls yours the most auspicious mansion of all. You wander toward whatever fascinates you, give freely, and somehow land on your feet. People feel lighter around you, and doors open for you that stay shut for others, often without any plan on your part.","伝統の上で、もっとも縁起のよい宿とされています。心惹かれるものへ自由に向かい、惜しみなく与え、なぜかうまく着地します。あなたといると人は気が軽くなり、ほかの人には閉ざされたままの扉が、特に計画もなく開くことがよくあります。"],["Your freedom is also your risk. Because things usually work out, you may skip the dull preparation, and the luck you rely on can run thin if you stretch it too far. You love sincerely and without calculation, and you wilt when anyone tries to hold you in a box.","その自由さは、リスクでもあります。たいていうまくいくので地味な準備を飛ばしがちで、頼りにしている運も、使いすぎれば細くなります。計算なしに純粋に愛する人で、型にはめようとされると元気をなくします。"]],"strengths":[["Natural luck","巡り合わせの良さ","Help, chances and kind strangers seem to find you at the right moment.","助け、機会、親切な人が、ちょうどいい時に現れます。"],["Generosity","惜しみなく与える","You share time, money and attention easily, and it comes back around.","時間もお金も関心も気前よく分けて、それが巡って戻ってきます。"],["Curiosity","好奇心","You find something interesting almost everywhere, which keeps you young.","どこにでも面白いものを見つけられて、それが若さを保ちます。"]],"blind":[["Leaning on luck","運に頼りすぎる","Not preparing because it has always worked is how a lucky streak ends.","「いつもうまくいくから」と準備しないことが、運の良い流れを終わらせます。"],["Giving away too much","与えすぎる","People who only take can find you, and you may not notice until you are drained.","もらうだけの人も寄ってくるので、気づいた時には消耗しています。"],["Hard to pin down","つかまえにくい","Plans that are not firm leave others waiting and wondering where you stand.","予定が固まらず、周りはあなたの立ち位置が分からず待ちぼうけになります。"]],"love":{"attract":["You are drawn to people who are sincere and a little bit playful. Warmth, curiosity and the freedom to be yourself matter far more than status or polish.","誠実で、少し遊び心のある人に惹かれます。肩書きや洗練より、温かさと好奇心、そして自分のままでいられる自由が大切です。"],"pattern":["You love with childlike sincerity and want the same in return. Control or jealousy makes you retreat quickly. Your pattern is leaving quietly instead of saying what feels too tight, so the other person never learns why.","子どものように純粋に愛し、同じものを返してほしいと思います。束縛や嫉妬には、すぐに引いてしまいます。窮屈さを口にせず静かに離れていくので、相手は理由を知らないままになりがちです。"],"try":["This month, tell your partner one boundary you need, kindly and early, before it becomes a reason to leave.","今月、パートナーに、必要な距離感を一つ、やさしく早めに伝えてください。離れる理由になる前に。"]},"work":{"fit":[["People and play: hospitality, events, entertainment, travel, education for children.","人と楽しさの仕事：接客、イベント、エンタメ、旅行、子どもに関わる教育。"],["Roles that reward warmth: caregiving, community work, sales built on trust.","温かさが評価される仕事：ケア、地域活動、信頼で成り立つ営業。"],["Creative or freelance paths where you set your own pace.","自分のペースで進められる、創作やフリーランスの道。"]],"style":["You work best in a friendly setting with room for experiments. Strict control, dull routine and cold competition take the sparkle out of you.","親しみのある環境と、試してみる余白があると力が出ます。厳しい管理、単調な繰り返し、冷たい競争は、輝きを奪います。"],"money":["Money tends to come and go easily. Lucky breaks are real, but so is spending on others and on experiences. A simple automatic saving habit lets your luck stay yours.","お金は入りやすく、出ていきやすい傾向です。幸運な収入は実際にありますが、人や体験への出費も同じくらいあります。簡単な自動の貯蓄をしておくと、運をあなたの手元に残せます。"],"caution":["Luck loves preparation too. Do the dull part once, and it will make the lucky part last.","運は、準備も好きです。地味な部分を一度きちんとやれば、運の良い部分が長持ちします。"]},"drain":["Being controlled, being watched, and joyless obligations.","管理されること、監視されること、楽しみのない義務。"],"recharge":["Wandering without a plan, a good laugh, animals, new food, an open afternoon.","予定のない散策、よく笑うこと、動物、初めての食べ物、何も決めていない午後。"],"week":["This week, do one boring but important preparation you have been putting off, then reward yourself with something fun.","今週、先延ばしにしていた地味で大事な準備を一つ終わらせて、そのあとに楽しいご褒美を用意してください。"],"close":["You are lucky, and you are also kind, and the second is why the first keeps working. Keep giving, and keep a little in reserve for yourself.","あなたは運がよく、そして優しい人です。優しさがあるから、運が続いています。与え続けながら、自分のぶんも少し残しておいてください。"]},"willow":{"core":[["Whatever you love, you love completely. When something or someone captures you, you pour yourself in without holding back, and that intensity draws people toward you. Like a willow you bend with the wind, but your roots do not move.","好きになったものは、徹底的に好きになります。心をつかまれた人や物事には、出し惜しみなく自分を注ぎ込み、その熱量が人を引き寄せます。柳のように風にはしなやかに揺れても、根は動きません。"],["Focus is both your power and your weak point. When your attention is on something, nothing else exists, which makes you formidable and sometimes hard to reach. You need depth in your work and your relationships, and shallow things leave you restless and flat.","集中力が、あなたの強みであり弱点でもあります。意識が向くと他のことが見えなくなり、頼もしい反面、近づきにくくもなります。仕事にも人間関係にも「深さ」を求め、浅いものには落ち着かず、気が抜けてしまいます。"]],"strengths":[["Wholehearted commitment","全力で打ち込む力","You give things your full attention, and the results show it.","全身全霊で向き合うので、結果にもそれが表れます。"],["Magnetism","人を惹きつける力","Your passion is visible, and people want to be near it.","情熱が目に見えるので、人はその近くにいたくなります。"],["Flexible roots","しなやかさ","You bend under pressure without breaking and return to center afterward.","圧力がかかっても折れず、揺れたあとにちゃんと中心へ戻ってきます。"]],"blind":[["All or nothing","ゼロか百か","Half measures feel dishonest, so you tend to swing between full effort and withdrawal.","中途半端は不誠実に思えて、全力と引きこもりの間を振り子のように動きがちです。"],["Burning out","燃え尽きる","You give past your limit before noticing, and then crash.","限界を越えて与えていることに気づかず、そのあと一気に落ち込みます。"],["Possessive instincts","独占したくなる","The wish to protect can slide into wanting to hold on too tightly.","守りたい気持ちが、強く握りしめたい気持ちに変わることがあります。"]],"love":{"attract":["You are drawn to people with depth, a quality that shows when they speak about what they care about. Shallow charm leaves you cold, while sincerity, loyalty and a real inner life get your attention.","深さのある人に惹かれます。大切にしていることを語る時に見えるものです。軽い愛想には心が動きませんが、誠実さ、忠実さ、豊かな内面には、すぐ気づきます。"],"pattern":["You love all in and protect fiercely. The pattern to watch is giving so much that the other person feels weighed down, or expecting the same total devotion in return and feeling hurt when it is not matched.","全力で愛して、強く守ろうとします。気をつけたいのは、与えすぎて相手が重く感じること、そして、同じだけの全力を返してもらえないと傷つくことです。"],"try":["This month, ask your partner what kind of closeness feels good to them. Their answer may be lighter than yours, and that is fine.","今月、パートナーに、どんな近さが心地よいか聞いてみてください。あなたよりも軽やかな答えかもしれませんが、それで構いません。"]},"work":{"fit":[["Work you can give yourself to: medicine, counseling, the arts, research, a craft.","全身で取り組める仕事：医療、カウンセリング、芸術、研究、職人仕事。"],["Mission-driven roles: nonprofits, education, advocacy, causes you believe in.","使命感が原動力になる仕事：非営利、教育、啓発、信じられる活動。"],["Fields built around people and loyalty: service, community, family business.","人と忠誠心が軸になる分野：サービス、地域、家業。"]],"style":["You work best when you believe in the purpose and can focus deeply on one thing at a time. Constant task switching and pointless busywork drain you fast.","目的に納得でき、一つのことに深く集中できる環境で力が出ます。頻繁なタスクの切り替えや、意味のない雑務は、あっという間に消耗させます。"],"money":["Money flows toward what you care about. You will spend generously on people and passions, and may undercharge for work you love. Decide a minimum for your time and hold it.","お金は、あなたが大切にするものへ流れていきます。人や情熱には気前よく使い、好きな仕事では安く請け負いがちです。自分の時間の最低ラインを決めて、守ってください。"],"caution":["Passion is not a reason to work for nothing. Love what you do and still get paid for it.","情熱は、無償で働く理由にはなりません。好きな仕事でも、きちんと報酬を受け取ってください。"]},"drain":["Shallow socializing, being pulled in many directions, and people who do not follow through.","浅い付き合い、あちこちに引っ張られること、約束を果たさない人。"],"recharge":["Deep focus on something you love, time alone by green and water, a close friend who needs no explaining.","好きなことへの深い集中、緑や水のそばでの一人時間、説明のいらない親友との時間。"],"week":["This week, decide in advance how much you will give to one commitment, and stop at that number.","今週、一つの約束ごとに、どこまで与えるかを先に決めて、その数字で止めてみてください。"],"close":["Your intensity is not too much. It simply needs somewhere worthy to go, and a little rest in between.","あなたの熱量は、多すぎるのではありません。ふさわしい行き先と、合間の少しの休息があればいいのです。"]},"drawn-bow":{"core":[["You were made for the stage and you share the spotlight generously. You know how to present yourself, how to make an entrance and how to make others feel seen, and people gather around you without being asked. Charm comes easily and so does the courage to be visible.","あなたは舞台に向いた人で、スポットライトも気前よく分けます。自分の見せ方を知り、登場の仕方を知り、周りの人を輝かせる術も知っていて、人は呼ばなくても集まってきます。華やかさと、目立つ勇気を、自然に持っています。"],["Under the confident surface is a careful planner who hates to disappoint. You rehearse, you prepare and you want things to look effortless, and that effort is mostly invisible. Praise nourishes you, and criticism lingers longer than you let on.","自信に満ちた表面の下には、期待を裏切りたくない慎重な計画家がいます。準備し、練習し、楽に見えるようにしていて、その努力はほとんど見えません。称賛は糧になり、批判は見せている以上に長く残ります。"]],"strengths":[["Presence","存在感","You walk into a room and the energy changes, in a good way.","あなたが部屋に入ると、空気が良い方に変わります。"],["Expressiveness","表現力","You can put a feeling, a story or a plan into form that others instantly grasp.","気持ちも物語も計画も、人がすぐに分かる形にして伝えられます。"],["Generous with praise","人を輝かせる","You notice talent in others and say so, which makes them want to work with you.","人の才能に気づいて口にするので、みんなあなたと一緒に何かをしたくなります。"]],"blind":[["Needing applause","称賛への依存","When appreciation fades, so does your motivation, and you can chase approval.","称賛が減ると意欲も減り、承認を追いかけてしまうことがあります。"],["Pride as armor","誇りで鎧を着る","Admitting mistakes or not knowing something feels risky, so you cover it.","間違いや知らないことを認めるのが怖く、取り繕ってしまうことがあります。"],["Overspending the image","見栄の出費","Keeping up appearances can quietly cost more than you planned.","見た目を保つための出費が、気づかないうちに大きくなります。"]],"love":{"attract":["You are drawn to people who see you clearly and still admire you. Confidence, taste and an appreciative eye attract you, along with someone who stands comfortably beside you in public.","あなたをよく見て、そのうえで尊敬してくれる人に惹かれます。自信、センス、認めてくれるまなざし、そして人前でも隣に堂々と立ってくれる人が好みです。"],"pattern":["You want to be admired, and you spoil the person who admires you. The pattern to watch is performing the best version of yourself so well that your partner never sees the off-stage you, and you end up lonely in the relationship.","称賛されたい人で、称賛してくれる相手をとことん甘やかします。注意したいのは、完璧なあなたを演じきって、舞台裏のあなたを相手が一度も見ないまま、関係の中で孤独になってしまうことです。"],"try":["This month, let your partner see you tired or unsure once, without fixing it or making it a story.","今月、疲れている時や自信がない時のあなたを、相手に一度見せてみてください。取り繕わず、話を盛らずに。"]},"work":{"fit":[["Stage and spotlight: performing, presenting, hosting, broadcasting, sales.","舞台や表舞台の仕事：パフォーマンス、プレゼン、司会、放送、営業。"],["Image and beauty fields: fashion, styling, branding, event planning.","見せ方が大切な分野：ファッション、スタイリング、ブランディング、イベント企画。"],["Leadership roles where visibility and charisma move people.","存在感と華やかさが人を動かす、リーダー的な役割。"]],"style":["You work best when your effort is seen and appreciated, with a team that enjoys your lead. Being hidden in the back office or having your work credited to others drains you.","努力が見られ、評価され、あなたの先導を楽しんでくれる仲間がいると力が出ます。裏方に隠されたり、手柄を他人のものにされたりすると、消耗します。"],"money":["Income can be good when your image and reputation are strong. You enjoy nice things and tend to spend on presentation. Keep a savings habit that runs without your attention, so appearances do not outpace the account.","イメージと評判が強い時には、収入も良くなります。素敵なものを楽しみ、見せ方への出費が多めです。意識しなくても貯まる仕組みを作っておくと、見栄が貯金を追い越さずに済みます。"],"caution":["Do not mistake the applause for the income. Know your real numbers.","拍手と収入を取り違えないでください。実際の数字を把握しておくことです。"]},"drain":["Being ignored, being criticized in public, and work nobody sees.","無視されること、人前での批判、誰にも見られない仕事。"],"recharge":["A good outfit, an audience of people who adore you, a night out, then a real rest afterward.","お気に入りの装い、あなたを慕う人たちの前での時間、楽しい夜、そのあとのしっかりした休息。"],"week":["This week, say \"I do not know yet\" once where you would usually bluff. Notice that the room stays warm.","今週一度、普段なら取り繕う場面で「まだ分かりません」と言ってみてください。場の温かさが変わらないことに気づくはずです。"],"close":["You shine, and the people who matter will still love you when you are not shining. Let them prove it.","あなたは輝く人です。そして、本当に大切な人は、輝いていない時のあなたも愛してくれます。それを確かめさせてあげてください。"]},"wings":{"core":[["You aim for perfection and will travel a long way to find it, often literally. Distant places, foreign ideas and long projects suit you. You have the eye of someone who sees what could be improved, and the discipline to keep refining until it is right.","完璧を目指し、そのためなら文字どおり遠くまで行きます。遠い土地、異国の考え方、長い取り組みが合っています。何が改善できるかを見抜く目と、納得するまで磨き続ける根気を持っています。"],["High standards can make daily life feel disappointing. You notice the gap between how things are and how they should be, and you can wear yourself out closing it. You choose slowly in love and work, and once you choose you are faithful.","高い基準のせいで、日常に物足りなさを感じることもあります。現実と理想の差に敏感で、それを埋めようとして自分をすり減らすこともあります。恋でも仕事でも選ぶのは慎重ですが、いったん選べば誠実に貫きます。"]],"strengths":[["Precision","精度の高さ","You catch the detail that separates good from excellent.","「良い」と「素晴らしい」を分ける細部に、気づけます。"],["A wide horizon","広い視野","You are comfortable with other cultures and other ways of thinking.","ほかの文化や考え方に、抵抗なくなじめます。"],["Faithfulness","一度決めたら貫く","People who earn your trust find you loyal and reliable for years.","信頼を得た人にとっては、何年も忠実で頼れる存在です。"]],"blind":[["Chasing the perfect","完璧を追いすぎる","Nothing is ever quite finished, and good enough can feel like failure.","完成と呼べるものがなく、「十分」が失敗のように感じてしまいます。"],["Distance from the present","今の暮らしから遠い","You are always looking toward a better place, and may miss the one you are in.","いつもどこか良い場所を見ていて、今いる場所を見落とすことがあります。"],["Critical eye on people","人への厳しい目","The standard you apply to work can leak onto the people around you.","仕事に向ける基準が、そばにいる人にまで向いてしまうことがあります。"]],"love":{"attract":["You are drawn to refined, principled people with a bit of the world in them. Someone well read or well traveled, with good manners and a clear sense of values, catches your interest.","洗練されて、筋が通っていて、どこか世界の広がりを感じさせる人に惹かれます。読書や旅の経験が豊かで、マナーがよく、価値観がはっきりした人に心を引かれます。"],"pattern":["You take your time choosing, then commit fully. The pattern to watch is holding a partner to an ideal and being quietly disappointed, or leaving a good relationship because you imagine a better one elsewhere.","時間をかけて選び、決めたら全力で向き合います。気をつけたいのは、パートナーに理想を求めて静かに失望すること、あるいはどこかにもっと良い関係があると想像して、良い関係を手放してしまうことです。"],"try":["This month, name three things you already love about your partner or your life, out loud, before you mention anything to improve.","今月、パートナーや暮らしの中で、すでに好きなことを三つ、改善点を言う前に、声に出して挙げてみてください。"]},"work":{"fit":[["International and long-range work: trade, translation, aviation, overseas roles.","国際的で長い視野の仕事：貿易、翻訳、航空、海外関連の仕事。"],["Quality-driven fields: editing, design, engineering, research, restoration.","品質がものを言う分野：編集、設計、技術開発、研究、修復。"],["Education, culture and long projects that need steady refinement.","教育、文化、地道に磨き続ける長期プロジェクト。"]],"style":["You work best on long projects with room for quality and a travel or learning element. Rushed deadlines that force low quality are your worst environment.","品質にこだわれる長いプロジェクトで、旅や学びの要素があると力が出ます。質を落とさざるを得ない急ぎの締め切りは、いちばん苦手な環境です。"],"money":["You earn well through expertise and reputation for quality, often later in a career. You spend on experiences, travel and good tools. Set a ceiling for what is good enough, so perfectionism does not inflate costs.","専門性と品質への評判で、特にキャリアの後半に収入が伸びます。体験、旅、良い道具にお金を使います。「十分」の上限を決めておくと、完璧主義でコストが膨らむのを防げます。"],"caution":["A finished thing at ninety percent helps more people than a perfect thing never shown.","9割の出来で完成したものは、完璧でも見せないものより、多くの人の役に立ちます。"]},"drain":["Sloppy work, rushed deadlines and being stuck in one place for too long.","雑な仕事、急ぎの締め切り、同じ場所に長くとどまること。"],"recharge":["A trip, even a short one, a bookstore, language learning, a clean and well-ordered room.","短くてもいいから旅に出ること、書店、語学の勉強、整った部屋。"],"week":["This week, finish one thing at ninety percent and let it go out into the world.","今週、9割の出来で一つ仕上げて、世に送り出してみてください。"],"close":["Your wings are meant to be used, not just admired. Go far, and let the people near you travel a little of the way with you.","あなたの翼は、眺めるものではなく、使うものです。遠くまで行って、そばにいる人にも、道のりの一部を一緒に歩かせてあげてください。"]},"chariot":{"core":[["You read a room in seconds and move through it with ease, connecting people who should know each other. You are light on your feet in conversation and in life, welcome almost everywhere, and trusted by people who would not trust each other. Travel, trade and anything in motion bring you luck.","場の空気を数秒で読み、軽やかに動いて、出会うべき人同士をつなぎます。会話も暮らしもフットワークが軽く、ほとんどどこでも歓迎され、お互いを信用しない人たちからも信頼されます。旅、商い、動きのあるものが、運を運んできます。"],["Because you attend to others so well, you can lose track of what you want. You adapt, soothe and smooth things over, and then wonder why you feel unseen. You are gentle and considerate, and you need the same steady reassurance back.","人への気配りが行き届くぶん、自分が何を望んでいるのかを見失うことがあります。合わせ、なだめ、丸く収めたあと、なぜ自分は見てもらえていないのだろうと感じることも。優しく思いやりがあり、同じだけの変わらない安心感を、相手にも求めています。"]],"strengths":[["Reading people","空気を読む力","You sense moods and needs before they are spoken.","言葉になる前の気分や必要を感じ取れます。"],["Connecting","人をつなぐ力","Introductions you make tend to work, and people remember you for them.","あなたが紹介した縁はうまくいき、そのことで覚えられます。"],["Agility","身軽さ","You adapt quickly to new places, new groups and new plans.","新しい場所、新しい集まり、新しい計画にも、すぐ適応できます。"]],"blind":[["Losing your own voice","自分の声を見失う","You agree to keep the peace and then resent it quietly.","平和のために合わせて、あとで静かに不満を抱えます。"],["Spreading thin","手を広げすぎる","You say yes to many people and end up scattered.","多くの人に応えて、気づけば散らばっています。"],["Needing reassurance","安心を求めすぎる","Silence from someone you care about can feel like rejection.","大切な人の沈黙を、拒絶のように感じることがあります。"]],"love":{"attract":["You are drawn to kind, steady people who make you feel safe and chosen. Someone who texts back, remembers small things and does not make you guess where you stand is deeply attractive.","優しくて安定していて、守られていると感じさせてくれる人に惹かれます。連絡をくれて、小さなことを覚えていて、あなたに気持ちを推測させない人は、とても魅力的です。"],"pattern":["You are attentive and gentle, and you need steady reassurance in return. The pattern to watch is over-accommodating a partner who gives little back, and not saying what you need until the feelings have grown big.","気配りができて優しく、変わらない安心感を求めます。注意したいのは、あまり返してくれない相手に合わせすぎること、そして、気持ちが大きくなってからでないと、必要なことを言わないことです。"],"try":["This month, say what you want for a date, a meal or a weekend before the other person asks. Small choices build a voice.","今月、デートや食事、週末の過ごし方で、相手に聞かれる前に希望を言ってください。小さな選択が、自分の声を育てます。"]},"work":{"fit":[["Movement and connection: logistics, travel, trading, transport, brokerage.","移動とつながりの仕事：物流、旅行、貿易、運輸、仲介。"],["People-facing roles: sales, hospitality, concierge, public relations, matchmaking.","人と接する仕事：営業、接客、コンシェルジュ、広報、縁結び。"],["Communication and coordination: project coordination, events, media.","伝達と調整の仕事：進行管理、イベント、メディア。"]],"style":["You work best in a lively, friendly setting with variety and room to move. Being tied to one desk and one routine all day wears down your spirit.","活気があって親しみのある環境で、変化と動きがあると力が出ます。一日中同じ机、同じ繰り返しに縛られると、気力が下がります。"],"money":["Money tends to come through people and movement: referrals, trade, and being in the right place. Be careful about lending or covering for friends beyond your means, since you find it hard to say no.","お金は人と動きから入ってきます。紹介、取引、ちょうどよい場所にいること。断るのが苦手なので、友人への貸し借りや立て替えは、手に負える範囲を決めておいてください。"],"caution":["A kind no protects relationships better than a resentful yes.","優しい「ノー」は、恨みの混じった「イエス」より、人間関係を守ります。"]},"drain":["Conflict, being pinned to one spot, and giving constantly with no thanks.","争いごと、一か所に縛られること、感謝のないまま与え続けること。"],"recharge":["A change of scenery, a drive or train ride, good talk with an easy friend.","景色を変えること、ドライブや電車の旅、気楽な友人との良い会話。"],"week":["This week, make one plan only because you want it, not because someone else would like it.","今週、誰かが喜ぶからではなく、自分がしたいからという理由だけで、予定を一つ決めてください。"],"close":["You carry people toward each other, and that is rare. Remember to also carry yourself toward what you want.","あなたは人と人を結びつけていて、それは貴重な才能です。自分自身も、望むものの方へ運んであげてください。"]},"horn":{"core":[["You have good taste and clever hands, and you make hard things look easy. Style, wit and a gift for enjoying life come naturally. People come for the fun and the charm, and stay once they discover the principled core you keep out of sight.","センスがよく手先も器用で、難しいことを簡単そうにこなします。おしゃれ、機知、人生を楽しむ才能が、自然に備わっています。人は楽しさと魅力に惹かれて集まり、あなたが隠している筋の通った芯を知ると、離れなくなります。"],["Because you attract attention easily, you can scatter your energy across many interests and admirers. Beneath the lightness is a person who wants real loyalty and real skill. You are popular and flirtatious on the surface, but once your heart is set you are steady.","注目を集めやすいぶん、興味や取り巻きに、エネルギーが分散しがちです。軽やかさの下には、本当の誠実さと本物の腕前を求める人がいます。表向きは人気者で気も多く見えますが、心が決まれば、一途です。"]],"strengths":[["Taste","センス","You know what looks right, tastes right and feels right, and others rely on your eye.","何が似合い、何が美味しく、何が心地よいか分かり、周りがあなたの目を頼りにします。"],["Skillful hands","器用さ","You learn crafts and techniques quickly and carry them off with grace.","技術や手仕事を素早く習得し、さらりとこなします。"],["Joy","楽しむ力","You make ordinary days feel like occasions, and people love you for it.","普通の日を特別な日のように変えて、人から愛されます。"]],"blind":[["Too many options","選択肢が多すぎる","Interests and admirers multiply, and deciding gets harder.","興味も好意も増えて、決めるのが難しくなります。"],["Looking easy, feeling alone","楽そうに見えて孤独","People assume you are fine, so your struggles go unnoticed.","いつも大丈夫そうに見られ、悩みが気づかれにくいのです。"],["Surface over substance","見た目が先行する","Polish can get ahead of the depth you actually have.","磨かれた印象が、実際の深さより先に立つことがあります。"]],"love":{"attract":["You are drawn to people with style, spark and a bit of mystery. Someone who makes you laugh, dresses with thought and is secure enough not to be threatened by your popularity is hard to resist.","センスがあり、輝きがあって、少し謎めいた人に惹かれます。笑わせてくれて、装いに気を配り、あなたの人気に動じない余裕のある人は、抗いがたい存在です。"],"pattern":["You are popular and quick to charm, and some people read that as flirting without intent. The pattern to watch is enjoying attention while keeping your real feelings back, then being surprised when a partner feels uncertain.","人気者で、人を惹きつけるのが早く、それが「その気のない気まぐれ」と受け取られることもあります。気をつけたいのは、注目を楽しみながら本心を見せず、パートナーが不安になって初めて驚くことです。"],"try":["This month, make one clear statement to the person you care most about: \"You are the one I want to spend time with.\"","今月、いちばん大切な人に、はっきり一言伝えてください。「一緒に過ごしたいのは、あなた」と。"]},"work":{"fit":[["Creative and craft work: design, fashion, cooking, jewelry, music, art.","創る仕事、手を動かす仕事：デザイン、ファッション、料理、ジュエリー、音楽、美術。"],["Hospitality and entertainment, where style and warmth sell.","センスと温かさが価値になる、接客・エンタメ分野。"],["Skilled trades and specialties that reward fine hands.","器用さが評価される、技能職や専門職。"]],"style":["You work best when you can be playful and creative, with people who appreciate craft. Rigid, joyless offices dull you.","遊び心と創造性が活かせて、職人技を評価してくれる人たちのそばで力が出ます。堅苦しくて楽しみのない職場では、輝きが鈍ります。"],"money":["Money can come easily through skill, charm and good timing, and go out just as easily on taste. Set aside a fixed share when it arrives, before you spend on the good things.","お金は技術と魅力とタイミングで入りやすく、センスにまつわる出費でも出ていきやすい傾向です。入ってきたら先に一定額を分けておいてから、好きなものに使ってください。"],"caution":["Choose one or two skills to deepen instead of dabbling in all of them.","あれこれ手を出すより、一つか二つの技術を深めてください。"]},"drain":["Ugly places, rigid rules and having to hide your playful side.","殺風景な場所、融通の利かない決まり、遊び心を隠さなければならない場面。"],"recharge":["Making something with your hands, a beautiful space, good food, an evening with friends who make you laugh.","手で何かを作ること、美しい空間、美味しい食事、笑わせてくれる友人との夜。"],"week":["This week, finish one handmade or creative piece, however small, and show it to someone.","今週、小さくても手作りや創作を一つ仕上げて、誰かに見せてください。"],"close":["You make life look beautiful, which is a real talent. Let a few people see the effort and the doubt behind it as well.","あなたは人生を美しく見せることができ、それは本物の才能です。その裏にある努力や迷いも、数人には見せてあげてください。"]},"neck":{"core":[["You hold firm convictions, and you will stand alone to defend them. Unfairness moves you to act, which makes you a natural advocate for people who cannot speak for themselves. Principle comes first, and authority comes second, even when authority is displeased.","強い信念を持っていて、それを守るためなら一人でも立ちます。不公平を見ると動かずにいられず、声を上げられない人の代弁者になれます。原則が先で、権威は二番目。権威が不機嫌になっても、そうです。"],["This makes you a rare and reliable ally. It can also make you rigid, quick to see opposition in disagreement, and slow to let a conflict rest. Your reputation depends on being fair, and you carry the weight of that standard in every situation.","そのため、得がたく頼れる味方です。一方で、頑固になり、意見の違いを反対と受け取りやすく、争いをなかなか収められないこともあります。評判は公正さにかかっていて、あらゆる場面で、その基準の重さを背負っています。"]],"strengths":[["Conviction","信念の強さ","You know what you stand for, and others know where they stand with you.","自分が何を大切にするかを知っていて、周りもあなたとの立ち位置が分かります。"],["Courage to object","異を唱える勇気","You will say the unpopular thing when it needs saying.","言うべき時には、人気のないことも口にできます。"],["Sense of justice","正義感","You notice who is being treated badly, and you do something about it.","誰が不当に扱われているか気づき、行動します。"]],"blind":[["Standing alone too readily","一人で立ちすぎる","You can turn disagreement into a battle when a conversation would do.","話し合いで済むことを、闘いにしてしまうことがあります。"],["Rigidity","頑固さ","Once you take a position, it is hard to say \"I was wrong.\"","一度立場を決めると、「間違っていた」と言いにくくなります。"],["Carrying every cause","あらゆる問題を背負う","Every injustice feels like yours to fix, and that is exhausting.","あらゆる不正が自分の仕事に思えて、疲れ切ってしまいます。"]],"love":{"attract":["You are drawn to people with principles, whose actions match their words. Respect comes before attraction for you, and an equal who shares your values and can stand up to you is the one you want.","筋の通った人、言うことと行動が一致している人に惹かれます。あなたにとっては、魅力より先に尊敬があり、価値観が合って、あなたにも立ち向かえる対等な相手を求めています。"],"pattern":["You need an equal. The pattern to watch is turning small disagreements into tests of principle, so your partner feels judged. You may also hold back softer feelings because they seem like a weakness.","対等な相手が必要です。注意したいのは、小さな意見の違いを「原則の試験」にしてしまい、相手が裁かれていると感じること。そして、優しい気持ちを弱さだと思って、出さずにしまうことです。"],"try":["This month, in one disagreement, say \"You may be right\" and see what it does for the conversation.","今月、一つの意見の違いの中で、「あなたの言うとおりかも」と言ってみてください。会話がどう変わるか、観察を。"]},"work":{"fit":[["Justice and advocacy: law, policy, journalism, unions, human rights work.","公正さにかかわる仕事：法律、政策、報道、労働組合、人権活動。"],["Reform roles: management consulting, auditing, quality, regulation.","改善を担う仕事：経営コンサル、監査、品質管理、規制関係。"],["Independent work where you can follow your standards without compromise.","基準を曲げずに進められる、独立した仕事。"]],"style":["You work best where you can act on principle and have real say. Environments that ask you to look away from wrongdoing wear you down fastest.","原則に沿って動けて、発言権のある環境で力が出ます。不正に目をつぶることを求められる職場は、何より早くあなたを消耗させます。"],"money":["You earn well when your work matches your values, and poorly when it does not. You may refuse good money for unprincipled work, which is honorable, but plan so that conviction does not cost you stability.","価値観に合う仕事では稼げて、合わない仕事では伸びません。筋の通らない仕事の高収入を断ることもあり、それは立派ですが、信念が生活の安定を損なわないよう、備えは考えておいてください。"],"caution":["Choose your battles. Save your full force for the few that really matter.","闘う相手を選んでください。全力は、本当に大事な少数のために取っておくことです。"]},"drain":["Unfairness, spineless compromise and being asked to stay quiet.","不公平、腰の引けた妥協、黙っているよう求められること。"],"recharge":["Exercise that tests your body, time with people who share your values, a day away from the news.","体を使う運動、価値観が近い人との時間、ニュースを見ない一日。"],"week":["This week, pick one small issue where you will let someone else be right and move on.","今週、小さな問題を一つ選んで、相手が正しいことにして、先へ進んでみてください。"],"close":["The world needs people who will not look away. Keep that backbone, and let it soften for the people who are on your side.","世の中には、目をそらさない人が必要です。その背骨は保ちつつ、あなたの味方の前では、少しゆるめてください。"]},"root":{"core":[["You have staying power in body and mind, and a strong appetite for life that you are not embarrassed about. You go straight after what you want, and your practical instincts turn desire into results. Where others hesitate, you start, and where others tire, you are still going.","心身ともに持久力があり、人生への旺盛な食欲を、恥ずかしがりません。欲しいものへまっすぐ向かい、現実的な勘が、望みを結果に変えます。ほかの人がためらう場面で動き出し、ほかの人が疲れる場面でも、まだ進んでいます。"],["Your directness is refreshing, and it can also run over people. You say what you want, and sometimes forget that others need time to find out what they want. You have a sensual, grounded side that loves good food, comfort and the pleasures of the body, and you do best when you let yourself enjoy them.","率直さは爽快ですが、人を押し切ってしまうこともあります。望みをはっきり口にするので、ほかの人が自分の望みを見つける時間が要ることを、つい忘れがちです。食事、心地よさ、体の喜びを愛する、地に足のついた感覚的な面があり、それを楽しむ時ほど力が出ます。"]],"strengths":[["Stamina","持久力","You can sustain effort long after the novelty is gone.","目新しさが消えたあとも、努力を保ち続けられます。"],["Practical drive","現実的な推進力","You turn wants into plans and plans into outcomes without drama.","望みを計画にし、計画を成果にするのが、無駄なく進みます。"],["Honesty about wants","望みに正直","You do not play games, which makes you easy to understand and trust.","駆け引きをしないので、分かりやすく、信頼されやすい人です。"]],"blind":[["Steamrolling","押し切る","Your momentum can leave quieter people no room to speak.","勢いがあるので、静かな人が口を挟む余地を失うことがあります。"],["Indulgence","つい満たしすぎる","Appetite for food, comfort or pleasure can slide past what is good for you.","食欲や快適さ、楽しみへの欲求が、体に良い範囲を越えることがあります。"],["Impatience with slow people","ゆっくりな人へのいらだち","Others' hesitation can feel like obstruction to you.","他人のためらいを、妨害のように感じてしまうことがあります。"]],"love":{"attract":["You are drawn to people who are warm, honest and physically alive. Chemistry matters, and you want someone who enjoys life as fully as you do and says what they want without fuss.","温かくて正直で、生き生きした人に惹かれます。相性の良さは大切で、あなたと同じくらい人生を味わい、望みをさらりと言える人を求めています。"],"pattern":["You are ardent and direct, and you want clear answers. The pattern to watch is pushing for a decision before your partner is ready, then reading their need for time as rejection.","情熱的で率直で、はっきりした答えを求めます。注意したいのは、相手の準備ができる前に決断を迫り、時間が欲しいという相手の気持ちを、拒絶と受け取ることです。"],"try":["This month, after you say what you want, ask your partner \"What do you want?\" and wait for the whole answer.","今月、自分の望みを言ったあと、パートナーに「あなたは何がしたい？」と聞いて、最後まで待ってください。"]},"work":{"fit":[["Hands-on, physical or practical work: construction, food, sports, trades, agriculture.","体や実務を使う仕事：建設、食、スポーツ、職人仕事、農業。"],["Business and sales built on drive and results.","推進力と成果が価値になる、商売や営業。"],["Leadership roles that need decisions and stamina.","決断力と体力が求められる、リーダー的な役割。"]],"style":["You work best with clear goals, real responsibility and visible results. Endless discussion with no action frustrates you.","はっきりした目標、実際の責任、見える成果があると力が出ます。行動に至らない長い議論には、いらいらします。"],"money":["You make money through effort and results, and you enjoy spending it on life's pleasures. Keep a base of savings for lean periods, and be careful with impulsive large purchases.","お金は努力と成果で稼ぎ、人生の楽しみにも気前よく使います。苦しい時期のための貯えを土台にして、勢いでの大きな買い物には気をつけてください。"],"caution":["Do not mistake a fast yes for the right yes. Sleep on large decisions.","早い「はい」を、正しい「はい」と取り違えないでください。大きな決断は、一晩寝かせることです。"]},"drain":["Delays, vague plans and being asked to wait with no reason.","遅れ、あいまいな計画、理由のないまま待たされること。"],"recharge":["Good food, a hard workout or a long walk, a hot bath, solid sleep.","美味しい食事、しっかり体を動かすか長く歩くこと、熱いお風呂、深い睡眠。"],"week":["This week, slow one decision down by a day and notice whether your answer changes.","今週、一つの決断を一日だけ遅らせて、答えが変わるかどうか、観察してください。"],"close":["Your vitality is a gift to everyone near you. Share the pace, and let others catch up with you at their own speed.","あなたの生命力は、そばにいる人への贈り物です。ペースを分け合って、ほかの人が自分の速さで追いつくのを、待ってあげてください。"]},"chamber":{"core":[["Fortune tends to find you through family, patrons or simple good timing. You have charm, comfort and an easy relationship with luck. You enjoy fine things and share them graciously, which keeps the luck flowing and makes people glad to be near you.","運は、家族や後援者、あるいは単なる良いタイミングを通じて、あなたのところへやって来ます。魅力があり、心地よさがあり、運とは気楽な付き合いです。良いものを楽しみ、気前よく分かち合うので、運が巡り続け、周りの人もそばにいたくなります。"],["You thrive in harmony and wither in conflict. A peaceful home, a gentle circle and an affectionate partner bring out your best. The weakness is leaning on others so naturally that you do not build the strength to stand on your own when you have to.","調和の中で花開き、争いの中ではしぼみます。穏やかな家庭、優しい人の輪、愛情深いパートナーが、あなたの最良の部分を引き出します。弱点は、人に頼ることが自然すぎて、一人で立たなければならない時の力を、育てそびれることです。"]],"strengths":[["Warmth","温かさ","People feel welcome and looked after around you.","あなたのそばでは、人は歓迎され、大事にされていると感じます。"],["Graciousness","気前のよさ","You share good things easily, and that generosity circles back to you.","良いものを気軽に分け合い、その気前よさが、巡って戻ってきます。"],["Good fortune","恵まれた巡り合わせ","Help from family, mentors or chance tends to arrive when you need it.","家族や恩人、あるいは偶然からの助けが、必要な時に届きます。"]],"blind":[["Avoiding conflict","争いを避ける","You smooth over problems that need a direct conversation.","率直に話すべき問題を、うやむやに丸めてしまいます。"],["Leaning too much","頼りすぎる","Always having support can leave your own strength undeveloped.","いつも支えがあるぶん、自分自身の力が育ちにくいことがあります。"],["Comfort over change","心地よさを優先して変われない","A pleasant situation can keep you in it long after you should have moved.","居心地がよいために、動くべき時を過ぎてもその場にとどまります。"]],"love":{"attract":["You are drawn to affectionate, kind people who make home feel like a refuge. A partner who is warm, generous and good with family wins you quickly.","愛情深く優しくて、家を安らげる場所にしてくれる人に惹かれます。温かく、気前がよく、家族とも仲良くできるパートナーに、すぐ心を開きます。"],"pattern":["You are affectionate and easy to love. The pattern to watch is avoiding the hard conversation to keep things peaceful, so small resentments pile up quietly until one day they come out all at once.","愛情深く、愛されやすい人です。注意したいのは、平和を保つために難しい話を避け、小さな不満が静かに積もって、ある日いっぺんに出てくることです。"],"try":["This month, bring up one small thing that bothers you, gently and early, while it is still small.","今月、気になっていることを一つ、小さいうちに、優しく早めに話してください。"]},"work":{"fit":[["Hospitality, family business and care: hotels, restaurants, wellness, real estate.","もてなしと家族ぐるみの仕事、ケア：宿泊、飲食、ウェルネス、不動産。"],["Roles built on relationships and trust: sales, patronage, community work.","関係と信頼で成り立つ仕事：営業、後援、地域活動。"],["Inheritance and legacy fields: family enterprises, finance, trusts.","受け継ぐ仕事：家業、金融、信託。"]],"style":["You work best in a harmonious team with a warm leader and fair treatment. Hostile, competitive environments dim you quickly.","調和した仲間、温かいリーダー、公平な扱いがある環境で力が出ます。敵意があって競争的な職場では、すぐに輝きが鈍ります。"],"money":["Money often comes through family, patrons and well-timed chances, and you tend to enjoy it well. Protect it by building your own savings and skills, so your comfort does not depend on any single source.","お金は家族、後援者、良いタイミングから入りやすく、楽しんで使う傾向です。自分自身の貯えと技術を築いて、心地よい暮らしが、一つの源だけに頼らないようにしてください。"],"caution":["Build one skill or income that is entirely yours.","全部が自分のものと言える技術や収入を、一つ、育ててください。"]},"drain":["Quarrels in your home or team, cold treatment and sudden insecurity.","家庭や仲間内の争い、冷たい扱い、急な不安定さ。"],"recharge":["A comfortable home, good meals with people you love, gentle music, a soft blanket.","居心地のよい家、大切な人との美味しい食事、穏やかな音楽、柔らかい毛布。"],"week":["This week, do one thing entirely on your own that you would normally ask someone to help with.","今週、普段なら誰かに頼むことを、一つ、自分だけでやってみてください。"],"close":["Luck loves you, and it loves you most when you also trust your own hands. Enjoy the warmth, and keep building your own strength.","運はあなたを愛していて、あなたが自分の手も信じている時に、いちばん応えてくれます。温かさを楽しみながら、自分の力も育て続けてください。"]},"heart":{"core":[["You sense what people feel before they say it. You understand others by instinct, and you can become whoever the moment needs, gentle for the shy and bold for the cautious. That gift wins hearts and opens doors, and it is nearly effortless.","人が口にする前に、その気持ちを感じ取ります。直感で人を理解し、その場に必要な自分になれます。内気な人には優しく、慎重な人には大胆に。その才能は人の心をつかみ、扉を開き、ほとんど努力なしに働きます。"],["Your own heart, though, stays carefully hidden. You are captivating and guarded in the same breath, and trust is everything to you. The risk is becoming so skilled at reading others that you lose track of what you feel, and you end up tired from carrying everyone else's emotions.","けれど、自分自身の心は、慎重に隠しています。人を惹きつけながら、同時に警戒していて、あなたにとっては信頼がすべてです。リスクは、人の気持ちを読む力が高すぎて、自分の気持ちを見失い、ほかの人の感情を背負って疲れ果てることです。"]],"strengths":[["Perception","洞察力","You notice shifts in mood, small signals and what is not being said.","気分の変化、小さなサイン、言われていないことに気づきます。"],["Charm","魅力","People open up to you and want to be liked by you.","人はあなたに心を開き、あなたに好かれたいと思います。"],["Adaptability","順応性","You fit into very different groups without losing your footing.","まったく違う集団にも、足場を失わずになじめます。"]],"blind":[["Absorbing others' moods","人の気分を吸い込む","You carry feelings that are not yours and mistake them for your own.","自分のものではない感情を背負い、自分のものと思い込みます。"],["A hidden self","本心を隠す","Few people see the real you, so closeness stays one-sided.","本当のあなたを見る人が少なく、親しさが片方向になりがちです。"],["Testing trust","信頼を試す","Guardedness can show up as small tests that others fail without knowing.","警戒心が、相手が気づかないうちに落ちてしまう、小さな試験になることがあります。"]],"love":{"attract":["You are drawn to people who are emotionally honest and who do not take advantage of your sensitivity. Someone who is safe, consistent and willing to ask how you really are is rare and precious to you.","感情に正直で、あなたの繊細さを利用しない人に惹かれます。安心できて、一貫していて、「本当はどう？」と聞いてくれる人は、あなたにとって貴重な存在です。"],"pattern":["You are captivating and yet guarded, and trust is everything. The pattern to watch is giving a partner exactly what they need while hiding what you need, until the imbalance wears you out.","人を惹きつけながら、警戒心も強く、信頼がすべてです。注意したいのは、相手の必要を完璧に満たしながら、自分の必要を隠して、その不均衡で疲れ果てることです。"],"try":["This month, tell your partner one need of your own before they guess it.","今月、パートナーが察する前に、自分の必要を一つ、言葉にして伝えてください。"]},"work":{"fit":[["People-centered work: counseling, coaching, hospitality, sales,
